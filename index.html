<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Академия Енота Чека</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: one centred column of "case file" cards with comic ink shadows; home = grid of trainer cards */
:root{
  --paper:#FFF8EC; --card:#FFFDF8; --ink:#1F2A44; --muted:#55607A; --line:#1F2A44; --shadow:#1F2A44;
  --accent:#F07F2E; --accent-ink:#B9530F; --on-accent:#1F2A44; --tint:#EAF2FB;
  --good:#1E7A4C; --good-bg:#E3F4EA; --bad:#B42318; --bad-bg:#FBE7E4;
  --display:'Rubik', Arial, sans-serif; --body:'Nunito', Verdana, sans-serif; --hand:'Caveat', 'Brush Script MT', cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#131A2B; --card:#1C2540; --ink:#F2ECE0; --muted:#AEB8CC; --line:#8C98B3; --shadow:#070B16;
  --accent:#F28C45; --accent-ink:#FFB47A; --on-accent:#1F2A44; --tint:#22304F;
  --good:#6FD39C; --good-bg:#17382A; --bad:#FF8F85; --bad-bg:#3D1F22; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#131A2B; --card:#1C2540; --ink:#F2ECE0; --muted:#AEB8CC; --line:#8C98B3; --shadow:#070B16;
  --accent:#F28C45; --accent-ink:#FFB47A; --on-accent:#1F2A44; --tint:#22304F;
  --good:#6FD39C; --good-bg:#17382A; --bad:#FF8F85; --bad-bg:#3D1F22; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;align-items:center;gap:12px;padding-block:16px;border-bottom:2px solid var(--line)}
header.top .name{font-family:var(--display);font-weight:800;font-size:20px;flex:1;min-width:0}
header.top #logo svg{width:52px;height:52px;flex:none;display:block}
.hud svg{width:22px;height:22px;flex:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;font-weight:800}
h2{font-size:clamp(21px,4vw,26px);line-height:1.25;font-weight:700}
h3{font-size:20px;font-weight:700}
p{margin:0}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.lead{font-size:18px;color:var(--muted);max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:3px solid var(--line);border-radius:14px;padding:12px 22px;font-weight:800;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink)}
.back,.link{background:none;border:none;padding:6px 0;color:var(--accent-ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);padding:22px}
.final{display:flex;gap:18px;align-items:center;text-align:left;width:100%;background:var(--ink);color:var(--paper);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--accent);padding:22px}
.final h2{color:var(--paper)}
.final p{color:var(--paper);opacity:.85}
.final .go{margin-left:auto;font-family:var(--display);font-weight:800;font-size:28px;color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:18px;min-width:0}
.cat:hover{background:var(--tint)}
.cat .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted)}
.cat p{color:var(--muted);font-size:15px}
.best{color:var(--good);font-weight:800}
.note{font-size:14px;color:var(--muted)}
.tip{display:flex;gap:14px;align-items:center;background:var(--tint);border-radius:18px;padding:14px 18px}
.tip svg{width:64px;height:64px;flex:none}
.tip svg.rfull{width:74px;height:96px}
.hero svg.rfull{width:150px;height:193px;flex:none}
.cert svg.rfull{width:130px;height:167px}
@media (max-width:560px){ .hero svg.rfull{width:110px;height:141px} }
.hand{font-family:var(--hand);font-size:26px;line-height:1.15}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.mode{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mode p{color:var(--muted);flex:1}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qcount{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.bar span{display:block;height:100%;background:var(--accent)}
.qcard{display:flex;flex-direction:column;gap:16px}
.ctx{margin:0;background:var(--tint);border-radius:14px;padding:14px 18px;font-size:19px;font-weight:700}
.hint{color:var(--muted);font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:600}
.opt:hover:not(:disabled){background:var(--tint)}
.opt.sel{background:var(--tint);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.tf{flex-direction:row;flex-wrap:wrap}
.tf .opt{flex:1;min-width:150px;text-align:center;font-family:var(--display);font-size:20px}
.chosen{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:8px;min-height:24px}
.chosen li{padding:8px 12px;border:2px dashed var(--line);border-radius:12px;font-weight:600}
.chosen li.right{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.chosen li.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;text-align:left}
.chip:disabled{opacity:.3;cursor:default}
.sort{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.srow p{flex:1;min-width:180px;font-weight:600}
.srow.right{background:var(--good-bg);border-color:var(--good)}
.srow.wrong{background:var(--bad-bg);border-color:var(--bad)}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--card);border:none;padding:8px 14px;font-weight:800}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;max-width:440px;width:100%;user-select:none}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--display);font-weight:700;font-size:clamp(13px,3.6vw,19px);padding:0;display:flex;align-items:center;justify-content:center}
.cell.pick{background:var(--accent);color:var(--on-accent)}
.cell.found{background:var(--good-bg);border-color:var(--good)}
.cell.miss{background:var(--bad-bg);border-color:var(--bad)}
.cell.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.wlist li{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}
.wlist li.done{background:var(--good-bg);border-color:var(--good);text-decoration:line-through}
.fb{border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-bg);border:2px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb-title{font-family:var(--display);font-weight:800;font-size:20px}
.qnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qnav #next{margin-left:auto}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:clamp(48px,12vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:6px;font-weight:700}
.stats .ok{color:var(--good)} .stats .no{color:var(--bad)}
.mark{display:inline-block;background:var(--accent);color:var(--on-accent);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:800}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--tint)}
th{font-family:var(--display)}
td.num{text-align:right;white-space:nowrap}
.mist{display:flex;flex-direction:column;gap:14px}
.mitem{border-left:6px solid var(--bad);background:var(--card);border-radius:0 14px 14px 0;padding:12px 16px;display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--tint);border-bottom:2px solid var(--tint);border-right:2px solid var(--tint)}
.mitem .lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mitem .yours{color:var(--bad);font-weight:700}
.mitem .rightans{color:var(--good);font-weight:700}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.ctx{white-space:pre-line}
.paw{width:1.1em;height:1.1em;fill:currentColor;flex:none;vertical-align:-0.15em}
.hud{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;color:var(--accent-ink)}
.hud-rank{color:var(--muted);font-weight:700;font-size:14px}
@media (max-width:560px){ header.top .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} }
.hud,.modebtn,#home-btn{flex:none;white-space:nowrap}
@media (max-width:560px){
  .hud-rank{display:none}
  header.top{flex-wrap:wrap;gap:8px;padding-block:10px}
  #logo{flex:none}
  header.top #logo svg{width:40px;height:40px}
  header.top .name{font-size:16px;flex:1 1 calc(100% - 60px)}
  header.top .hud{margin-right:auto;padding:4px 10px}
  #home-btn{font-size:14px}
}
.plus{color:var(--good);display:inline-flex;align-items:center;gap:4px;font-size:18px;margin-left:8px}
.pawline{display:flex;align-items:center;gap:10px;font-weight:600}
.pawline .paw{color:var(--accent-ink);width:32px;height:32px}
.pawbig{display:flex;align-items:center;gap:10px;color:var(--accent-ink)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lesson{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;min-width:0}
.lesson:hover{background:var(--tint)}
.lesson .ln{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}
.lesson .lt{flex:1;min-width:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.badge{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px;opacity:.55}
.badge.on{opacity:1;border-style:solid;box-shadow:4px 4px 0 var(--shadow)}
.badge h3{font-size:17px}
.badge p{font-size:14px;color:var(--muted)}
.badge .bstate{font-weight:800;color:var(--muted)}
.badge.on .bstate{color:var(--good)}
.medal{flex:none;width:52px;height:52px;border-radius:50%;background:var(--tint);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.badge.on .medal{background:var(--accent);color:var(--on-accent)}
.medal .paw{width:28px;height:28px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;z-index:10;width:max-content;max-width:calc(100% - 32px)}
.toast-item{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:10px 16px;box-shadow:4px 4px 0 var(--accent);animation:pop .3s ease-out}
.toast-item .paw{color:var(--accent);width:28px;height:28px}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
body.wide .wrap{max-width:none}
#app{width:100%}
.course{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}
.course .stage{max-width:980px;width:100%;justify-self:center}
.navtoggle{display:none}
.side-hide{align-self:flex-start;font-size:14px}
@media (min-width:901px){
  body.side-collapsed .course{grid-template-columns:minmax(0,1fr)}
  body.side-collapsed .side{display:none}
  body.side-collapsed .navtoggle{display:inline-flex;justify-self:start}
}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top, 0px));max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sidehead{display:flex;flex-direction:column;gap:6px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tl-btn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:8px;border-radius:12px}
.tl-btn:hover,.tl.active>.tl-btn{background:var(--tint)}
.tl-dot{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;background:var(--card)}
.tl.done .tl-dot{background:var(--good);border-color:var(--good);color:var(--card)}
.tl.active .tl-dot{background:var(--accent);color:var(--on-accent)}
.tl.lock{opacity:.5}
.tl-txt{display:flex;flex-direction:column;min-width:0;font-size:14px;line-height:1.3}
.tl-txt span{color:var(--muted)}
.tl-steps{list-style:none;margin:2px 0 8px 24px;padding-left:12px;border-left:3px solid var(--tint);display:flex;flex-direction:column;gap:2px}
.tl-step{display:flex;gap:8px;align-items:center;background:none;border:none;text-align:left;padding:5px 8px;border-radius:8px;font-size:14px;width:100%}
.tl-step:hover{background:var(--tint)}
.tl-step.cur{background:var(--accent);color:var(--on-accent);font-weight:800}
.tl-step.done:not(.cur){color:var(--good)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
.tl-dot .ico{width:18px;height:18px}
.sidefoot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-top:2px solid var(--tint);padding-top:10px}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:12px;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:0}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.cur{background:var(--accent)}
.step{display:flex;flex-direction:column;gap:16px}
.steptitle{font-size:clamp(26px,5vw,38px)}
.bigq{font-size:20px;font-weight:700}
.prose{display:flex;flex-direction:column;gap:12px;font-size:18px;min-width:0}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--tint);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile .big{font-family:var(--display);font-size:22px;color:var(--accent-ink)}
.tag{align-self:flex-start;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card)}
.tag.good{background:var(--good-bg);border-color:var(--good)}
.tag.bad{background:var(--bad-bg);border-color:var(--bad)}
.src{color:var(--muted);font-size:14px}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);color:var(--accent-ink)}
.people{width:100%;max-width:440px;height:auto}
.motto{font-family:var(--hand);font-size:28px;line-height:1.15}
.hero{display:flex;gap:18px;align-items:flex-start}
.hero>svg{width:120px;height:120px;flex:none}
@media (max-width:560px){ .hero{flex-direction:column} }
.chain{display:flex;flex-direction:column;gap:8px}
.concl{background:var(--accent);color:var(--on-accent);font-weight:800}
.cz{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-weight:700}
.cz .top{grid-column:1 / -1;background:var(--accent);color:var(--on-accent)}
.cz .no{grid-column:1 / -1;background:var(--bad-bg);border:2px dashed var(--bad);color:var(--bad)}
.comic{display:flex;flex-direction:column;gap:12px}
.bubble{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.bubble.r{align-self:flex-end;flex-direction:row-reverse}
.bubble .ava svg{width:64px;height:64px;display:block}
.bubble>div{background:var(--tint);border:2px solid var(--line);border-radius:18px;padding:10px 14px;min-width:0}
.bubble.r>div{background:var(--card);box-shadow:4px 4px 0 var(--accent)}
.bubble:not([hidden]){animation:pop .3s ease-out}
.who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bubble.r .who{color:var(--accent-ink)}
.msg{background:var(--tint);border-radius:18px;padding:16px;font-size:18px;display:flex;flex-direction:column;gap:6px}
.reveal{background:var(--card);border:2px solid var(--good);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.stepnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:17px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.chk.small{font-size:14px;color:var(--muted)}
.chk.small input{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px}
.cert{border:6px double var(--accent-ink);border-radius:20px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--card)}
.cert>svg{width:120px;height:120px}
.certname{font-family:var(--hand);font-size:44px;line-height:1.1}
.course-card{box-shadow:6px 6px 0 var(--accent)}
.codebox{font:14px/1.4 ui-monospace, Consolas, monospace;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical}
.prof.on{background:var(--tint)}
.form{display:flex;flex-direction:column;gap:14px;max-width:560px}
.modebtn{background:var(--ink);color:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap}
.btn.small{padding:5px 12px;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
details.more{border-top:2px solid var(--tint);padding-top:10px;display:flex;flex-direction:column;gap:10px}
details.more summary{cursor:pointer;font-weight:800;color:var(--accent-ink)}
details.more[open]{display:flex}
.chipf{border:2px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--card);font-weight:800}
.chipf.on{background:var(--accent);color:var(--on-accent)}
.agepick{border:0;padding:0;margin:0}
.agepick legend{font-weight:700;margin-bottom:6px}
.agechips{display:flex;gap:18px;flex-wrap:wrap}
.callout{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:16px 20px;font-size:20px;line-height:1.4}
.goals{background:var(--tint);border-radius:16px;padding:12px 18px;margin-bottom:6px}
.goals ul{margin:6px 0 0;padding-left:20px}
.revtag{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 8px;font-size:11px}
.ohint{display:block;margin-top:3px;font-size:14px;font-weight:600;line-height:1.3;opacity:.75}
.sheet dl{margin:10px 0 0;display:grid;gap:10px}
.sheet dt{font-weight:800}
.sheet dd{margin:0;color:var(--muted)}
.bell{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--card);border:2px solid var(--line);border-radius:999px;color:var(--accent-ink)}
.bell[hidden]{display:none}
.bell .bellico{width:20px;height:20px;stroke-width:2.4}
.bellb{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.inbox{display:flex;flex-direction:column;gap:12px}
.imsg{display:flex;flex-direction:column;gap:8px}
.imsg.new{border-color:var(--accent)}
.chan{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:800;white-space:nowrap}
.chan.off{opacity:.6}
.newb{background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.tchat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px}
.tmsg{max-width:78%;padding:8px 12px;border-radius:14px;border:2px solid var(--line);white-space:pre-line}
.tmsg small{display:block;color:var(--muted);font-size:12px}
.tmsg.in{background:var(--tint);align-self:flex-start}
.tmsg.out{background:var(--card);align-self:flex-end;box-shadow:3px 3px 0 var(--accent)}
select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
@media (max-width:560px){ .modebtn{font-size:12px;padding:5px 10px} }
.err{color:var(--bad);font-weight:700;min-height:1.2em}
.pc-good{color:var(--good);font-weight:800}
.pc-bad{color:var(--bad);font-weight:800}
.pc-none{color:var(--muted)}
.jt th,.jt td,.jt td.num{white-space:nowrap;text-align:center;padding:8px 12px}
.jt th.l,.jt td.l{text-align:left}
.jt tr:nth-child(even) td{background:var(--paper)}
.course-card .bar{border-color:var(--paper);background:transparent}
@media (max-width:900px){
  .course{grid-template-columns:minmax(0,1fr)}
  .navtoggle{display:inline-flex;justify-self:start}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(330px,86vw);max-height:none;border-radius:0 20px 20px 0;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

  {tag:'arg', ctx:'«Все птицы откладывают яйца. Воробей — птица. Значит, воробей откладывает яйца».', q:'Что здесь вывод?', opts:['Воробей откладывает яйца','Все птицы откладывают яйца','Воробей — птица'], a:0, ex:'Вывод идёт после слова «значит».'},

  {tag:'arg', ctx:'«Я возьму зонт, потому что по прогнозу будет дождь».', q:'Что здесь вывод (решение)?', opts:['Я возьму зонт','По прогнозу будет дождь','Здесь нет вывода'], a:0, ex:'Довод — прогноз дождя, вывод — взять зонт.'},
  {tag:'arg', ctx:'«Все жители города Солнечного весёлые. Вася весёлый. Значит, Вася живёт в Солнечном».', q:'Следует ли вывод из доводов?', opts:['Нет: весёлые люди живут и в других городах','Да, вывод точный','Да, если Вася улыбается'], a:0, ex:'Из доводов не следует, что весёлые люди живут только в Солнечном.'},
  {tag:'arg', ctx:'«Все квадраты — прямоугольники. Эта фигура — квадрат. Значит, …»', q:'Какой вывод следует?', opts:['Эта фигура — прямоугольник','Эта фигура — круг','Все прямоугольники — квадраты'], a:0, ex:'Вывод применяет общее правило к этой фигуре.'},
  {tag:'val', ctx:'«Все кошки умеют летать. Мурка — кошка. Значит, Мурка умеет летать».', q:'Что не так?', opts:['Первый довод ложный, поэтому и вывод ложный','Вывод не следует из доводов','Всё правильно'], a:0, ex:'Рассуждение построено по правилам, но кирпич «все кошки летают» — ложный.'},

  {tag:'val', ctx:'«Все планеты Солнечной системы вращаются вокруг Солнца. Земля — планета Солнечной системы. Значит, Земля вращается вокруг Солнца».', q:'Это рассуждение…', opts:['Надёжное: доводы истинны и вывод следует','Ненадёжное: довод ложный','Нелогичное'], a:0, ex:'Здесь всё в порядке: и кирпичи, и дом.'},
  {tag:'val', ctx:'«Если съесть морковку, будешь видеть в темноте как кошка. Я съел морковку. Значит, я вижу в темноте как кошка».', q:'Что не так?', opts:['Первый довод — миф, поэтому вывод ложный','Вывод не следует из доводов','Всё правильно'], a:0, ex:'Морковь полезна, но кошачьего ночного зрения не даёт.'},

  {tag:'ind', ctx:'«Мои три кота любят рыбу. Значит, все коты любят рыбу».', q:'Какой это способ рассуждать?', opts:DI, fixed:true, a:1, ex:'Вывод сделан по нескольким примерам — это индукция, и он может не подтвердиться.'},

  {tag:'ind', q:'Какой вывод надёжнее, если доводы верны?', opts:['Вывод дедукции','Вывод индукции','Они одинаково надёжны'], a:0, ex:'Дедукция при верных доводах даёт точный вывод, индукция — вероятный.'},

  {tag:'if', ctx:'«Если человек — футболист, то он умеет бить по мячу. Петя умеет бить по мячу».', q:'Петя точно футболист?', opts:['Нет: бить по мячу умеют многие','Да, точно'], fixed:true, a:0, ex:'Ловушка обратного хода.'},

{ id:'factopinion', title:'Факт или мнение', kind:'choice',

{ id:'ambiguity', title:'Двусмысленность', kind:'choice',
  short:'Одна фраза — два смысла. Замечаем, где слова можно понять по-разному.',
  intro:'Одна и та же фраза может значить разное. Учимся замечать двусмысленность — в объявлениях, рекламе и разговорах — и говорить так, чтобы нас поняли правильно.',
  tip:'Спроси себя: «А можно понять это иначе?» Особенно когда читаешь рекламу.',
  items:[
  {ctx:'«Я видел девочку в бинокль.»', q:'Почему эту фразу можно понять по-разному?', opts:['Непонятно, у кого бинокль: у меня или у девочки','Непонятно, какого цвета бинокль','Непонятно, когда это было'], a:0, ex:'Либо я смотрел в бинокль, либо видел девочку, у которой был бинокль.'},
  {ctx:'«Казнить нельзя помиловать»', q:'Что решает, казнить или помиловать?', opts:['Где поставить запятую','Каким шрифтом это написано','Сколько в тексте слов'], a:0, ex:'«Казнить, нельзя помиловать» и «Казнить нельзя, помиловать» — противоположные решения.'},
  {ctx:'«Мальчик долго рассматривал старинный замок.»', q:'Какое слово можно понять двумя способами?', opts:['замок','мальчик','долго'], a:0, ex:'зАмок — дворец, замОк — устройство на двери.'},
  {ctx:'«Петя встретил Васю, когда он шёл из школы.»', q:'Кто шёл из школы?', opts:['Непонятно: и Петя, и Вася','Только Петя','Только Вася'], a:0, ex:'Слово «он» может относиться к любому из мальчиков.'},
  {ctx:'«Учитель попросил ученика принести его тетрадь.»', q:'Чью тетрадь нужно принести?', opts:['Непонятно: учителя или ученика','Только учителя','Только ученика'], a:0, ex:'«Его» подходит к обоим. Яснее сказать: «свою тетрадь» или «тетрадь учителя».'},
  {ctx:'«Солнце закрыло облако.»', q:'Что здесь произошло, если читать только по словам?', opts:['Непонятно, что что закрыло: облако солнце или солнце облако','Солнце погасло','Пошёл дождь'], a:0, ex:'Слова «солнце» и «облако» выглядят одинаково в обеих ролях. Здравый смысл подсказывает: облако закрыло солнце.'},
  {ctx:'«Девочка ехала на велосипеде в шляпе.»', q:'Как сказать, чтобы не было смешного второго смысла?', opts:['«Девочка в шляпе ехала на велосипеде»','«На велосипеде в шляпе ехала девочка»','«В шляпе ехал велосипед с девочкой»'], a:0, ex:'Ставим «в шляпе» рядом с тем, к кому это относится.'},
  {ctx:'«Он нашёл ключ.»', q:'Что может значить слово «ключ»?', opts:['Ключ от замка, родник или разгадку задачи','Только ключ от двери','Только музыкальный знак'], a:0, ex:'Многозначные слова понятны только из контекста.'},
  {ctx:'«Наш сок — это 100% вкуса!»', q:'Что на самом деле обещает реклама?', opts:['Ничего проверяемого: «100% вкуса» нельзя измерить','Что сок на 100% из фруктов','Что сок полезнее воды'], a:0, ex:'Звучит как цифра, но это не факт. Состав сока написан на упаковке.'},
  {ctx:'«Скидки до 70%!»', q:'Значит ли это, что всё стоит на 70% дешевле?', opts:['Нет: «до» значит, что скидка может быть и 5%','Да, на все товары','Да, но только сегодня'], a:0, ex:'Слово «до» прячет главное: 70% может быть на один-единственный товар.'},
  {ctx:'«Врачи рекомендуют!»', q:'Что здесь непонятно?', opts:['Какие врачи, сколько их и где это написано','Кто такие врачи','Ничего, всё понятно'], a:0, ex:'Расплывчатая ссылка на авторитет — повод спросить: «Кто именно?»'},
  {ctx:'«Это мука!»', q:'Как можно прочитать эту фразу?', opts:['мУка (страдание) или мукА (из зерна)','Только про муку для блинов','Только про страдание'], a:0, ex:'Смысл меняет ударение. В письменной речи помогает контекст.'},
  {ctx:'«Вася сказал Пете, что его выгнали из команды.»', q:'Кого выгнали из команды?', opts:['Непонятно: Васю или Петю','Точно Васю','Точно Петю'], a:0, ex:'Слово «его» может относиться к обоим.'},
  {ctx:'«Каждый второй покупатель получает подарок!»', q:'Что здесь неясно?', opts:['Как считают «каждого второго» и хватит ли подарков','Что такое подарок','Всё ясно'], a:0, ex:'Перед покупкой стоит прочитать условия акции целиком.'},
  {ctx:'«Вечером мне позвонила подруга из Москвы.»', q:'Что можно понять двумя способами?', opts:['Подруга живёт в Москве или звонила, находясь в Москве','Когда был звонок','Кто кому звонил'], a:0, ex:'«Из Москвы» может относиться к подруге или к звонку.'},
  {ctx:'«В библиотеке выдают старые книги и журналы.»', q:'Что здесь двусмысленно?', opts:['Старые только книги или журналы тоже','Где находится библиотека','Сколько стоят книги'], a:0, ex:'Непонятно, к чему относится слово «старые».'},
  {ctx:'«Мальчик съел на обед котлету и пирожок с мамой.»', q:'Почему фраза звучит смешно?', opts:['Можно понять, что пирожок был «с мамой» вместо начинки','Мальчик съел слишком много','В ней нет глагола'], a:0, ex:'Лучше: «Мальчик вместе с мамой съел на обед котлету и пирожок».'},
  {ctx:'Подруга посмотрела на тебя и сказала: «Ну, классная причёска…»', q:'Как понять, похвала это или насмешка?', opts:['По интонации, выражению лица и ситуации','Только по словам','Никак нельзя понять'], a:0, ex:'Одни и те же слова могут значить противоположное. Если не уверен — переспроси.'},
  {ctx:'«Покупайте наш лимонад: в нём нет ничего лишнего!»', q:'Что не так с этим обещанием?', opts:['Непонятно, что считается «лишним»; надо смотреть состав','Лимонад не бывает вкусным','Всё ясно и честно'], a:0, ex:'Размытые слова звучат хорошо, но ничего конкретного не обещают.'},
  {ctx:'«Подросткам наш новый телефон нравится всё больше!»', q:'Что здесь упущено?', opts:['Больше, чем что? Кто это считал и как?','Как зовут подростков','Какого цвета телефон'], a:0, ex:'Сравнение без «чем» — частая уловка рекламы.'},
  {ctx:'«Продаём новые и подержанные велосипеды и самокаты.»', q:'Подержанными могут быть…', opts:['Непонятно: только велосипеды или самокаты тоже','Только самокаты','Только велосипеды'], a:0, ex:'Чтобы не путать, пишут точнее: «подержанные велосипеды и новые самокаты».'},
  {ctx:'Объявление: «Библиотека закрыта в понедельник».', q:'Есть ли здесь двусмысленность?', opts:['Нет, смысл один: в понедельник библиотека не работает','Да: непонятно, какая библиотека','Да: можно понять, что закрыты только книги'], a:0, ex:'Не всё двусмысленно! Хороший детектив не придумывает загадку там, где её нет.'},
  {ctx:'«Я не могу не прийти.»', q:'Что это значит?', opts:['Я обязательно приду','Я не приду','Я не знаю, приду ли'], a:0, ex:'Два «не» гасят друг друга: «не могу не прийти» = «точно приду».'}
]},
{ id:'conditions', title:'При каких условиях', kind:'choice',
  short:'Многое верно не всегда. Находим условия, при которых утверждение правда.',
  intro:'Многие утверждения верны не всегда, а только при определённых условиях. Учимся находить эти условия и не попадаться на слова «всегда» и «никогда».',
  tip:'Перед словами «всегда» и «никогда» включай детектор: часто правильный ответ — «иногда».',
  items:[
  {ctx:'«Вода кипит при 100 °C».', q:'При каком условии это верно?', opts:['При обычном атмосферном давлении, как на уровне моря','Всегда и везде','Только если вода солёная'], a:0, ex:'В горах давление ниже, и вода закипает при более низкой температуре.'},
  {ctx:'«Лёд тает».', q:'При каком условии?', opts:['Когда температура выше 0 °C','Когда наступает ночь','Всегда'], a:0, ex:'Обычный лёд плавится при температуре выше нуля.'},
  {ctx:'«Чем больше учишь, тем лучше оценки».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Часто, но важно и как учишь: понимаешь ли материал, высыпаешься ли.'},
  {ctx:'«Растение растёт».', q:'Что ему для этого нужно?', opts:['Свет, вода, тепло и питательные вещества','Только темнота','Только музыка'], a:0, ex:'Без света большинство растений не может создавать себе питание.'},
  {ctx:'«Железный гвоздь ржавеет».', q:'При каком условии?', opts:['Когда есть влага и воздух','Только в темноте','Когда его красят'], a:0, ex:'Ржавчина появляется, когда железо реагирует с кислородом и водой. Краска, наоборот, защищает.'},
  {ctx:'«Число, которое делится на 2, — чётное».', q:'Это верно…', opts:AL, fixed:true, a:0, ex:'Это и есть определение чётного числа.'},
  {ctx:'«Сумма двух нечётных чисел — нечётная».', q:'Это верно…', opts:AL, fixed:true, a:2, ex:'3 + 5 = 8, 7 + 9 = 16. Сумма двух нечётных чисел всегда чётная.'},
  {ctx:'«Квадрат — это прямоугольник».', q:'Это верно…', opts:AL, fixed:true, a:0, ex:'У квадрата все углы прямые, значит, он прямоугольник.'},
  {ctx:'«Прямоугольник — это квадрат».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Только если все его стороны равны.'},
  {ctx:'«Летом жарко».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Обычно да, но не в Антарктиде и не в холодное дождливое лето.'},
  {ctx:'«Ночью темно».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'За Полярным кругом летом бывает полярный день: солнце не заходит круглые сутки.'},
  {ctx:'«Металлический предмет тонет в воде».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Гвоздь тонет, а огромный стальной корабль плавает благодаря своей форме.'},
  {ctx:'«Если сложить два числа, получится больше каждого из них».', q:'При каком условии это верно?', opts:['Если оба числа больше нуля','Всегда','Если числа одинаковые'], a:0, ex:'5 + 0 = 5, а 5 + (−2) = 3 — это меньше пяти.'},
  {ctx:'«Если умножить число на 2, оно увеличится».', q:'При каком условии?', opts:['Если число больше нуля','Всегда','Если число чётное'], a:0, ex:'0 × 2 = 0, а −3 × 2 = −6, и это меньше, чем −3.'},
  {ctx:'«Звук слышен».', q:'Что нужно, чтобы звук дошёл до уха?', opts:['Среда: воздух, вода или твёрдое тело','Яркий свет','Ничего не нужно'], a:0, ex:'В безвоздушном космосе звук не распространяется.'},
  {ctx:'«Магнит притягивает предмет».', q:'При каком условии?', opts:['Если предмет из железа, никеля или кобальта','Если предмет деревянный','Всегда, из чего бы он ни был'], a:0, ex:'Алюминиевую банку или деревянную ложку магнит не притянет.'},
  {ctx:'«Свеча горит».', q:'Что для этого нужно?', opts:['Кислород из воздуха','Темнота','Вода'], a:0, ex:'Если накрыть свечу банкой, она погаснет, когда закончится кислород.'},
  {ctx:'«Покупать со скидкой — выгодно».', q:'При каком условии?', opts:['Если вещь действительно нужна и цену не завысили перед скидкой','Всегда','Если ценник красного цвета'], a:0, ex:'Купить ненужное со скидкой — не экономия, а лишняя трата.'},
  {ctx:'«Совету из интернета можно следовать».', q:'При каком условии?', opts:['Если источник надёжный и совет подтверждают другие','Если у видео много лайков','Если совет написан капсом'], a:0, ex:'Лайки показывают популярность, а не правдивость.'},
  {ctx:'«Сообщению "Срочно перешли всем!" можно поверить».', q:'При каком условии?', opts:['Если то же самое подтверждает официальный источник','Если его прислал друг','Если в нём много восклицательных знаков'], a:0, ex:'Друг мог и сам поверить слуху.'},
  {ctx:'«Кошка приземляется на лапы».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Часто, но не всегда: многое зависит от высоты и положения тела.'},
  {ctx:'«Самолёт взлетает».', q:'Что для этого нужно?', opts:['Скорость, при которой крылья создают подъёмную силу','Только хорошая погода','Только пилот в форме'], a:0, ex:'Набегающий поток воздуха создаёт подъёмную силу на крыльях.'},
  {ctx:'«У треугольника есть прямой угол».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Только у прямоугольного треугольника.'}
]},
{ id:'attention', title:'Внимательность и наблюдательность', kind:'choice',
  short:'Считаем, сравниваем, замечаем отличия и закономерности.',
  intro:'Детектив замечает то, что другие пропускают. Здесь нужно считать, сравнивать, находить отличия, лишнее и закономерности.',
  tip:'Не торопись. Читай медленно и проверяй по одному символу.',
  items:[
  {q:'Сколько раз встречается буква «о» в слове «обороноспособность»?', opts:['7','6','5','8'], a:0, ex:'о-б-о-р-о-н-о-с-п-о-с-о-б-н-о-с-т-ь: семь букв «о».'},
  {ctx:'7 3 9 1 5 8 2   →   7 3 9 7 5 8 2', q:'Какая по счёту цифра отличается?', opts:['4-я','2-я','6-я','Все одинаковые'], a:0, ex:'В первой строке на 4-м месте 1, во второй — 7.'},
  {q:'Сколько букв «а» в предложении «Карандаш упал на пол»?', opts:['5','4','3','6'], a:0, ex:'Кар-а-нд-а-ш — три, уп-а-л — одна, н-а — одна.'},
  {ctx:'«Париж весной весной прекрасен»', q:'Что не так в этой фразе?', opts:['Слово «весной» написано дважды','Неправильно написано «Париж»','Всё в порядке'], a:0, ex:'Мозг часто «проглатывает» повторы. Читай медленно!'},
  {q:'Сколько всего квадратов на доске 2 × 2 клетки?', opts:['5','4','2','6'], a:0, ex:'4 маленьких и 1 большой.'},
  {q:'Сколько раз встречается цифра 1 в числах от 1 до 20?', opts:['12','11','10','13'], a:0, ex:'1, 10, 11 (две единицы), 12, 13, 14, 15, 16, 17, 18, 19 — всего 12.'},
  {ctx:'понедельник, вторник, четверг, среда, пятница', q:'Что не так?', opts:['Среда и четверг поменялись местами','Пропущено воскресенье','Всё правильно'], a:0, ex:'Правильный порядок: понедельник, вторник, среда, четверг, пятница.'},
  {ctx:'ДЕТЕКТИВ   →   ДЕТЕКИТВ', q:'Чем отличается второе слово?', opts:['Переставлены буквы Т и И','Пропущена буква Е','Ничем'], a:0, ex:'ДЕТЕК-ТИ-В и ДЕТЕК-ИТ-В.'},
  {q:'Сколько ног у трёх кошек и двух кур вместе?', opts:['16','20','10','14'], a:0, ex:'3 × 4 = 12, 2 × 2 = 4, всего 16.'},
  {q:'Какая буква в слове «НАБЛЮДАТЕЛЬНОСТЬ» стоит пятой?', opts:['Ю','Л','Д','Б'], a:0, ex:'Н-А-Б-Л-Ю.'},
  {q:'Сколько слогов в слове «внимательность»?', opts:['4','3','5','6'], a:0, ex:'Сколько гласных — столько слогов: вни-ма-тель-ность.'},
  {ctx:'А А Б А А Б А А Б …', q:'Какая буква будет 10-й?', opts:['А','Б','В'], a:0, ex:'Узор повторяется каждые 3 буквы. 10-я — первая в новой тройке, то есть А.'},
  {q:'Сегодня понедельник. Какой день недели будет через 10 дней?', opts:['Четверг','Среда','Пятница','Понедельник'], a:0, ex:'Через 7 дней снова понедельник, ещё через 3 — четверг.'},
  {ctx:'Образец: 3Б7Г9Д', q:'Какая строка точно совпадает с образцом?', opts:['3Б7Г9Д','3Б7Г6Д','3В7Г9Д','3Б1Г9Д'], a:0, ex:'Сверяй по одному символу слева направо.'},
  {q:'Сколько раз встречается буква «к» в скороговорке «Карл у Клары украл кораллы»?', opts:['4','3','5','2'], a:3, ex:'Вопрос на внимательность: в кавычках стоит строчная «к». Она есть только в словах «украл» и «кораллы» — значит, 2. В словах «Карл» и «Клары» стоит заглавная «К» — это другое написание, её не считаем.'},
  {q:'Какой сигнал светофора находится сверху?', opts:['Красный','Зелёный','Жёлтый'], a:0, ex:'Сверху — красный, самый важный сигнал.'},
  {q:'Сколько гласных букв в слове «детектив»?', opts:['3','2','4'], a:0, ex:'д-Е-т-Е-к-т-И-в.'},
  {ctx:'2, 4, 8, 16, …', q:'Какое число следующее?', opts:['32','24','18','20'], a:0, ex:'Каждое число в 2 раза больше предыдущего.'},
  {ctx:'1, 4, 9, 16, 25, …', q:'Какое число следующее?', opts:['36','30','35','49'], a:0, ex:'Это квадраты чисел: 1, 2², 3², 4², 5², а дальше 6² = 36.'},
  {ctx:'яблоко, груша, морковь, слива', q:'Что здесь лишнее?', opts:['морковь','груша','слива'], a:0, ex:'Морковь — овощ, остальное — фрукты.'},
  {ctx:'2, 4, 7, 8, 10', q:'Какое число лишнее?', opts:['7','2','10','8'], a:0, ex:'Все числа чётные, кроме 7.'},
  {q:'Сколько букв в слове «алфавит»?', opts:['7','6','8'], a:0, ex:'а-л-ф-а-в-и-т.'},
  {ctx:'КОТ, ТОК, КТО, ОКТ', q:'Какое сочетание не является словом?', opts:['ОКТ','ТОК','КТО','КОТ'], a:0, ex:'Все четыре составлены из одних и тех же букв, но слово есть только у трёх.'}
]},
{ id:'wit', title:'Задачи на смекалку', kind:'choice',
  short:'Задачи-ловушки: ответ простой, но мозг спешит ошибиться.',
  intro:'В этих задачах ответ простой, но мозг спешит и выдаёт неправильный. Тренируем привычку перечитывать условие.',
  tip:'Перечитай условие. Ловушка обычно спрятана в одном слове.',
  items:[
  {q:'В скольких месяцах года есть 28-е число?', opts:['12','1','6'], a:0, ex:'28-е число есть в каждом месяце. Многие спешат и думают только о феврале.'},
  {q:'Что тяжелее: килограмм ваты или килограмм железа?', opts:['Одинаково','Железо','Вата'], a:0, ex:'Килограмм — он и есть килограмм.'},
  {q:'У пастуха было 17 овец. Все, кроме 9, убежали. Сколько осталось?', opts:['9','8','17','0'], a:0, ex:'«Все, кроме 9» — значит, 9 остались.'},
  {q:'Ты бежишь в забеге и обогнал того, кто был вторым. Каким ты стал?', opts:['Вторым','Первым','Третьим'], a:0, ex:'Ты занял его место — второе.'},
  {q:'Сколько концов у двух с половиной палок?', opts:['6','5','4'], a:0, ex:'Половина палки — тоже палка с двумя концами. 3 палки × 2 = 6.'},
  {q:'Батон разрезали на 3 части. Сколько сделали разрезов?', opts:['2','3','4'], a:0, ex:'Каждый разрез добавляет один кусок.'},
  {q:'Петух снёс яйцо на крыше. В какую сторону оно скатится?', opts:['Петухи не несут яиц','Влево','Вправо'], a:0, ex:'Яйца несут курицы.'},
  {q:'Сколько земли в яме размером 1 × 1 × 1 метр?', opts:['Нисколько — яма пустая','1 кубометр','1 тонна'], a:0, ex:'Яма — это место, где земли нет.'},
  {q:'У отца Маши пять дочерей: Чача, Чече, Чичи, Чочо. Как зовут пятую?', opts:['Маша','Чучу','Чаче'], a:0, ex:'Ответ спрятан в самом начале условия.'},
  {q:'Тройка лошадей проскакала 30 км. Сколько проскакала каждая лошадь?', opts:['30 км','10 км','90 км'], a:0, ex:'Они скакали вместе, рядом друг с другом.'},
  {q:'Что можно приготовить, но нельзя съесть?', opts:['Уроки','Суп','Кашу'], a:0, ex:'Уроки готовят, но не едят.'},
  {q:'Самолёт упал точно на границе двух стран. Где похоронят выживших?', opts:['Выживших не хоронят','В первой стране','Во второй стране'], a:0, ex:'Ловушка внимания: выжившие живы.'},
  {q:'Гусь стоит на одной ноге и весит 2 кг. Сколько он будет весить, стоя на двух ногах?', opts:['2 кг','4 кг','1 кг'], a:0, ex:'Вес не зависит от того, на скольких ногах стоишь.'},
  {q:'Две матери и две дочери съели три апельсина, и каждой достался целый. Как так?', opts:['Это бабушка, мама и дочка','Один апельсин разрезали','Одна из них не ела'], a:0, ex:'Мама — одновременно и мать, и дочь.'},
  {q:'В каждом углу комнаты сидит кошка. Напротив каждой кошки сидят три кошки. Сколько кошек в комнате?', opts:['4','12','16'], a:0, ex:'Каждая кошка видит трёх остальных.'},
  {q:'Одно яйцо варится 4 минуты. Сколько минут варить три яйца?', opts:['4','12','8'], a:0, ex:'Их можно варить вместе в одной кастрюле.'},
  {q:'К половине от двух прибавили два. Сколько получилось?', opts:['3','2','4'], a:0, ex:'Половина от двух — 1. 1 + 2 = 3.'},
  {q:'Улитка ползёт на столб высотой 3 м: днём поднимается на 2 м, ночью сползает на 1 м. За сколько дней она доберётся до верха?', opts:['За 2 дня','За 3 дня','За 1 день'], a:0, ex:'После первых суток она на высоте 1 м. На второй день поднимается ещё на 2 м — и она наверху.'},
  {q:'Мальчик упал с 10-метровой лестницы и не ушибся. Как?', opts:['Он упал с нижней ступеньки','Ему просто повезло','Лестница была мягкой'], a:0, ex:'В условии не сказано, что он упал с самого верха.'},
  {q:'Сейчас полночь, идёт дождь. Можно ли ожидать, что через 72 часа будет солнечно?', opts:['Нет: через 72 часа снова будет полночь','Да','Только летом'], a:0, ex:'72 часа — ровно трое суток.'},
  {q:'Какая цифра становится больше, если её перевернуть вверх ногами?', opts:['6','8','1'], a:0, ex:'6 превращается в 9.'},
  {q:'Летели три страуса. Одного подстрелили. Сколько осталось?', opts:['Страусы не летают','2','3'], a:0, ex:'Ловушка спрятана в первом слове: страусы не умеют летать.'},
  {q:'Сколько яиц можно съесть натощак?', opts:['Одно: остальные уже не натощак','Три','Сколько угодно'], a:0, ex:'«Натощак» — значит на пустой желудок, а после первого яйца он уже не пустой.'},
  {q:'В каком году люди едят больше, чем обычно?', opts:['В високосном: в нём на день больше','В новом','В любом'], a:0, ex:'В високосном году 366 дней.'},
  {q:'Один пастух смотрит на север, другой — на юг. Как они могут увидеть друг друга, не поворачиваясь?', opts:['Они стоят лицом друг к другу','Никак','С помощью зеркала'], a:0, ex:'Если первый стоит южнее второго, они как раз смотрят друг на друга.'},
  {q:'Как далеко заяц может забежать в лес?', opts:['До середины: дальше он уже выбегает из леса','Сколько захочет','На километр'], a:0, ex:'После середины заяц бежит уже из леса, а не в лес.'},
  {q:'Чем её больше, тем меньше видно. Что это?', opts:['Темнота','Свет','Солнце'], a:0, ex:'Чем темнее, тем хуже видно.'},
  {q:'Врач дал три таблетки и сказал пить по одной каждые полчаса. Через сколько минут ты выпьешь все?', opts:['Через 60 минут','Через 90 минут','Через 30 минут'], a:0, ex:'Первую пьёшь сразу, вторую — через 30 минут, третью — через 60.'},
  {q:'Чему равно произведение всех цифр от 0 до 9?', opts:['0','45','362 880'], a:0, ex:'Среди множителей есть 0, а всё, что умножено на ноль, равно нулю.'}
]},

{ id:'believe', title:'Верю — не верю: как проверить?', kind:'choice',
  q:'Как лучше всего проверить, правда это или миф?',
  short:'Знаменитые «факты»: учимся выбирать, как их проверить.',
  intro:'Знаменитые «факты» все повторяют, но не все они правда. Здесь важно не угадать, а выбрать лучший способ проверки. А в объяснении узнаешь, правда это или миф.',
  tip:'«Все так говорят», «видел в мультике» и «звучит логично» — не проверка. Ищи, кто изучал это всерьёз.',
  items:[
  {ctx:'Страусы прячут голову в песок, когда боятся.', opts:['Посмотреть, что пишут зоологи или энциклопедия о животных','Раз это знают все — значит, правда','Найти мультфильм, где страус прячет голову'], a:0, ex:'Миф. Страусы опускают голову к земле, чтобы переворачивать яйца, а при опасности убегают. Мультфильм — не доказательство.'},
  {ctx:'У осьминога три сердца.', opts:['Найти статью биолога или энциклопедию','Спросить в чате, кто-нибудь об этом слышал','Не верить: так не бывает'], a:0, ex:'Правда: два сердца качают кровь через жабры, третье — по всему телу. «Так не бывает» — это не проверка, а догадка.'},
  {ctx:'Великую Китайскую стену видно с Луны невооружённым глазом.', opts:['Найти, что рассказывают космонавты и что видно на снимках с Луны','Поверить, раз об этом пишут уже много лет','Найти стену на карте мира'], a:0, ex:'Миф. С Луны стену не разглядеть. «Пишут много лет» — не доказательство.'},
  {ctx:'Молния никогда не бьёт дважды в одно место.', opts:['Узнать у метеорологов, сколько раз в год молния бьёт в высокие башни','Поверить пословице','В грозу один раз посмотреть в окно'], a:0, ex:'Миф. В высокие башни молния бьёт много раз в год. Одного наблюдения мало.'},
  {ctx:'Мёд может храниться тысячи лет и не испортиться.', opts:['Почитать, что археологи находили в древних гробницах','Оставить мёд на неделю и посмотреть','Поверить надписи на банке мёда'], a:0, ex:'Правда. Мёд находили в древнеегипетских гробницах. Неделя — слишком короткий опыт для такого вывода.'},
  {ctx:'Летучие мыши слепые.', opts:['Найти, что учёные выяснили о зрении летучих мышей','Раз так говорят все — значит, правда','Спросить одноклассника'], a:0, ex:'Миф. Летучие мыши видят, а в темноте ещё и ориентируются с помощью эхолокации.'},
  {ctx:'Золотая рыбка помнит только последние 3 секунды.', opts:['Узнать про опыты учёных: учили ли рыбок что-то запоминать','Минуту посмотреть на рыбку в аквариуме','Поверить смешному мему'], a:0, ex:'Миф. В опытах рыбки запоминали сигналы на месяцы. По одной минуте наблюдения такого не понять.'},
  {ctx:'Вода в раковине закручивается в разные стороны в Северном и Южном полушариях из-за вращения Земли.', opts:['Проверить самому: много раз спустить воду и посмотреть, всегда ли она крутится в одну сторону','Поверить видео путешественника на экваторе','Это сложная наука, проверить нельзя'], a:0, ex:'Миф. Направление зависит от формы раковины. Простой опыт дома это покажет.'},
  {ctx:'Бананы растут не на деревьях, а на огромной траве.', opts:['Посмотреть в справочнике по растениям, есть ли у банана деревянный ствол','Раз растёт высоко — значит, дерево','Спросить продавца фруктов'], a:0, ex:'Правда. У банана нет древесного ствола — это гигантское травянистое растение.'},
  {ctx:'Человек использует только 10% своего мозга.', opts:['Узнать, что показывают снимки мозга, которые делают учёные','Поверить, раз это сказали в фильме','Это известный факт — проверять не нужно'], a:0, ex:'Миф. Снимки показывают, что работают все отделы мозга. «Известный факт» тоже нужно проверять.'},
  {ctx:'Венера вращается вокруг своей оси в обратную сторону по сравнению с Землёй.', opts:['Найти данные астрономов, например на сайте планетария','Один вечер посмотреть на Венеру в небе','Поверить, раз звучит научно'], a:0, ex:'Правда. «Звучит научно» — не доказательство, но здесь астрономы это подтвердили.'},
  {ctx:'Хамелеоны меняют цвет только для того, чтобы слиться с фоном.', opts:['Почитать, что пишут биологи, наблюдавшие за хамелеонами','Посмотреть мультфильм про хамелеона','Раз все так думают — значит, правда'], a:0, ex:'Миф. Чаще всего цвет меняется, чтобы «общаться» с другими хамелеонами и греться.'},
  {ctx:'Акулы появились на Земле раньше деревьев.', opts:['Сравнить по данным учёных, когда появились первые акулы и первые деревья','Такого не может быть — значит, неправда','Поверить интересному посту'], a:0, ex:'Правда: акулы — более 400 млн лет назад, первые деревья — около 385 млн. Удивительное не значит ложное.'},
  {ctx:'Быки злятся именно из-за красного цвета.', opts:['Узнать, различают ли быки красный цвет и что показали опыты с плащами разного цвета','Поверить, раз у матадора красный плащ','Спросить друга'], a:0, ex:'Миф. Быка раздражает движение плаща, а не цвет.'},
  {ctx:'Если считать от подножия на дне океана, гора Мауна-Кеа выше Эвереста.', opts:['Сравнить высоту гор от подножия по данным географов','Эверест самый высокий — это все знают','Поверить, раз это показали в видео'], a:0, ex:'Правда: от подножия Мауна-Кеа выше 10 км. А над уровнем моря выше Эверест — важно, как считать.'},
  {ctx:'Если проглотить арбузную косточку, в животе вырастет арбуз.', opts:['Почитать, что пишут врачи о том, как переваривается еда','Раз так пугают многие взрослые — правда','Поверить старшему брату'], a:0, ex:'Миф. Семечке в животе не прорасти: там нет ни света, ни почвы.'},
  {ctx:'У улитки есть зубы.', opts:['Посмотреть в энциклопедии увеличенное фото языка улитки','Я смотрел на улитку и зубов не видел — значит, их нет','Звучит странно — значит, неправда'], a:0, ex:'Правда: на языке-тёрке тысячи крошечных зубчиков. «Не вижу» не значит «нет».'},
  {ctx:'Проглоченная жвачка остаётся в желудке на 7 лет.', opts:['Спросить врача или почитать, что пишут медики','Поверить, раз так говорят родители','Раз звучит страшно — правда'], a:0, ex:'Миф. Жвачка не переваривается, но выходит за несколько дней. Глотать её всё равно не стоит.'},
  {ctx:'На Марсе есть вулкан выше Эвереста.', opts:['Найти данные космических агентств о горе Олимп','На Марсе гор нет — значит, неправда','Поверить мультфильму про космос'], a:0, ex:'Правда: гора Олимп на Марсе примерно в 2,5 раза выше Эвереста.'},
  {ctx:'Собаки видят мир только чёрно-белым.', opts:['Узнать, что выяснили учёные в опытах со зрением собак','Спросить у собаки','Раз так пишут в мемах — правда'], a:0, ex:'Миф. Собаки различают цвета, хотя и хуже людей: например, синий и жёлтый.'},
  {ctx:'В открытом космосе звук не распространяется.', opts:['Узнать у физиков, может ли звук идти без воздуха, и посмотреть опыт со звонком под колпаком','В фильмах взрывы в космосе громкие — значит, слышно','Поверить на слово'], a:0, ex:'Правда. Звуку нужна среда. Фильмы снимают для зрелищности, а не для точности.'},
  {ctx:'Летом тепло, потому что Земля ближе всего к Солнцу.', opts:['Узнать, когда Земля ближе всего к Солнцу, и сравнить с временами года','Логично же: ближе — значит теплее','Поверить однокласснику'], a:0, ex:'Миф. Ближе всего к Солнцу Земля в январе. «Звучит логично» ещё не значит «правда».'},
  {ctx:'Коала — это медведь.', opts:['Посмотреть, к какой группе животных её относят зоологи','Похожа на мишку — значит, медведь','Её же называют «мишка коала» — значит, медведь'], a:0, ex:'Миф. Коала — сумчатое, родственник кенгуру. Похожесть и название — не доказательство.'}
]},
{ id:'fake', title:'Правда или фейк', kind:'choice', fixed:true, tf:true,
  opts:['Похоже на правду','Похоже на фейк'], q:'Как ты думаешь?',
  short:'Сообщения, новости и звонки: можно ли им доверять?',
  intro:'Перед тобой сообщения, новости, звонки и объявления. Реши, похоже это на правду или на фейк, и найди признаки, которые тебе подсказали.',
  tip:'Срочно + страшно (или очень выгодно) + «никому не говори» = почти наверняка фейк.',
  items:[
  {ctx:'«СРОЧНО! В нашем городе раздают бесплатные айфоны — переходи по ссылке и введи данные карты!»', a:1, ex:'Фейк. Бесплатный подарок, срочность и просьба ввести данные карты — классическая ловушка.'},
  {ctx:'На официальном сайте школы опубликовано расписание каникул, есть дата и подпись директора.', a:0, ex:'Правда: официальный источник, понятно кто и когда опубликовал.'},
  {ctx:'Блог «Супер-факты»: «Учёные доказали: мороженое на ночь помогает вырасти на 10 см!»', a:1, ex:'Фейк. Неизвестный блог, нет ссылки на исследование и обещание чуда.'},
  {ctx:'СМС: «Госуслуги. Назовите код из СМС нашему оператору, иначе аккаунт заблокируют».', a:1, ex:'Фейк. Ни Госуслуги, ни банки не просят называть коды. Код из СМС — никому.'},
  {ctx:'Метеослужба предупреждает о сильном ветре завтра; то же сообщают несколько новостных сайтов.', a:0, ex:'Правда: официальная служба и несколько независимых подтверждений.'},
  {ctx:'Видео: «Положили гвоздь в стакан колы — за ночь он полностью растворился!»', a:1, ex:'Фейк. Кислоты в коле слишком мало, чтобы растворить гвоздь за ночь.'},
  {ctx:'Аккаунт друга пишет: «Займи 3000 до вечера, скинь на эту карту, родителям не говори».', a:1, ex:'Фейк. Аккаунт могли взломать. Позвони другу по телефону и спроси сам.'},
  {ctx:'Классный руководитель написал в электронном дневнике, что родительское собрание переносится на четверг.', a:0, ex:'Правда: знакомый человек и официальный канал школы.'},
  {ctx:'Скриншот без ссылки: «С 1 сентября в России отменяют все домашние задания!»', a:1, ex:'Фейк: нет первоисточника. Такие новости проверяют на официальных сайтах.'},
  {ctx:'Звонок: «Это служба безопасности банка. С вашей карты крадут деньги — срочно переведите их на безопасный счёт».', a:1, ex:'Фейк. «Безопасных счетов» не бывает, это любимая схема мошенников. Положи трубку и позвони в банк сам.'},
  {ctx:'На сайте музея и в городской газете написано, что открылась выставка динозавров.', a:0, ex:'Правда: официальный сайт и независимое подтверждение.'},
  {ctx:'Фото: «Акула плывёт по затопленной улице после урагана!»', a:1, ex:'Похоже на фейк. Такие фото не раз оказывались монтажом. Проверь их поиском по картинке.'},
  {ctx:'«Розыгрыш! Подпишись, сделай репост и отправь 100 ₽ за доставку приза».', a:1, ex:'Фейк. Настоящий розыгрыш не требует платить за приз.'},
  {ctx:'В учебнике физики написано, что свет распространяется быстрее звука.', a:0, ex:'Правда. Поэтому мы видим молнию раньше, чем слышим гром.'},
  {ctx:'«Перешли это 10 друзьям — и тебе повезёт. Не перешлёшь — случится беда!»', a:1, ex:'Фейк: «письмо счастья» держится только на страхе.'},
  {ctx:'Новость крупного информагентства со ссылкой на заявление МЧС; есть дата и имя автора.', a:0, ex:'Скорее правда: есть первоисточник, автор и дата.'},
  {ctx:'Сайт g0suslugi-bonus.ru обещает выплату всем школьникам.', a:1, ex:'Фейк. В адресе цифра 0 вместо буквы «о» — поддельный сайт.'},
  {ctx:'Видео: «100% доказательство, что Земля плоская!»', a:1, ex:'Фейк. Форму Земли подтверждают фотографии из космоса, кругосветные путешествия и множество измерений.'},

  opts:TRAPS, q:'Какая это ловушка?',
  exA:['Популярность — не доказательство: многие тоже могут ошибаться.','Спорят с человеком, а не с его доводом.','Вариантов почти всегда больше двух.','Одно случилось после другого — это ещё не причина.','Каждый шаг этой страшной цепочки ничем не доказан.','Чужие слова исказили и спорят с искажённой версией.','Знаменитость — не знаток во всём: важно, разбирается ли человек именно в этом.','Одного-двух случаев мало, чтобы делать общее правило.','Мы слышим о тех, кому повезло, и не слышим о тех, у кого не вышло.','Вещи похожи лишь чуть-чуть, а вывод делают так, будто они одинаковые.','В вопрос спрятано обвинение: и «да», и «нет» его подтверждают.','Вместо доводов давят на жалость.'],
  short:'Узнаём двенадцать хитрых приёмов в спорах и рекламе.',

{ id:'rulewrong', title:'Верное правило — неверный вывод', kind:'choice', q:'Что не так с выводом?',
  short:'Правило верное, а вывод из него — нет. Находим, где рассуждение «съехало».',
  intro:'Бывает, что правило верное, а вывод из него — неправильный. Три частые ошибки: взяли из правила одну часть и забыли остальные; довели правило до крайности («полезно — значит, чем больше, тем лучше»); перенесли правило туда, где оно не работает.',
  tip:'Спроси себя: «Что ещё говорит это правило? Не слишком ли далеко я зашёл? Работает ли оно здесь?»',
  items:[
  {ctx:'Правило: «Чтобы вес был в норме, важно соблюдать режим питания и тратить энергии не меньше, чем получаешь с едой».\nВывод: «Буду пить только колу без сахара — и похудею».', opts:['Из правила взяли одну часть и забыли про режим и полезную еду','Всё верно: в такой коле нет калорий','Ошибка только в том, что кола должна быть с сахаром'], a:0, ex:'Растущему организму нужны белки, витамины и нормальная еда по режиму — кола их не даёт. Решения о питании принимают вместе с родителями и врачом.'},
  {ctx:'Правило: «Сон важен для здоровья».\nВывод: «Буду спать по 14 часов в сутки — стану самым здоровым».', opts:['Правило довели до крайности: полезно в меру — не значит «чем больше, тем лучше»','Всё верно: сон полезен','Ошибка: сон вообще не нужен'], a:0, ex:'Школьнику нужно примерно 9–11 часов сна. Больше — не лучше.'},
  {ctx:'Правило: «Пить воду полезно».\nВывод: «Выпью сразу пять литров — буду здоровее».', opts:['Правило довели до крайности: столько воды сразу вредно','Всё верно: вода полезна','Ошибка: воду пить вредно'], a:0, ex:'Воду пьют понемногу в течение дня. Слишком много сразу — это нагрузка на организм.'},
  {ctx:'Правило: «Читать полезно».\nВывод: «Буду читать по ночам вместо сна».', opts:['Забыли про другую важную часть здоровья — сон','Всё верно: чтение важнее сна','Ошибка: читать вредно'], a:0, ex:'Полезное занятие не должно вытеснять другое полезное.'},
  {ctx:'Правило: «Витамин C помогает организму».\nВывод: «Съем всю пачку витаминок за раз — и никогда не заболею».', opts:['Довели до крайности и пообещали чудо: витамины не спасают от всех болезней','Всё верно: витамины — это полезно','Ошибка: витамин C вредный'], a:0, ex:'Лишние витамины могут навредить, а «никогда не заболею» не обещает ни один врач.'},
  {ctx:'Правило: «Повторение помогает запомнить».\nВывод: «Повторю правило 100 раз вслух — и пойму тему».', opts:['Запомнить и понять — разные вещи: чтобы понять, нужно разбираться и решать','Всё верно: повторение — мать учения','Ошибка: повторять бесполезно'], a:0, ex:'Правило говорит про запоминание, а вывод — про понимание.'},
  {ctx:'Правило: «Солнцезащитный крем защищает от ожогов».\nВывод: «Намажусь утром один раз — и можно весь день лежать на солнце».', opts:['Забыли про условия: крем обновляют, а в самое жаркое время уходят в тень','Всё верно: крем же нанесён','Ошибка: крем не защищает совсем'], a:0, ex:'Правило верное, но не значит «один раз — и навсегда».'},
  {ctx:'Правило: «Шлем защищает голову».\nВывод: «В шлеме можно гонять на самокате как угодно — я в безопасности».', opts:['Шлем снижает риск, но не делает опасную езду безопасной','Всё верно: шлем защищает от всего','Ошибка: шлем не нужен'], a:0, ex:'Защита — не повод рисковать больше.'},
  {ctx:'Правило: «Пароль защищает аккаунт».\nВывод: «У меня пароль 12345 — значит, аккаунт в безопасности».', opts:['Забыли главное условие: пароль должен быть сложным','Всё верно: пароль есть','Ошибка: пароли не нужны'], a:0, ex:'Пароль 12345 взламывают за секунды.'},
  {ctx:'Правило: «Тренировки делают сильнее».\nВывод: «Буду тренироваться по 4 часа каждый день без отдыха — стану сильнее всех».', opts:['Довели до крайности: мышцам нужен отдых, иначе будут травмы','Всё верно: чем больше, тем лучше','Ошибка: тренировки вредны'], a:0, ex:'Сила растёт, когда тренировки чередуются с отдыхом.'},
  {ctx:'Правило: «Учёные проверяют свои выводы».\nВывод: «Значит, всё, что сказал любой учёный, — правда».', opts:['Из привычки проверять не следует, что каждая фраза учёного верна','Всё верно: учёные не ошибаются','Ошибка: учёные ничего не проверяют'], a:0, ex:'Учёные тоже ошибаются — поэтому их выводы и проверяют другие учёные.'},
  {ctx:'Правило: «Овощи полезны».\nВывод: «Картошка фри — тоже овощ, значит, можно есть её каждый день».', opts:['Правило перенесли туда, где оно не работает: жареное во фритюре — уже не то же самое','Всё верно: картошка — овощ','Ошибка: картошка — это фрукт'], a:0, ex:'Важен не только продукт, но и то, как его приготовили.'},
  {ctx:'Правило: «Отдых после уроков полезен».\nВывод: «Буду отдыхать до ночи, а уроки сделаю утром за пять минут».', opts:['Взяли одну часть и забыли, что уроки тоже нужно сделать нормально','Всё верно: отдых важнее','Ошибка: отдыхать вредно'], a:0, ex:'Правило про отдых не отменяет остальных дел.'},
  {ctx:'Правило: «Взрослых нужно уважать».\nВывод: «Значит, нужно делать всё, что скажет незнакомый взрослый в интернете».', opts:['Правило перенесли туда, где оно не работает: уважать — не значит слушаться незнакомцев','Всё верно: взрослый же','Ошибка: взрослых не нужно уважать'], a:0, ex:'Мошенники часто притворяются взрослыми, которым «нужно подчиниться».'},
  {ctx:'Правило: «Друзья помогают друг другу».\nВывод: «Если друг просит дать списать контрольную, я обязан».', opts:['Помогать — не значит делать за другого то, что ему же навредит','Всё верно: друг же просит','Ошибка: друзья не помогают'], a:0, ex:'Лучшая помощь — объяснить задачу.'},
  {ctx:'Правило: «Разминка защищает от травм».\nВывод: «Раз я размялся, можно делать любые трюки — не упаду».', opts:['Разминка снижает риск, но не отменяет осторожность','Всё верно: размялся — значит, защищён','Ошибка: разминка не нужна'], a:0, ex:'Снижает риск — не значит убирает его полностью.'},
  {ctx:'Правило: «Мыть руки полезно».\nВывод: «Буду мыть руки 50 раз в день — и никогда не заболею».', opts:['Довели до крайности и пообещали чудо','Всё верно: чистота — залог здоровья','Ошибка: мыть руки не нужно'], a:0, ex:'От слишком частого мытья сохнет кожа, а «никогда не заболею» — неправда.'},
  {ctx:'Правило: «Новости важно проверять».\nВывод: «Значит, нельзя верить вообще никому и ничему».', opts:['Довели до крайности: проверять — не значит не верить никому','Всё верно: верить нельзя никому','Ошибка: новости проверять не нужно'], a:0, ex:'Цель проверки — найти, кому можно доверять, а не перестать доверять всем.'},
  {ctx:'Правило: «Лекарство помогает при болезни».\nВывод: «Если одна таблетка помогает, две помогут в два раза быстрее».', opts:['Довели до крайности: больше — не значит лучше, а бывает опасно','Всё верно: двойная доза — двойная польза','Ошибка: лекарства не помогают'], a:0, ex:'Дозу лекарства определяет врач.'},
  {ctx:'Правило: «Кальций нужен для крепких костей, и его много в молоке».\nВывод: «Буду пить только молоко и больше ничего не есть».', opts:['Взяли одну часть: кроме кальция, организму нужно много другого','Всё верно: молоко полезно','Ошибка: в молоке нет кальция'], a:0, ex:'Ни один продукт не заменяет разнообразную еду.'},
  {ctx:'Правило: «Экономить электричество — хорошо».\nВывод: «Не буду включать свет, даже когда вечером делаю уроки».', opts:['Довели до крайности: экономия не должна вредить здоровью и зрению','Всё верно: экономия важнее','Ошибка: экономить не нужно'], a:0, ex:'Экономят на лишнем, а не на нужном.'},
  {ctx:'Правило: «Скидка помогает сэкономить».\nВывод: «Чем больше вещей куплю со скидкой, тем больше сэкономлю».', opts:['Экономия — только если вещь нужна; ненужная покупка — это трата','Всё верно: скидка — это выгода','Ошибка: скидок не бывает'], a:0, ex:'Купить ненужное даже со скидкой — потратить деньги.'}
]},
{ id:'cause', title:'Причина или совпадение', kind:'choice',
  short:'«Вместе» — не значит «из-за». Ищем настоящую причину.',
  intro:'Если два явления происходят вместе, это ещё не значит, что одно вызывает другое. Часто у них есть общая причина — или это просто совпадение.',
  tip:'Ищи общую причину, которая влияет на оба явления.',
  items:[
  {ctx:'Летом продают больше мороженого, и больше людей обгорает на солнце.', q:'Какая здесь общая причина?', opts:['Жаркое солнечное лето','Мороженое','Солнцезащитный крем'], a:0, ex:'Жара заставляет покупать мороженое, а солнце обжигает кожу.'},
  {ctx:'Дети с бóльшим размером обуви обычно лучше читают.', q:'Что на самом деле влияет на оба явления?', opts:['Возраст: старшие дети и выросли, и дольше учились читать','Обувь помогает читать','Чтение увеличивает размер ноги'], a:0, ex:'Общая причина — возраст.'},
  {ctx:'Чем больше пожарных машин на пожаре, тем больше ущерб.', q:'Какая общая причина?', opts:['Размер пожара','Пожарные машины','Цвет машин'], a:0, ex:'На большой пожар отправляют больше машин, и ущерб от него больше.'},
  {ctx:'В дни, когда я беру зонт, часто идёт дождь.', q:'Зонт вызывает дождь?', opts:['Нет: я беру зонт, когда обещают дождь','Да','Иногда'], a:0, ex:'Причина обоих — прогноз и погода.'},
  {ctx:'«Каждый раз, когда я мою машину, идёт дождь!»', q:'Почему так кажется?', opts:['Мы лучше запоминаем совпадения и забываем остальные случаи','Мытьё машины вызывает дождь','Дождь любит чистые машины'], a:0, ex:'Это «вижу то, что хочу»: обидные совпадения запоминаются лучше.'},
  {ctx:'«Я пил чай с мёдом, и через неделю простуда прошла».', q:'Доказывает ли это, что вылечил мёд?', opts:['Нет: обычная простуда часто проходит сама примерно за неделю','Да, точно'], fixed:true, a:0, ex:'Чтобы проверить, нужно сравнить с теми, кто мёд не пил.'},
