  {ctx:'«На столе лежал лук.»', q:'Что может значить слово «лук»?', opts:['Овощ или оружие для стрельбы','Только овощ','Только оружие'], a:0, ex:'Многозначное слово понятно только из контекста.'},
  {ctx:'«Тренер попросил игрока взять его мяч.»', q:'Чей мяч нужно взять?', opts:['Непонятно: тренера или игрока','Только тренера','Только игрока'], a:0, ex:'«Его» подходит к обоим. Яснее: «свой мяч» или «мяч тренера».'},
  {ctx:'«Наши чипсы — это на 30% больше удовольствия!»', q:'Что на самом деле обещает реклама?', opts:['Ничего проверяемого: удовольствие нельзя измерить в процентах','Что в пачке на 30% больше чипсов','Что чипсы полезные'], a:0, ex:'Цифра создаёт впечатление точности, но измерить «удовольствие» нельзя.'},
  {ctx:'«Распродажа: цены от 99 рублей!»', q:'Значит ли это, что всё стоит 99 рублей?', opts:['Нет: «от» значит, что столько стоит только самое дешёвое','Да, всё по 99 рублей','Да, но только сегодня'], a:0, ex:'Маленькое слово «от» меняет весь смысл.'},
  {ctx:'На упаковке: «Учёные доказали!»', q:'Что здесь непонятно?', opts:['Какие учёные, что именно доказали и где об этом написано','Кто такие учёные','Ничего, всё понятно'], a:0, ex:'Ссылка на «учёных» без подробностей ничего не доказывает.'},
  {ctx:'«Бабушка вязала шарф внучке с узором.»', q:'Почему фраза звучит смешно?', opts:['Можно понять, что узор у внучки, а не у шарфа','Бабушка вязала слишком долго','В ней нет глагола'], a:0, ex:'Лучше: «Бабушка вязала внучке шарф с узором».'},
  {ctx:'«Это атлас.»', q:'Как можно понять это слово?', opts:['А́тлас — сборник карт, атла́с — блестящая ткань','Только как сборник карт','Только как ткань'], a:0, ex:'Смысл меняет ударение.'},
  {ctx:'«Я не мог не заметить ошибку.»', q:'Что это значит?', opts:['Я обязательно заметил ошибку','Я не заметил ошибку','Я не знаю, заметил ли'], a:0, ex:'Два «не» гасят друг друга.'},
  {ctx:'Объявление: «Магазин работает каждый день с 9:00 до 21:00».', q:'Есть ли здесь двусмысленность?', opts:['Нет: смысл один','Да: непонятно, утро это или вечер','Да: непонятно, работает ли он в выходные'], a:0, ex:'Не всё двусмысленно — «каждый день» включает и выходные, а 21:00 — это вечер.'},
  {ctx:'Друг посмотрел на твой рисунок и сказал: «Ну ты и художник…»', q:'Как понять, похвала это или шутка?', opts:['По интонации, выражению лица и ситуации','Только по словам','Никак нельзя понять'], a:0, ex:'Одни и те же слова могут значить разное. Не уверен — переспроси.'}
],
conditions:[
  {ctx:'«Вода замерзает».', q:'При каком условии?', opts:['Когда температура опускается до 0 °C и ниже','Когда дует ветер','Всегда'], a:0, ex:'Пресная вода замерзает при 0 °C. Солёной морской воде нужен мороз посильнее.'},
  {ctx:'«Чем больше тренируешься, тем лучше результат».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Часто, но без отдыха можно переутомиться, и результат упадёт.'},
  {ctx:'«Число, которое оканчивается на 5, делится на 5».', q:'Это верно…', opts:AL, fixed:true, a:0, ex:'Это признак делимости на 5.'},
  {ctx:'«Сумма двух чётных чисел — нечётная».', q:'Это верно…', opts:AL, fixed:true, a:2, ex:'2 + 4 = 6, 8 + 10 = 18. Сумма двух чётных чисел всегда чётная.'},
  {ctx:'«Ромб — это квадрат».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Только если все углы ромба прямые.'},
  {ctx:'«Зимой идёт снег».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'В тёплых странах снега зимой не бывает, а у нас бывают оттепели с дождём.'},
  {ctx:'«Если разделить число на 2, оно уменьшится».', q:'При каком условии это верно?', opts:['Если число больше нуля','Всегда','Если число чётное'], a:0, ex:'0 : 2 = 0, а −4 : 2 = −2, и это больше, чем −4.'},
  {ctx:'«Лампочка горит».', q:'Что для этого нужно?', opts:['Замкнутая электрическая цепь с источником тока','Темнота в комнате','Ничего не нужно'], a:0, ex:'Без тока лампочка не загорится.'},
  {ctx:'«Отзывам в интернет-магазине можно доверять».', q:'При каком условии?', opts:['Если отзывов много, они подробные и среди них есть и хорошие, и плохие','Если все отзывы восторженные','Если отзыв написан большими буквами'], a:0, ex:'Одни пятёрки и одинаковые фразы — признак накрученных отзывов.'},
  {ctx:'«Дерево плавает в воде».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Большинство пород плавает, но очень плотное дерево, например эбеновое, тонет.'},
  {ctx:'«У четырёхугольника все стороны равны».', q:'Это верно…', opts:AL, fixed:true, a:1, ex:'Только у квадрата и ромба.'},
  {ctx:'«Ссылке из сообщения можно доверять».', q:'При каком условии?', opts:['Если ты ждал это сообщение и сам проверил адрес сайта','Если ссылка короткая','Если в сообщении написано «срочно»'], a:0, ex:'Мошенники часто присылают ссылки на поддельные сайты.'}
],
attention:[
  {q:'Сколько раз встречается буква «а» в слове «барабан»?', opts:['3','2','4'], a:0, ex:'б-а-р-а-б-а-н: три буквы «а».'},
  {ctx:'4 8 1 6 3 9 2   →   4 8 1 6 3 5 2', q:'Какая по счёту цифра отличается?', opts:['6-я','5-я','3-я','Все одинаковые'], a:0, ex:'На 6-м месте в первой строке 9, во второй — 5.'},
  {q:'Сколько букв «о» в предложении «В огороде росло много моркови»?', opts:['9','8','7','10'], a:0, ex:'огороде — 3, росло — 2, много — 2, моркови — 2. Всего 9.'},
  {ctx:'«Мы пошли в в кино»', q:'Что не так в этой фразе?', opts:['Слово «в» написано дважды','Неправильно написано «кино»','Всё в порядке'], a:0, ex:'Короткие повторы мозг пропускает особенно легко.'},
  {q:'Сколько всего квадратов на доске 3 × 3 клетки?', opts:['14','9','10','13'], a:0, ex:'9 маленьких, 4 квадрата 2 × 2 и 1 большой: 9 + 4 + 1 = 14.'},
  {q:'Сколько раз встречается цифра 2 в числах от 1 до 25?', opts:['9','8','7','10'], a:0, ex:'2, 12, 20, 21, 22 (две двойки), 23, 24, 25 — всего 9.'},
  {ctx:'январь, февраль, апрель, март, май', q:'Что не так?', opts:['Март и апрель поменялись местами','Пропущен июнь','Всё правильно'], a:0, ex:'Правильно: январь, февраль, март, апрель, май.'},
  {ctx:'ВНИМАНИЕ   →   ВНИАМНИЕ', q:'Чем отличается второе слово?', opts:['Переставлены буквы М и А','Пропущена буква Н','Ничем'], a:0, ex:'ВНИ-МА-НИЕ и ВНИ-АМ-НИЕ.'},
  {q:'Сколько ног у двух собак и трёх гусей вместе?', opts:['14','20','10','12'], a:0, ex:'2 × 4 = 8, 3 × 2 = 6, всего 14.'},
  {q:'Какая буква в слове «ЛОГИКА» стоит четвёртой?', opts:['И','Г','К','О'], a:0, ex:'Л-О-Г-И.'},
  {ctx:'Б В В Б В В Б В В …', q:'Какая буква будет 11-й?', opts:['В','Б','Г'], a:0, ex:'Узор повторяется каждые 3 буквы. 10-я — Б, 11-я — В.'},
  {q:'Сегодня среда. Какой день недели будет через 9 дней?', opts:['Пятница','Четверг','Суббота','Среда'], a:0, ex:'Через 7 дней снова среда, ещё через 2 — пятница.'},
  {ctx:'Образец: 5Ж2К8М', q:'Какая строка точно совпадает с образцом?', opts:['5Ж2К8М','5Ж2К3М','5Ж7К8М','6Ж2К8М'], a:0, ex:'Сверяй по одному символу слева направо.'},
  {ctx:'3, 6, 12, 24, …', q:'Какое число следующее?', opts:['48','36','30','28'], a:0, ex:'Каждое число в 2 раза больше предыдущего.'},
  {ctx:'кошка, собака, воробей, корова', q:'Что здесь лишнее?', opts:['воробей','собака','корова'], a:0, ex:'Воробей — птица, остальные — млекопитающие.'},
  {q:'Сколько раз встречается буква «р» в скороговорке «На дворе трава, на траве дрова»?', opts:['4','3','5','2'], a:0, ex:'дво-р-е, т-р-ава, т-р-аве, д-р-ова — по одной «р» в четырёх словах.'}
],
wit:[
  {q:'У Тани три брата, и у каждого из них одна сестра. Сколько всего детей в семье?', opts:['4','6','7'], a:0, ex:'Сестра у всех братьев одна — сама Таня.'},
  {q:'У Пети было 5 карандашей. Он отдал Маше все, кроме двух. Сколько карандашей осталось у Пети?', opts:['2','3','5'], a:0, ex:'«Все, кроме двух» — значит, два остались у Пети.'},
  {q:'На столе лежали 3 яблока. Ты взял 2. Сколько яблок у тебя?', opts:['2','1','3'], a:0, ex:'У тебя те яблоки, которые ты взял.'},
  {q:'Бревно распилили на 4 части. Сколько сделали распилов?', opts:['3','4','5'], a:0, ex:'Каждый распил добавляет одну часть.'},
  {q:'Какой рукой лучше размешивать чай?', opts:['Лучше ложкой','Правой','Левой'], a:0, ex:'Ловушка в вопросе: размешивают ложкой.'},
  {q:'Что становится мокрым, когда сушит?', opts:['Полотенце','Фен','Солнце'], a:0, ex:'Полотенце вытирает — и намокает само.'},
  {q:'В скольких месяцах года есть 30-е число?', opts:['11','4','7'], a:0, ex:'30-е число есть во всех месяцах, кроме февраля.'},
  {q:'Петя старше Коли, а Коля старше Вани. Кто младше всех?', opts:['Ваня','Коля','Петя'], a:0, ex:'Петя старше Коли, Коля старше Вани — значит, Ваня самый младший.'},
  {q:'Сколько будет, если 5 умножить на 0 и прибавить 5?', opts:['5','0','10'], a:0, ex:'5 × 0 = 0, 0 + 5 = 5.'},
  {q:'Чем больше из неё берёшь, тем больше она становится. Что это?', opts:['Яма','Гора','Кастрюля'], a:0, ex:'Чем больше земли выкопаешь, тем больше яма.'},
  {q:'Пять рыбаков поймали пять рыб за пять минут. За сколько минут сто рыбаков поймают сто рыб?', opts:['За 5 минут','За 100 минут','За 20 минут'], a:0, ex:'Каждый рыбак ловит одну рыбу за 5 минут — и все ловят одновременно.'},
  {q:'Сколько получится, если 30 разделить на половину и прибавить 10?', opts:['70','25','40'], a:0, ex:'Разделить на половину — значит разделить на 0,5, то есть умножить на 2: 60 + 10 = 70.'},
  {q:'На берёзе выросли 10 яблок. Ветер сорвал 3. Сколько яблок осталось на берёзе?', opts:['Яблоки на берёзе не растут','7','10'], a:0, ex:'Перечитай условие: на берёзе яблоки не растут.'},
  {q:'Брат и сестра родились в один день у одних родителей, но они не двойняшки. Как так?', opts:['Это тройняшки','Они родились в разные годы','Так не бывает'], a:0, ex:'Был ещё третий ребёнок.'},
  {q:'Ты бежишь в забеге и обогнал последнего. Каким ты стал?', opts:['Так не бывает: последнего обогнать нельзя','Предпоследним','Последним'], a:0, ex:'Чтобы обогнать последнего, нужно бежать позади него — а позади последнего никого нет.'},
  {q:'Ты зашёл в тёмную комнату со спичкой. Там есть свеча, лампа и камин. Что ты зажжёшь первым?', opts:['Спичку','Свечу','Камин'], a:0, ex:'Чтобы зажечь что угодно, сначала нужно зажечь спичку.'},
  {q:'Тебе дали 5 конфет и сказали есть по одной каждые 10 минут. Через сколько минут съешь все?', opts:['Через 40 минут','Через 50 минут','Через 10 минут'], a:0, ex:'Первую съедаешь сразу, а потом ещё четыре раза ждёшь по 10 минут.'},
  {q:'Летели гуси: один впереди и два позади, один позади и два впереди, один между двумя. Сколько было гусей?', opts:['3','5','7'], a:0, ex:'Три гуся в ряд подходят под все три описания.'}
],
believe:[
  {ctx:'В шее у жирафа столько же позвонков, сколько у человека, — семь.', opts:['Найти в учебнике биологии сравнение скелетов','Шея длинная — значит, позвонков больше','Поверить комментарию под видео'], a:0, ex:'Правда. Просто каждый позвонок у жирафа очень длинный.'},
  {ctx:'Ёжик носит на иголках яблоки и грибы, чтобы запасти еду на зиму.', opts:['Почитать, что пишут зоологи о питании ежей','Видел на картинке в книжке — значит, правда','Раз все знают — значит, правда'], a:0, ex:'Миф. Ежи не делают запасов — зимой они спят. Картинка в книжке — не доказательство.'},
  {ctx:'Комары-самцы не кусаются.', opts:['Узнать у биологов, чем питаются самцы и самки комаров','Меня кусали все комары — значит, кусаются все','Поверить другу'], a:0, ex:'Правда. Кусаются только самки. Свой опыт не всегда всё объясняет.'},
  {ctx:'Если потрогать лягушку, появятся бородавки.', opts:['Спросить врача, отчего появляются бородавки','Поверить, раз так говорят во дворе','Кожа у лягушки в пупырышках — значит, правда'], a:0, ex:'Миф. Бородавки вызывает вирус от людей, а не лягушки.'},
  {ctx:'Кровь в венах синего цвета, а красной становится только на воздухе.', opts:['Узнать у врача, какого цвета кровь при заборе из вены','Вены синие — значит, и кровь синяя','На рисунке в учебнике вены синие — значит, правда'], a:0, ex:'Миф. Кровь всегда красная, вены лишь кажутся синими сквозь кожу. На рисунках цвет — просто условность.'},
  {ctx:'Морские звёзды — это не рыбы.', opts:['Посмотреть, к какой группе животных их относят биологи','Живут в море — значит, рыбы','Поверить, раз в названии нет слова «рыба»'], a:0, ex:'Правда. Морские звёзды — иглокожие, родственники морских ежей.'},
  {ctx:'С точки зрения ботаники помидор — это ягода.', opts:['Узнать, как ботаники называют такие плоды','Это овощ: его кладут в салат','Поверить смешной картинке в интернете'], a:0, ex:'Правда. На кухне помидор считают овощем, а ботаники называют его плод ягодой. Важно, кто и как считает.'},
  {ctx:'Свет от Солнца доходит до Земли примерно за 8 минут.', opts:['Найти в справочнике расстояние до Солнца и скорость света','Свет приходит мгновенно — это все знают','Поверить блогеру'], a:0, ex:'Правда: около 8 минут 20 секунд.'},
  {ctx:'Новорождённый кенгурёнок размером всего около 2 сантиметров.', opts:['Посмотреть материалы зоопарков и зоологов','Кенгуру большие — значит, и детёныш большой','Поверить викторине без источника'], a:0, ex:'Правда. Он рождается крошечным и месяцами растёт в сумке у мамы.'},
  {ctx:'Кожа у белого медведя чёрная.', opts:['Найти, что пишут зоологи, изучающие белых медведей','Мех белый — значит, и кожа белая','Звучит удивительно — значит, выдумка'], a:0, ex:'Правда. Под светлым мехом чёрная кожа.'},
  {ctx:'Совы могут повернуть голову на полный круг — 360 градусов.', opts:['Найти исследования о строении шеи совы','Видел в мультике, как сова крутит головой по кругу','Раз все так говорят — правда'], a:0, ex:'Миф. Сова поворачивает голову примерно на 270 градусов.'}
],
fake:[
  {tag:'scam', ctx:'«Поздравляем! Ваш номер выиграл автомобиль. Чтобы получить приз, оплатите налог 2000 ₽ по ссылке».', a:1, ex:'Фейк. Настоящий выигрыш не требует платить по ссылке.'},
  {tag:'scam', ctx:'СМС: «Банк. Ваша карта заблокирована. Перезвоните по этому номеру и назовите данные карты».', a:1, ex:'Фейк. Банк не просит данные карты. Звони только по номеру с обратной стороны карты.'},
  {tag:'scam', ctx:'«Привет, это Саша, пишу с нового номера. Срочно скинь 500 ₽, потом объясню».', a:1, ex:'Фейк. Позвони Саше по старому номеру и проверь.'},
  {tag:'scam', ctx:'Объявление: «Новая игровая приставка за 2000 ₽! Только предоплата на карту, встречи не будет».', a:1, ex:'Фейк. Слишком низкая цена и предоплата незнакомцу — частая ловушка.'},
  {tag:'scam', ctx:'Письмо с адреса shkola5-oplata.ru: «Оплатите обеды по ссылке до вечера, иначе ребёнка не покормят».', a:1, ex:'Фейк. Странный адрес, срочность и угроза. Уточни у классного руководителя.'},
  {tag:'scam', ctx:'Звонок: «Вы участник опроса! Назовите номер карты, чтобы получить 1000 ₽ за ответы».', a:1, ex:'Фейк. За опросы не просят данные карты.'},
  {tag:'scam', ctx:'Бот в игре: «Введи логин и пароль от аккаунта — получишь редкий скин».', a:1, ex:'Фейк. Пароль нельзя сообщать никому.'},
  {ctx:'На сайте библиотеки и на стенде у входа написано, что в понедельник библиотека закрыта на санитарный день.', a:0, ex:'Правда: официальный источник и подтверждение на месте.'},

sources:[

rulewrong:[
  {ctx:'Правило: «Завтракать полезно».\nВывод: «Съем на завтрак торт — главное ведь позавтракать».', opts:['Взяли одну часть: полезен не любой завтрак, а нормальный','Всё верно: завтрак же был','Ошибка: завтракать вредно'], a:0, ex:'Правило про полезный завтрак, а не про любую еду утром.'},
  {ctx:'Правило: «Гулять на свежем воздухе полезно».\nВывод: «Пойду гулять в мороз −30 в лёгкой куртке — это же полезно».', opts:['Забыли про условия: в сильный мороз нужно тепло одеться и гулять недолго','Всё верно: воздух свежий','Ошибка: гулять вредно'], a:0, ex:'Полезное становится опасным, если забыть об условиях.'},

  {ctx:'Правило: «На ошибках учатся».\nВывод: «Буду специально делать ошибки в контрольной».', opts:['Правило перевернули: учатся, разбирая ошибки, а не делая их нарочно','Всё верно: ошибки полезны','Ошибка: на ошибках не учатся'], a:0, ex:'Польза — в разборе ошибки, а не в самой ошибке.'},
  {ctx:'Правило: «Белок нужен мышцам».\nВывод: «Буду есть только мясо — и мышцы вырастут».', opts:['Взяли одну часть: организму нужен не только белок, а мышцам — ещё и тренировки','Всё верно: в мясе много белка','Ошибка: в мясе нет белка'], a:0, ex:'Одного продукта мало — нужна разнообразная еда.'},
  {ctx:'Правило: «Дома безопасно».\nВывод: «Значит, сидеть в интернете из дома тоже безопасно».', opts:['Правило перенесли туда, где оно не работает: в интернете свои опасности','Всё верно: я же дома','Ошибка: дома опасно'], a:0, ex:'Мошенники в сети не знают, где ты сидишь, — им важно, чему ты поверишь.'},
  {ctx:'Правило: «Записывать задания полезно».\nВывод: «Запишу всё в дневник — и уроки как будто сделаны».', opts:['Записать задание и сделать его — разные вещи','Всё верно: главное — записать','Ошибка: записывать не нужно'], a:0, ex:'Запись помогает не забыть, но не делает работу за тебя.'},
  {ctx:'Правило: «Солнце помогает организму получать витамин D».\nВывод: «Буду загорать весь день без крема — получу больше витамина».', opts:['Довели до крайности: долгое солнце без защиты вредит коже','Всё верно: больше солнца — больше пользы','Ошибка: солнце вредно всегда'], a:0, ex:'Для витамина D хватает недолгих прогулок.'},
  {ctx:'Правило: «Родителям можно доверять».\nВывод: «Если в сообщении написано "Это мама, срочно переведи деньги", надо сразу перевести».', opts:['Правило перенесли на сообщение, где автор не проверен: сначала позвони маме','Всё верно: это же мама','Ошибка: родителям доверять нельзя'], a:0, ex:'Доверять маме — не значит доверять любому, кто назвался мамой.'},
  {ctx:'Правило: «Овсяная каша полезна».\nВывод: «Овсяное печенье — тоже из овса, значит, можно есть его вместо каши».', opts:['Правило перенесли туда, где оно не работает: в печенье много сахара и жира','Всё верно: овёс есть овёс','Ошибка: овёс вредный'], a:0, ex:'Важно не только из чего сделано, но и что ещё добавлено.'},
  {ctx:'Правило: «Мозгу нужен отдых».\nВывод: «Буду отдыхать по часу после каждого решённого примера».', opts:['Довели до крайности: отдых нужен, но в меру','Всё верно: отдых важен','Ошибка: мозгу отдых не нужен'], a:0, ex:'Короткие перерывы помогают, а бесконечный отдых — уже не учёба.'},
  {ctx:'Правило: «Менять пароль полезно».\nВывод: «Буду менять пароль каждый день: 1111, 2222, 3333…»', opts:['Забыли главное условие: пароль должен быть сложным','Всё верно: пароль же меняется','Ошибка: пароль менять нельзя'], a:0, ex:'Частая смена простых паролей не защищает.'},
  {ctx:'Правило: «Спорт полезен для здоровья».\nВывод: «Буду бегать с температурой — спорт же полезен».', opts:['Забыли про условия: во время болезни нагрузки вредны','Всё верно: спорт всегда полезен','Ошибка: спорт вреден'], a:0, ex:'Когда болеешь, организму нужен отдых.'}

  const map = [['u9', 'u10'], ['u8', 'u9'], ['u7', 'u8']], tmap = [['lesson8', 'lesson9'], ['lesson7', 'lesson8']];
  const c = p.course || {};
  if (c.done) { const d = {}; Object.keys(c.done).forEach(k => { const [u, i] = k.split(':'); const m = map.find(x => x[0] === u); d[(m ? m[1] : u) + ':' + i] = c.done[k]; }); c.done = d; }
  if (c.cur && (c.cur.u || c.cur.id)) { const k = c.cur.u ? 'u' : 'id'; const m = map.find(x => x[0] === c.cur[k]); if (m) c.cur[k] = m[1]; }
  if (p.tests) tmap.forEach(([a, b]) => { if (a in p.tests) { p.tests[b] = p.tests[a]; delete p.tests[a]; } });
  p.cv = 2;
}

/* ---------- filword grid ---------- */
function strHash(s){ let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) || 1; }
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function buildGrid(words, seed){
  const N = 10, L = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ';
  for (let attempt = 0; attempt < 400; attempt++) {
    const r = rng(seed + attempt * 7919);
    const g = Array.from({length:N}, () => Array(N).fill(''));
    let ok = true;
    for (const w of [...words].sort((a, b) => b.length - a.length)) {
      let done = false;
      for (let t = 0; t < 300 && !done; t++) {
        const down = r() < 0.5, dr = down ? 1 : 0, dc = down ? 0 : 1;
        const r0 = Math.floor(r() * (down ? N - w.length + 1 : N));
        const c0 = Math.floor(r() * (down ? N : N - w.length + 1));
        let fits = true;
        for (let k = 0; k < w.length; k++) { const ch = g[r0 + dr * k][c0 + dc * k]; if (ch && ch !== w[k]) { fits = false; break; } }
        if (fits) { for (let k = 0; k < w.length; k++) g[r0 + dr * k][c0 + dc * k] = w[k]; done = true; }
      }
      if (!done) { ok = false; break; }
    }
    if (ok) {
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!g[i][j]) g[i][j] = L[Math.floor(r() * L.length)];
      return {N, letters: g.flat()};
    }
  }
  return null;
}
function locate(grid, w){
  const {N, letters} = grid;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    for (const [dr, dc] of [[0,1],[1,0]]) {
      if (i + dr * (w.length - 1) >= N || j + dc * (w.length - 1) >= N) continue;
      const cells = range(w.length).map(k => (i + dr * k) * N + (j + dc * k));
      if (cells.every((c, k) => letters[c] === w[k])) return cells;
    }
  }
  return [];
}

/* ---------- sessions ---------- */
let S = null;

function prep({cat, item, rev}){
  const e = {cat, item, rev: !!rev, graded:false};
  if (cat.kind === 'choice') { const n = (item.opts || cat.opts).length; e.perm = (cat.fixed || item.fixed) ? range(n) : shuffle(range(n)); e.sel = null; }
  if (cat.kind === 'order') { let p = shuffle(range(item.steps.length)); while (p.every((v, i) => v === i)) p = shuffle(p); e.perm = p; e.sel = []; }
  if (cat.kind === 'sort') { e.perm = shuffle(range(item.items.length)); e.sel = {}; }
  if (cat.kind === 'words') { e.grid = buildGrid(item.words, strHash(item.theme)); e.found = new Set(); e.foundCells = new Set(); e.start = null; e.revealed = false; }
  return e;
}
function build(mode, key){
  if (key === 'final') {
    const cats = CATS.filter(c => c.kind !== 'words');
    const list = cats.map(c => ({cat:c, item: shuffle(testPool(c.id).filter(forAge))[0]}));
    const used = new Set(list.map(x => x.item));
    const rest = shuffle(cats.flatMap(c => testPool(c.id).filter(forAge).filter(i => !used.has(i)).map(item => ({cat:c, item})))).slice(0, Math.max(0, 20 - list.length));
    return shuffle(list.concat(rest));
  }
  if (LES[key]) {
    const L = LES[key], main = LES[key].spec.flatMap(([id, n, tag]) => pick(id, n, tag, true));
    /* 2–3 вопроса на повторение прошлых уроков: так материал запоминается лучше */
    const prev = LESSONS.filter(x => !x.final && x.n < L.n).flatMap(x => x.spec), want = L.n < 2 ? 0 : L.n <= 3 ? 2 : 3;
    const used = new Set(main.map(m => m.item)), rev = [];
    for (const sp of shuffle(prev)) { if (rev.length >= want) break; const c = pick(sp[0], 5, sp[2], true).find(x => !used.has(x.item)); if (c) { used.add(c.item); c.rev = true; rev.push(c); } }
    return shuffle(main).concat(rev);
  }
  const c = CAT[key];
  const items = mode === 'practice' ? shuffle(c.items.filter(forAge)) : shuffle(testPool(c.id).filter(forAge)).slice(0, c.kind === 'words' ? 3 : 10);
  return items.map(item => ({cat:c, item}));
}
function start(mode, key, list, opts){
  opts = opts || {};
  const title = opts.title || (key === 'final' ? 'Итоговый тест' : LES[key] ? `Урок ${LES[key].n}: ${LES[key].title}` : CAT[key].title);
  S = {mode, key, title, ret: opts.ret || null, q: (list || build(mode, key)).map(prep), i:0, res:[]};
  renderQ(); window.scrollTo(0, 0);
}

function renderIntro(key){
  document.body.classList.remove('wide');
  if (LES[key] && LES[key].final) key = 'final';
  const fin = key === 'final', l = LES[key], c = CAT[key];
  const title = fin ? 'Итоговый тест' : l ? `Закрепление · урок ${l.n}` : c.title;
  const intro = fin ? 'По одному вопросу из каждого раздела и ещё несколько случайных — всего 20. Подсказок не будет: ответы и разбор ошибок появятся в конце.'
    : l ? `Тема урока: «${l.title}». 10 вопросов по материалу урока${l.n > 1 ? ' и 2–3 вопроса на повторение прошлых уроков' : ''}. В конце — оценка, лапки и разбор ошибок.` : c.intro;
  const tip = fin ? 'Не спеши. Перед ответом вспомни алгоритм С-Т-О-П и пять вопросов.' : l ? 'Вспомни, что было на уроке, и не торопись с ответом.' : c.tip;
  const tn = (fin || l) ? (fin ? 20 : 10) : (c.kind === 'words' ? 3 : 10);
  app.innerHTML = `
  <button class="back" id="b-home" type="button">← Все тренажёры</button>
  <section style="display:flex;flex-direction:column;gap:12px">
    <p class="eyebrow">${fin || l ? 'Проверка знаний' : 'Тренажёр'}</p>
    <h1>${esc(title)}</h1>
    <p class="lead">${esc(intro)}</p>
  </section>
  <div class="tip">${RACCOON_FULL}<p class="hand">Чек советует: ${esc(tip)}</p></div>
  ${key === 'fallacies' || key === 'lesson6' || key === 'lesson7' ? trapSheet() : ''}
  <div class="modes">
    ${fin || l ? '' : `<div class="card mode"><h3>Тренировка</h3><p>Все ${c.items.filter(forAge).length} ${plural(c.items.filter(forAge).length, 'задание', 'задания', 'заданий')} в случайном порядке. После каждого ответа — правильный ответ и объяснение.</p><button class="btn" id="m-practice" type="button">Начать тренировку</button></div>`}
    <div class="card mode"><h3>Тест</h3><p>${tn} ${plural(tn, 'задание', 'задания', 'заданий')} без подсказок. В конце — сколько верно, оценка и разбор каждой ошибки.${TESTS[key] || fin || l ? ' Вопросы новые — похожие на тренировку, но не те же самые.' : ''}</p><button class="btn ${fin || l ? '' : 'ghost'}" id="m-test" type="button">Пройти тест</button></div>
  </div>`;
  $('#b-home').onclick = renderHome;
  if (!fin && !l) $('#m-practice').onclick = () => start('practice', key);
  $('#m-test').onclick = () => start('test', key);
  window.scrollTo(0, 0);
}

function qText(e){ const {cat, item} = e; return [item.t, item.theme ? 'Филворд: ' + item.theme : '', item.ctx, item.q || cat.q].filter(Boolean).join(' — '); }

function body(e){
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    const opts = item.opts || cat.opts;
    return `${item.ctx ? `<blockquote class="ctx">${esc(item.ctx)}</blockquote>` : ''}
      <h2>${esc(item.q || cat.q)}</h2>
      <div class="opts ${cat.tf ? 'tf' : ''}">${e.perm.map(k => `<button class="opt" type="button" data-k="${k}">${esc(opts[k])}${TRAP_HINT[opts[k]] ? `<small class="ohint">${esc(TRAP_HINT[opts[k]])}</small>` : ''}</button>`).join('')}</div>`;
  }
  if (cat.kind === 'order') {
    return `<blockquote class="ctx">${esc(item.t)}</blockquote>
      <h2>${esc(cat.q)}</h2>
      <p class="hint">Нажимай на события по порядку: от первого к последнему.</p>
      <ol class="chosen" id="chosen"></ol>
      <div class="pool">${e.perm.map(k => `<button class="chip" type="button" data-k="${k}">${esc(item.steps[k])}</button>`).join('')}</div>
      <div><button class="link" id="reset" type="button">Сбросить порядок</button></div>`;
  }
  if (cat.kind === 'sort') {
    return `<blockquote class="ctx">${esc(item.t)}</blockquote>
      <h2>${esc(cat.q)}</h2>
      <div class="sort">${e.perm.map(k => `<div class="srow" data-k="${k}"><p>${esc(item.items[k][0])}</p><div class="seg" role="group" aria-label="Плюс или минус"><button type="button" data-v="0">Плюс</button><button type="button" data-v="1">Минус</button></div></div>`).join('')}</div>`;
  }
  const g = e.grid;
  return `<blockquote class="ctx">Тема: ${esc(item.theme)}</blockquote>
    <h2>Найди ${item.words.length} ${plural(item.words.length, 'слово', 'слова', 'слов')}</h2>
    <p class="hint">Нажми на первую букву слова, потом на последнюю. Слова идут слева направо или сверху вниз.</p>
    <div class="grid" style="--n:${g.N}">${g.letters.map((ch, i) => `<button class="cell" type="button" data-i="${i}" aria-label="${ch}">${ch}</button>`).join('')}</div>
    <ul class="wlist">${item.words.map(w => `<li data-w="${w}">${w}</li>`).join('')}</ul>
    ${S.mode === 'practice' ? '<div><button class="link" id="giveup" type="button">Показать слова</button></div>' : ''}`;
}

function renderQ(){
  document.body.classList.remove('wide');
  const e = S.q[S.i], n = S.q.length, last = S.i === n - 1;
  const needsCheck = S.mode === 'practice' && (e.cat.kind === 'order' || e.cat.kind === 'sort');
  app.innerHTML = `
  <div class="qtop"><button class="back" id="quit" type="button">← Выйти</button><span class="qcount">${esc(S.title)} · ${S.mode === 'test' ? 'тест' : 'тренировка'} · ${S.i + 1} из ${n}${S.mode === 'practice' && P.streak > 1 ? ` · серия ${P.streak}` : ''}</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><span style="width:${S.i / n * 100}%"></span></div>
  <article class="card qcard">
    <p class="eyebrow">${esc(e.cat.title)}${e.rev ? ' · <span class="revtag">повторение</span>' : ''}</p>
    ${body(e)}
    <div id="fb" class="fb" hidden></div>
    <div class="qnav">${S.i ? '<button class="btn ghost" id="prev" type="button">← Назад</button>' : ''}<button class="btn" id="next" type="button" disabled>${needsCheck && !e.graded ? 'Проверить' : (last ? (S.mode === 'test' ? 'Завершить тест' : 'Завершить') : 'Дальше →')}</button></div>
  </article>`;
  $('#quit').onclick = () => S.ret ? openStep(S.ret.u, S.ret.i) : renderIntro(S.key);
  const next = $('#next');
  next.onclick = () => {
    /* в тесте ответы проверяются только в конце — до этого можно вернуться и передумать */
    if (S.mode === 'test') { if (last) { S.q.forEach((x, k) => finalize(x, k)); renderResults(); } else go(); return; }
    if (!e.graded) { finalize(e); next.textContent = last ? 'Завершить' : 'Дальше →'; return; }
    go();
  };
  const prev = $('#prev');
  if (prev) prev.onclick = () => { S.i--; renderQ(); window.scrollTo(0, 0); };
  bind(e, next);
  restore(e);
  /* в тренажёре прошлое задание показываем с разбором, но ответ уже не меняется */
  if (e.graded && S.mode === 'practice') reveal(e, grade(e));
  next.disabled = e.cat.kind === 'words' ? !(S.mode === 'test' || e.graded) : !(ready(e) || e.graded);
}

function restore(e){
  const {cat} = e;
  if (cat.kind === 'choice' && e.sel !== null) app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', +x.dataset.k === e.sel));
  if (cat.kind === 'order' && e.redraw) e.redraw();
  if (cat.kind === 'sort') app.querySelectorAll('.srow').forEach(row => { const v = e.sel[row.dataset.k]; row.querySelectorAll('button').forEach(b => b.classList.toggle('on', v != null && +b.dataset.v === v)); });
  if (cat.kind === 'words' && e.repaint) e.repaint();
}

function ready(e){
  const k = e.cat.kind;
  if (k === 'choice') return e.sel !== null;
  if (k === 'order') return e.sel.length === e.item.steps.length;
  if (k === 'sort') return Object.keys(e.sel).length === e.item.items.length;
  return true;
}

function bind(e, next){
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (e.graded) return;
      e.sel = +b.dataset.k;
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
      if (S.mode === 'practice') { finalize(e); }
      next.disabled = false;
    });
  }
  if (cat.kind === 'order') {
    const draw = () => {
      $('#chosen').innerHTML = e.sel.map(k => `<li>${esc(item.steps[k])}</li>`).join('');
      app.querySelectorAll('.chip').forEach(b => b.disabled = e.graded || e.sel.includes(+b.dataset.k));
      next.disabled = !(ready(e) || e.graded);
    };
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (e.graded) return; e.sel.push(+b.dataset.k); draw(); });
    $('#reset').onclick = () => { if (e.graded) return; e.sel = []; draw(); };
    e.redraw = draw;
  }
  if (cat.kind === 'sort') {
    app.querySelectorAll('.srow').forEach(row => {
      row.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (e.graded) return;
        e.sel[row.dataset.k] = +b.dataset.v;
        row.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        next.disabled = !ready(e);
      });
    });
  }
  if (cat.kind === 'words') {
    const g = e.grid, N = g.N, cells = app.querySelectorAll('.cell');
    const paint = () => {
      cells.forEach((c, i) => { c.classList.toggle('pick', e.start === i); c.classList.toggle('found', e.foundCells.has(i)); });
      app.querySelectorAll('.wlist li').forEach(li => li.classList.toggle('done', e.found.has(li.dataset.w)));
    };
    const line = (a, b) => {
      const ra = Math.floor(a / N), ca = a % N, rb = Math.floor(b / N), cb = b % N, out = [];
      if (ra === rb) { const s = Math.sign(cb - ca); for (let c = ca; c !== cb + s; c += s) out.push(ra * N + c); return out; }
      if (ca === cb) { const s = Math.sign(rb - ra); for (let r = ra; r !== rb + s; r += s) out.push(r * N + ca); return out; }
      return null;
    };
    cells.forEach(c => c.onclick = () => {
      if (e.graded) return;
      const i = +c.dataset.i;
      if (e.start === null) { e.start = i; paint(); return; }
      if (e.start === i) { e.start = null; paint(); return; }
      const ln = line(e.start, i);
      e.start = null;
      if (ln) {
        const word = ln.map(x => g.letters[x]).join(''), rev = [...word].reverse().join('');
        const hit = item.words.find(w => !e.found.has(w) && (w === word || w === rev));
        if (hit) {
          e.found.add(hit); ln.forEach(x => e.foundCells.add(x)); paint();
          if (e.found.size === item.words.length && S.mode === 'practice') { finalize(e); next.disabled = false; }
          return;
        }
      }
      paint();
      cells[i].classList.add('shake'); setTimeout(() => cells[i].classList.remove('shake'), 300);
    });
    const give = $('#giveup');
    if (give) give.onclick = () => { if (e.graded) return; e.revealed = true; finalize(e); next.disabled = false; };
    e.repaint = paint;
  }
}

function grade(e){
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    const opts = item.opts || cat.opts;
    return {ok: e.sel === item.a, given: e.sel === null ? 'Нет ответа' : opts[e.sel], right: opts[item.a]};
  }
  if (cat.kind === 'order') {
    const ok = e.sel.length === item.steps.length && e.sel.every((k, i) => k === i);
    return {ok, given: e.sel.length ? e.sel.map(k => item.steps[k]).join(' → ') : 'Нет ответа', right: item.steps.join(' → ')};
  }
  if (cat.kind === 'sort') {
    const lab = v => v ? 'минус' : 'плюс';
    const wrong = range(item.items.length).filter(k => e.sel[k] !== item.items[k][1]);
    return {ok: wrong.length === 0,
      given: wrong.length ? wrong.map(k => `«${item.items[k][0]}» — ${e.sel[k] == null ? 'нет ответа' : lab(e.sel[k])}`).join('; ') : 'Всё верно',
      right: wrong.map(k => `«${item.items[k][0]}» — ${lab(item.items[k][1])}`).join('; ')};
  }
  const missing = item.words.filter(w => !e.found.has(w));
  return {ok: missing.length === 0 && !e.revealed,
    given: `Найдено ${e.found.size} из ${item.words.length}`,
    right: missing.length ? 'Не найдены: ' + missing.join(', ') : 'Все слова найдены'};
}

function finalize(e, idx){
  if (e.graded) return;
  e.graded = true;
  const g = grade(e);
  S.res[idx == null ? S.i : idx] = {e, ...g};
  award(e, g);
  if (S.mode === 'practice') reveal(e, g);
}

function reveal(e, g){
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    app.querySelectorAll('.opt').forEach(b => {
      const k = +b.dataset.k; b.disabled = true;
      if (k === item.a) b.classList.add('right'); else if (k === e.sel) b.classList.add('wrong');
    });
  }
  if (cat.kind === 'order') {
    e.redraw();
    app.querySelectorAll('#chosen li').forEach((li, i) => li.classList.add(e.sel[i] === i ? 'right' : 'wrong'));
  }
  if (cat.kind === 'sort') {
    app.querySelectorAll('.srow').forEach(row => { const k = +row.dataset.k; row.classList.add(e.sel[k] === item.items[k][1] ? 'right' : 'wrong'); row.querySelectorAll('button').forEach(b => b.disabled = true); });
  }
  if (cat.kind === 'words') {
    const cells = app.querySelectorAll('.cell');
    item.words.filter(w => !e.found.has(w)).forEach(w => locate(e.grid, w).forEach(i => cells[i].classList.add('miss')));
  }
  const fb = $('#fb');
  const ex = exOf(e);
  fb.className = 'fb ' + (g.ok ? 'good' : 'bad');
  fb.innerHTML = `<p class="fb-title">${g.ok ? `Верно! <span class="plus">+1 ${PAW}</span>` : 'Не совсем'}</p>${g.ok ? '' : `<p><b>${cat.kind === 'words' ? '' : 'Правильно: '}</b>${esc(g.right)}</p>`}${ex ? `<p>${esc(ex)}</p>` : ''}`;
  fb.hidden = false;
}

function go(){
  S.i++;
  if (S.i >= S.q.length) renderResults(); else { renderQ(); window.scrollTo(0, 0); }
}

function renderResults(){
  document.body.classList.remove('wide');
  if (S.ret) markDone(S.ret.u, S.ret.i);
  const r = S.res, n = r.length, c = r.filter(x => x.ok).length, pct = Math.round(c * 100 / n);
  const m = pct >= 90 ? ['5', 'Старший детектив'] : pct >= 75 ? ['4', 'Детектив'] : pct >= 50 ? ['3', 'Стажёр'] : ['2', 'Нужна ещё тренировка'];
  if (S.mode === 'test') saveBest(S.key, pct);
  const mist = r.filter(x => !x.ok);
  let breakdown = '';
  if (S.key === 'final' || LES[S.key]) {
    const by = {};
    r.forEach(x => { const id = x.e.cat.id; by[id] = by[id] || {t: x.e.cat.title, n:0, c:0}; by[id].n++; if (x.ok) by[id].c++; });
    breakdown = `<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2>По разделам</h2><div class="tablewrap"><table><tr><th>Раздел</th><th style="text-align:right">Верно</th></tr>${Object.values(by).map(b => `<tr><td>${esc(b.t)}</td><td class="num">${b.c} из ${b.n}</td></tr>`).join('')}</table></div></section>`;
  }
  app.innerHTML = `
  <section style="display:flex;flex-direction:column;gap:8px;padding-top:12px">
    <p class="eyebrow">${S.mode === 'test' ? 'Результат теста' : 'Итог тренировки'}</p>
    <h1>${esc(S.title)}</h1>
  </section>
  <section class="card score">
    <p class="big">${c}<small> из ${n}</small></p>
    <div class="stats">
      <span>${pct}% правильных ответов</span>
      <span class="ok">Верно: ${c}</span>
      <span class="no">Ошибок: ${n - c}</span>
      <span><span class="mark">Оценка ${m[0]} · ${m[1]}</span></span>
    </div>
  </section>
  <section class="card tip" style="justify-content:space-between;flex-wrap:wrap">
    <p class="pawline">${PAW}<span>Заработано лапок: <b>${c}</b>. Всего: <b>${P.paws}</b>. Звание: <b>${esc(rankOf(P.paws).name)}</b></span></p>
    <button class="btn ghost" id="r-ach" type="button">Мои ачивки</button>
  </section>
  ${breakdown}
  <section style="display:flex;flex-direction:column;gap:14px">
    <h2>${mist.length ? 'Разбор ошибок' : 'Ошибок нет — отличная работа!'}</h2>
    <div class="mist">${mist.map((x, i) => `
      <div class="mitem">
        <span class="lbl">${esc(x.e.cat.title)}</span>
        <p><b>${esc(qText(x.e))}</b></p>
        <p class="yours">Твой ответ: ${esc(x.given)}</p>
        <p class="rightans">${x.e.cat.kind === 'words' ? '' : 'Правильный ответ: '}${esc(x.right)}</p>
        ${exOf(x.e) ? `<p>${esc(exOf(x.e))}</p>` : ''}
      </div>`).join('')}</div>
  </section>
  <div class="actions">
    ${S.ret ? '<button class="btn" id="r-back" type="button">Продолжить урок →</button>' : ''}
    ${S.mode === 'test' && CUR ? `<a class="btn" href="${esc(sendLink())}" target="_blank" rel="noopener">Отправить учителю</a>` : ''}
    <button class="btn ${S.ret ? 'ghost' : ''}" id="again" type="button">Пройти ещё раз</button>
    ${mist.length ? '<button class="btn ghost" id="retry" type="button">Повторить только ошибки</button>' : ''}
    <button class="btn ghost" id="r-home" type="button">Все тренажёры</button>
  </div>`;
  const cfg = {mode: S.mode, key: S.key, ret: S.ret, title: S.title, mist: mist.map(x => ({cat: x.e.cat, item: x.e.item}))};
  $('#again').onclick = () => cfg.ret ? launchStep(cfg.ret.u, cfg.ret.i) : start(cfg.mode, cfg.key);
  if (mist.length) $('#retry').onclick = () => { P.retried++; checkBadges(); start(cfg.mode, cfg.key, cfg.mist, {ret: cfg.ret, title: cfg.title}); };
  if (cfg.ret) $('#r-back').onclick = () => { const nx = nextPos(cfg.ret.u, cfg.ret.i); if (!nx) return renderHome(); const nk = COURSE.findIndex(x => x.id === nx[0]); unlocked(nk) ? openStep(nx[0], nx[1]) : openStep(cfg.ret.u, cfg.ret.i); window.scrollTo(0, 0); };
  $('#r-home').onclick = renderHome;
  $('#r-ach').onclick = renderAch;
  window.scrollTo(0, 0);
}

function ageOf(){ const p = typeof curProf === 'function' && curProf(); return p && p.age === 't' ? 't' : 'y'; }
function ageByKlass(k){ const n = parseInt(k, 10); return n >= 6 ? 't' : 'y'; }
function ageLabel(a){ return a === 't' ? '12–15 лет' : '7–11 лет'; }
function applyAge(){
  const h = ageOf() === 't' ? HERO_TEEN : HERO_KID;
  RACCOON = h.r; RACCOON_FULL = h.f; MAGPIE = h.m;
  const lg = document.getElementById('logo'); if (lg) lg.innerHTML = RACCOON;
  document.body.classList.toggle('teen', ageOf() === 't');
}

function people(k){
  let s = `<svg class="people" viewBox="0 0 760 120" role="img" aria-label="${k} из 10 школьников">`;
  for (let j = 0; j < 10; j++) { const x = 38 + 76 * j; s += `<g fill="${j < k ? '#F07F2E' : '#C9D0DA'}"><circle cx="${x}" cy="26" r="18"/><rect x="${x - 26}" y="50" width="52" height="66" rx="24"/></g>`; }
  return s + '</svg>';
}

const COURSE = [
{id:'u1', n:1, title:'Зачем нам этот курс', min:24, test:'lesson1', steps:[
  {t:'warm', title:'Разминка', q:'Что можно увидеть с закрытыми глазами?', a:'Сон.'},
  {t:'card', title:'Знакомьтесь: Енот Чек', hero:'r', html:`<p>Еноты-полоскуны перед едой окунают её в воду и тщательно ощупывают лапами. Чек так же «ощупывает» каждую новость, прежде чем её «проглотить».</p><p>Его имя — от английского <b>fact-check</b>, «проверка фактов».</p><p class="motto">«Сначала проверю — потом поверю!»</p>`},
  {t:'comic', title:'Знакомьтесь: Сорока Трещотка', lines:[['m','Привет! Я всё-всё знаю — мне все всё рассказывают!'],['r','А ты проверяешь то, что тебе рассказывают?'],['m','Зачем? Раз рассказали — значит, правда!'],['r','Вот этому мы и научимся. Сначала проверю — потом поверю!']]},
  {t:'card', eyebrow:'Зачем нам этот курс', title:'Мошенники охотятся на подростков', html:`<p class="callout"><b>Мошенники рассчитывают на тех, кто верит сразу.</b> Кто умеет проверять, того обмануть намного труднее — этому мы и будем учиться.</p>${people(6)}<p class="bignum">63% — больше 6 школьников из 10</p><p>хотя бы раз сталкивались с попыткой обмана или взлома. <span class="src">Опрос онлайн-школы «Умскул», 2026</span></p><div class="tiles"><div class="tile"><b class="big">1 из 5 → 1 из 3</b><span>школьников несколько раз попадались мошенникам: 22% в 9 классе и 36% в 11-м.</span><span class="src">«Умскул», 2026</span></div><div class="tile"><b class="big">≈ 1 из 5</b><span>пострадавших от мошенников в 2025 году — молодые люди 14–24 лет (22%).</span><span class="src">Банк России</span></div><div class="tile"><b class="big">было 10 → стало 12</b><span>атак на подростков 14–17 лет через «лёгкую подработку» (рост на 20%).</span><span class="src">Т-Банк, 2026</span></div></div>`},
  {t:'card', title:'Где пригодится критическое мышление', html:`<div class="tiles"><div class="tile"><b>Чаты и соцсети</b><span>Слухи разлетаются быстрее, чем их успевают проверить.</span></div><div class="tile"><b>Реклама</b><span>Её задача — чтобы ты купил, а не задумался.</span></div><div class="tile"><b>Мошенники</b><span>«Ты выиграл телефон! Перейди по ссылке и введи код из СМС».</span></div><div class="tile"><b>Учёба и споры</b><span>Доказывать свою точку зрения и честно слышать чужую.</span></div></div>`},
  {t:'card', title:'Что такое критическое мышление', html:`<p class="lead">Это <b>не</b> умение всё критиковать. Это умение <b>проверять</b> информацию, прежде чем ей поверить.</p><ol><li><b>Остановись:</b> «А это точно правда?»</li><li><b>Проверь:</b> задай вопросы и поищи доказательства.</li><li><b>Реши:</b> верю, не верю — или пока не знаю.</li></ol><p class="tile"><b>Торопят по телефону?</b> Мошенники специально не дают времени подумать. Ты всегда можешь просто положить трубку — и спокойно проверить, например позвонить маме или папе.</p><p class="motto">Чек: «Я не знаю» и «Я передумал» — это тоже умные ответы!</p>`},
  {t:'card', eyebrow:'Азбука логики', title:'Высказывание: правда или ложь', html:`<p><b>Высказывание</b> — предложение, про которое можно сказать: оно истинно или ложно.</p><div class="tiles"><div class="tile"><span class="tag good">Истинное</span><b>«Байкал — это озеро».</b></div><div class="tile"><span class="tag bad">Ложное</span><b>«2 + 2 = 5».</b><span>Тоже высказывание, просто неверное.</span></div><div class="tile"><span class="tag">Не высказывание</span><b>«Закрой окно!»</b><span>Это просьба.</span></div><div class="tile"><span class="tag">Не высказывание</span><b>«Который час?»</b><span>Это вопрос.</span></div></div>`},
  {t:'practice', title:'Тренировка: высказывания', spec:[['logic', 4, 'st']]},
  {t:'test', title:'Закрепление: тест урока 1'}
]},
{id:'u2', n:2, title:'Логично — не значит правда', min:24, test:'lesson2', steps:[
  {t:'warm', title:'Разминка', q:'Сколько будет 2 + 2 × 2?', a:'6: сначала умножение (2 × 2 = 4), потом сложение.'},
  {t:'comic', title:'Летает ли пингвин?', lines:[['m','Все птицы летают. Пингвин — птица. Значит, пингвин летает!'],['r','Рассуждаешь логично. Но первый довод ложный!'],['m','Как это ложная? Я же летаю!'],['r','Ты летаешь, а пингвин и страус — нет. Проверяй кирпичи!']]},
  {t:'card', eyebrow:'Азбука логики', title:'Рассуждение: доводы → вывод', html:`<p><b>Доводы</b> — то, что мы уже знаем. <b>Вывод</b> — то, что из них следует.</p><div class="chain"><div class="tile">Довод 1: все кошки — млекопитающие.</div><div class="tile">Довод 2: Мурка — кошка.</div><div class="tile concl">Вывод: значит, Мурка — млекопитающее.</div></div><p>Слова-подсказки. Перед доводом: <i>потому что, так как</i>. Перед выводом: <i>значит, поэтому, следовательно</i>.</p><p class="note">В учебниках логики доводы называют <b>посылками</b>. Не путай с посылкой на почте!</p>`},
  {t:'card', eyebrow:'Азбука логики', title:'Логично — ещё не значит правда', html:`<div class="msg"><p>Все рыбы умеют летать. <span class="tag bad">Ложь</span></p><p>Акула — рыба.</p><p><b>Значит, акула умеет летать.</b></p></div><p>Вывод построен по правилам, но первый довод ложный — и вывод получился ложным.</p><div class="tile"><b>Выводу можно доверять, только если:</b><span>1. Все доводы истинны.</span><span>2. Вывод действительно из них следует.</span></div><p class="motto">Чек: «Проверяй и кирпичи, и то, как из них построен дом!»</p>`},
  {t:'card', eyebrow:'Азбука логики', title:'Два способа рассуждать', html:`<div class="tiles"><div class="tile"><b class="big">Дедукция</b><span>От общего правила к частному случаю.</span><i>«Все металлы проводят ток. Медь — металл. Значит, медь проводит ток».</i><span>Если доводы верны, вывод <b>точно</b> верен.</span></div><div class="tile"><b class="big">Индукция</b><span>От примеров к общему правилу.</span><i>«Я видел 100 белых лебедей. Значит, все лебеди белые».</i><span>Вывод только <b>вероятный</b>: в Австралии живут чёрные лебеди!</span></div></div>`},
  {t:'card', eyebrow:'Азбука логики', title:'«Если…, то…»: ловушка обратного хода', html:`<div class="msg"><b>«Если идёт дождь, то асфальт мокрый».</b></div><div class="tiles"><div class="tile"><span class="tag good">Верно</span><span>Идёт дождь → значит, асфальт мокрый.</span></div><div class="tile"><span class="tag bad">Ловушка</span><span>Асфальт мокрый → значит, шёл дождь? Не обязательно! Могла проехать поливальная машина.</span></div></div><p><b>Правило:</b> «Если А, то Б» не значит «Если Б, то А». Каждый пятиклассник — школьник, но не каждый школьник — пятиклассник.</p>`},
  {t:'practice', title:'Тренировка: доводы и выводы', spec:[['logic', 4, 'arg|val|ind|if']]},
  {t:'test', title:'Закрепление: тест урока 2'}
]},
{id:'u3', n:3, title:'Дело №1: факт или мнение?', min:20, test:'lesson3', steps:[
  {t:'warm', title:'Разминка', q:'Что всегда увеличивается и никогда не уменьшается?', a:'Возраст.'},
  {t:'comic', title:'Самая вкусная ягода', lines:[['m','Это факт: малина — самая вкусная ягода!'],['r','Это не факт, а мнение. Вкус нельзя проверить.'],['m','А «малина растёт на кустах» — тоже мнение?'],['r','Нет, это факт: можно пойти в лес и посмотреть!']]},
  {t:'card', title:'Факт или мнение: как отличить', html:`<div class="tiles"><div class="tile"><span class="tag good">Факт</span><span>Можно <b>проверить</b>: измерить, посчитать, увидеть, найти в надёжном источнике.</span><i>«Вода кипит при 100 °C на уровне моря»</i></div><div class="tile"><span class="tag">Мнение</span><span>Чьё-то <b>отношение</b>, вкус или оценка. Его можно обсуждать, но нельзя доказать.</span><i>«Математика — самый скучный предмет»</i><span>Слова-подсказки: лучший, скучный, по-моему, я считаю.</span></div></div><p><b>Главный вопрос:</b> можно ли это проверить?</p><div class="tile"><span class="tag bad">Осторожно</span><span>«Факт» бывает ложным: «Пингвины живут на Северном полюсе» — это можно проверить… и это неправда.</span></div>`},
  {t:'practice', title:'Тренировка: факт или мнение', spec:[['factopinion', 5]]},
  {t:'test', title:'Закрепление: тест урока 3'}
]},
{id:'u4', n:4, title:'Дело №2: суперсила вопросов', min:20, test:'lesson4', steps:[
  {t:'warm', title:'Разминка', q:'Ты капитан корабля. На борту 20 матросов и 3 пушки. Сколько лет капитану?', a:'Столько же, сколько тебе — ведь капитан ты.'},
  {t:'comic', title:'Зиму отменяют?!', lines:[['m','СРОЧНО! В лесу отменяют зиму! Перешли всем!'],['r','Стоп. Кто это сказал? И откуда он знает?'],['m','Ну… дятел слышал от ежа, а ёж — от белки…'],['r','Значит, это слух. Давай сначала проверим!']]},
  {t:'card', title:'5 вопросов Енота Чека', hero:'r', html:`<ol><li><b>Кто это говорит?</b> Знаем ли мы автора? Разбирается ли он в теме?</li><li><b>Откуда он это знает?</b> Видел сам, изучал — или «где-то слышал»?</li><li><b>Какие доказательства?</b> Факты, фото, исследования — или только слова?</li><li><b>Кому это выгодно?</b> Может, кто-то хочет продать, напугать или прославиться?</li><li><b>Что говорят другие?</b> Подтверждают ли это надёжные источники?</li></ol>`},
  {t:'case', title:'Найди красные флажки', ctx:'<b>Чат класса · 21:47</b><br>СРОЧНО!!! Мне сказала подруга сестры, что завтра школу закрывают на карантин. Учителя пока скрывают!!! Перешли всем, пока не удалили!!!', q:'Найди минимум 4 подозрительные детали. Что сделать вместо того, чтобы переслать?', reveal:`<ol><li><b>«СРОЧНО!!!»</b> — капс и восклицательные знаки давят на эмоции и торопят.</li><li><b>«Подруга сестры»</b> — источник неизвестен, новость «через третьи руки».</li><li><b>«Учителя скрывают»</b> — заранее объясняет, почему нет доказательств.</li><li><b>«Перешли всем»</b> — просят распространить, пока никто не проверил.</li><li><b>Ни ссылки, ни подписи</b> — нет официального источника.</li></ol><p><b>Что делать:</b> не пересылать. Проверить на сайте школы или спросить классного руководителя.</p>`},
  {t:'practice', title:'Тренировка: кому верить', spec:[['sources', 4]]},

]},
{id:'u5', n:5, title:'Осторожно, мошенники!', min:22, test:'lesson5', steps:[
  {t:'warm', title:'Разминка', q:'Что принадлежит тебе, но другие пользуются этим чаще, чем ты?', a:'Твоё имя. А пароли, коды и данные карты — только твои, ими никто другой пользоваться не должен.'},

  {t:'card', title:'На какую «кнопку» жмут мошенники', html:`<ul><li><b>«Ответы на ОГЭ и ЕГЭ — скачай файл».</b> Жмут на страх и желание лёгкого пути. Настоящие ответы заранее не продают.</li><li><b>«Учитель» просит код из СМС.</b> Жмут на доверие к взрослым. Код — никому, перезвони учителю сам.</li><li><b>«Лёгкая подработка», первая выплата сразу.</b> Слишком хорошо, чтобы быть правдой. Первая выплата — приманка.</li><li><b>Бесплатные скины и игровая валюта.</b> Жмут на азарт. Не вводи пароль на чужих сайтах.</li><li><b>Звонок «из полиции»: «Спаси родителей!»</b> Страх и секретность. Положи трубку и сам позвони родителям.</li></ul><div class="tile"><b>Формула обмана:</b><span>срочно + страшно (или очень выгодно) + «никому не говори». Видишь её — стоп!</span></div>`},

  const nmIn = $('#c-name'); if (nmIn) nmIn.oninput = () => { P.course.name = nmIn.value; saveP(); $('#c-out').textContent = nmIn.value || 'Имя ученика'; };

}

/* ---------- profiles, share code, teacher journal ---------- */
function pcClass(v){ return v == null ? 'pc-none' : v >= 75 ? 'pc-good' : v < 50 ? 'pc-bad' : ''; }
function summary(){ const pr = curProf() || {}; return {v:2, n:curName(), login: pr.login || '', klass: pr.klass || '', age: pr.age || '', mk: pr.mk || '', i: pr.bot || null, p:P.paws, r:rankOf(P.paws).name, l:lessonsDone(), c:coursePct(), t:LESSONS.map(l => (l.final ? P.tests.final : P.tests[l.id]) ?? null), b:BADGES.filter(b => P.badges[b.id]).length, d:new Date().toISOString().slice(0, 10)}; }
function b64(bytes){ let s = ''; for (let k = 0; k < bytes.length; k += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x8000)); return btoa(s); }
function unb64(str){ const bin = atob(str); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
async function pipeBytes(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function encodeFull(){
  const pr = curProf() || {};
  const o = Object.assign(summary(), {pin: pr.pin || '', full: P});
  if (typeof CompressionStream === 'function') { try { return 'CHEK2:' + b64(await pipeBytes(new TextEncoder().encode(JSON.stringify(o)), new CompressionStream('deflate-raw'))); } catch (_) {} }
  const s = summary(); s.v = 1; return 'CHEK1:' + b64(new TextEncoder().encode(JSON.stringify(s)));
}
async function decodeAll(text){
  const out = []; const re = /CHEK([12]):([A-Za-z0-9+/=]+)/g; let m;
  while ((m = re.exec(text || ''))) {
    try {
      let bytes = unb64(m[2]);
      if (m[1] === '2') bytes = await pipeBytes(bytes, new DecompressionStream('deflate-raw'));
      const o = JSON.parse(new TextDecoder().decode(bytes));
      if (o && (o.v === 1 || o.v === 2) && typeof o.n === 'string') { o.t = normT(o.t); out.push(o); }
    } catch (_) {}
  }
  return out;
}
async function shareText(){ const s = summary(); return `Енот Чек · ${s.n || 'Ученик'} · лапок: ${s.p} · уроков: ${s.l} из ${COURSE.length} · ${s.r}\n${await encodeFull()}`; }

let PENDING = null;
const LOGIN_RE = /^[a-z0-9_.-]{3,20}$/;
function newId(){ return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1000); }

  updateHud(); INBOX = []; updateBell(); loadInbox();
  try { if (/^s-/.test(location.hash.slice(1))) history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
  if (pr && !pr.age && pr.klass) { pr.age = ageByKlass(pr.klass); saveProfiles(); }
  applyAge();

  route();
}
function logout(){ setCur(null); P = freshP(); INBOX = []; applyAge(); updateHud(); updateBell(); renderWho(); }

/* --- шифрование: личные сообщения в колокольчик видит только адресат --- */
const ENC = new TextEncoder();
function b64u(bytes){ return b64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function newMk(){ return b64u(crypto.getRandomValues(new Uint8Array(12))); }
async function sha256(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', ENC.encode(s))); }
async function midOf(mk){ return [...(await sha256('chek-mid:' + mk)).slice(0, 6)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function keyOf(mk){ return crypto.subtle.importKey('raw', await sha256('chek-inbox:' + mk), 'AES-GCM', false, ['encrypt', 'decrypt']); }
async function sealFor(mk, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await keyOf(mk), ENC.encode(JSON.stringify(obj))));
  return {to: await midOf(mk), iv: b64(iv), ct: b64(ct)};
}
async function openSealed(mk, m){ const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(m.iv)}, await keyOf(mk), unb64(m.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
function msgId(){ return Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

/* --- хранилище колокольчика: файл inbox.json в хранилище курса на GitHub --- */
function ghCfg(){ try { const g = JSON.parse(localStorage.getItem('chek-gh') || 'null'); return g && g.token ? g : null; } catch (_) { return null; } }
function inboxUrls(){ const g = ghCfg(); return [`https://raw.githubusercontent.com/${(g && g.repo) || GH_DEFAULT_REPO}/main/inbox.json`, 'inbox.json']; }
async function ghPush(add){
  const g = ghCfg(); if (!g) throw new Error('колокольчик не подключён');
  const url = `https://api.github.com/repos/${g.repo}/contents/inbox.json`;
  const H = {Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json'};
  for (let attempt = 0; attempt < 3; attempt++) {
    let sha = null, data = {v: 1, msgs: []};
    const r = await fetch(url + '?ref=main&t=' + Date.now(), {headers: H, cache: 'no-store'});
    if (r.ok) { const j = await r.json(); sha = j.sha; try { data = JSON.parse(new TextDecoder().decode(unb64(String(j.content || '').replace(/\s/g, '')))); } catch (_) {} }
    else if (r.status !== 404) throw new Error('GitHub ответил ' + r.status);
    data.msgs = (Array.isArray(data.msgs) ? data.msgs : []).concat(add).slice(-300);
    const body = {message: 'Сообщения Енота Чека', content: b64(ENC.encode(JSON.stringify(data))), branch: 'main'};
    if (sha) body.sha = sha;
    const p = await fetch(url, {method: 'PUT', headers: Object.assign({'Content-Type': 'application/json'}, H), body: JSON.stringify(body)});
    if (p.ok) return true;
    if (p.status !== 409 && p.status !== 422) throw new Error('GitHub ответил ' + p.status);
  }
  throw new Error('GitHub занят, попробуйте ещё раз');
}
async function ghCheck(g){
  try {
    const r = await fetch(`https://api.github.com/repos/${g.repo}`, {headers: {Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json'}});
    if (!r.ok) return r.status === 401 ? 'Ключ не подошёл — проверьте, что скопирован целиком.' : 'Хранилище не найдено — проверьте название.';
    const j = await r.json();
    return j.permissions && j.permissions.push ? '' : 'У ключа нет права записи (Contents: Read and write).';
  } catch (_) { return 'Нет связи с GitHub.'; }
}

async function loadInbox(){
  const pr = curProf();
  if (!pr || !pr.mk) { INBOX = []; updateBell(); return; }
  let data = null;
  for (const u of inboxUrls()) { try { const r = await fetch(u + '?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) { data = await r.json(); break; } } catch (_) {} }
  const out = [];
  if (data && Array.isArray(data.msgs)) {
    const mid = await midOf(pr.mk);
    for (const m of data.msgs) {
      try {
        if (m.to === mid) out.push(Object.assign({id: m.id, at: m.at, own: true}, await openSealed(pr.mk, m)));

    <p class="note">Зелёным — 75% и выше, красным — ниже 50%. «Написать» — личное сообщение; имя — результаты и переписка. «Связь» показывает, куда дойдёт сообщение.</p>`
    : '<p class="note">Пока нет учеников. Они появятся, когда нажмут «Отправить учителю» в Академии, напишут боту /start или когда вы вставите их код ниже.</p>'}
    <div class="actions"><button class="btn ghost" id="t-csv" type="button">Скачать таблицу (Excel)</button><button class="btn ghost" id="t-refresh" type="button">Обновить</button></div>
  </section>
  <form class="card form" id="tbc" style="max-width:none">
    <h2>Отправить сообщение</h2>
    <label class="field" for="tbcw">Кому<select id="tbcw">${whoOpts}</select></label>
    <label class="field" for="tbct">Текст<textarea id="tbct" class="codebox" rows="3" placeholder="Например: Сегодня новое дело — заходите в Академию!"></textarea></label>
    <label class="field" for="tbcl">Кнопка урока (необязательно)<select id="tbcl"><option value="">— без кнопки —</option>${lessonOpts()}</select></label>
    <p class="note" id="tbcm" aria-live="polite"></p>
    <div class="actions"><button class="btn" type="submit">Отправить</button></div>
    <p class="note">Сообщение уходит в Telegram (тем, кто зарегистрирован в боте) и в колокольчик в Академии (если он подключён ниже).</p>
  </form>
  <form class="card form" id="tcodes" style="max-width:none">
    <h2>Добавить результаты по кодам</h2>
    <p class="note">Если ученик прислал код из «Моего кабинета» (начинается с CHEK), вставьте его сюда — можно сразу несколько.</p>
    <textarea id="tcodet" class="codebox" rows="3" placeholder="Вставьте сообщения учеников с кодами CHEK…"></textarea>
    <p class="note" id="tcodem" aria-live="polite"></p>
    <div class="actions"><button class="btn ghost" type="submit">Добавить</button></div>
  </form>
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>Колокольчик в Академии ${gh ? '<span class="chan">подключён</span>' : '<span class="chan off">не подключён</span>'}</h2>
    ${gh ? `<p class="note">Сообщения кладутся в хранилище <b>${esc(gh.repo)}</b> (файл inbox.json) в зашифрованном виде — личное сообщение может прочитать только сам ученик. У ученика оно появится под колокольчиком через 1–5 минут.</p><div class="actions"><button class="btn ghost small" id="gh-off" type="button">Отключить на этом компьютере</button></div>`
    : `<p>Чтобы сообщения приходили ученикам прямо в Академию, один раз создайте на GitHub ключ доступа:</p>
    <ol class="prose" style="font-size:16px"><li>Откройте <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Settings → Developer settings → Fine-grained tokens → Generate new token</a>.</li><li>Token name: <b>Енот Чек</b>. Expiration: <b>1 год</b>.</li><li>Repository access: <b>Only select repositories</b> → выберите <b>enot-chek</b>.</li><li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li><li>Нажмите <b>Generate token</b>, скопируйте ключ (начинается с github_pat_) и вставьте ниже.</li></ol>
    <form class="form" id="ghf" style="max-width:none"><label class="field" for="ghtok">Ключ доступа GitHub<input id="ghtok" type="password" autocomplete="off" placeholder="github_pat_…" required></label><label class="field" for="ghrepo">Хранилище<input id="ghrepo" type="text" value="${GH_DEFAULT_REPO}" required></label><p class="err" id="gherr" aria-live="polite"></p><div class="actions"><button class="btn" type="submit">Подключить колокольчик</button></div></form>
    <p class="note">Ключ хранится только в этом браузере на этом компьютере и не попадает на сайт.</p>`}
  </section>
  <p class="note">Ученики на этом устройстве и сброс их кодов входа: <button class="link" id="t-journal" type="button">открыть</button></p>`;
  app.querySelectorAll('.chipf').forEach(b => b.onclick = () => renderTeacher(b.dataset.k || undefined));
  app.querySelectorAll('.tstud').forEach(b => b.onclick = () => renderTeacherStudent(+b.dataset.i, klass));
  app.querySelectorAll('.twrite').forEach(b => b.onclick = () => renderTeacherStudent(+b.dataset.i, klass, true));
  const tq = $('#tq');
  if (tq) tq.oninput = () => { const q = tq.value.trim().toLowerCase(); let shown = 0; app.querySelectorAll('.trow').forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) shown++; }); $('#tqnone').hidden = shown > 0; };
  $('#t-refresh').onclick = () => renderTeacher(klass);
  $('#t-journal').onclick = renderJournal;
  $('#t-csv').onclick = () => downloadCsv(st, klass);
  $('#tbc').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('#tbct').value.trim(), lesson = $('#tbcl').value, who = $('#tbcw').value;
    if (!text && !lesson) { $('#tbcm').textContent = 'Напишите текст или выберите урок.'; return; }
    $('#tbcm').textContent = 'Отправляю…';
    if (who.startsWith('r:')) {
      if (!text) { $('#tbcm').textContent = 'Для личного сообщения напишите текст.'; return; }
      $('#tbcm').textContent = await teacherSend(TROWS[+who.slice(2)], text, lesson);
    } else $('#tbcm').textContent = await teacherBroadcast(who.startsWith('k:') ? who.slice(2) : '', text, lesson);
    if (/✓/.test($('#tbcm').textContent)) $('#tbct').value = '';
  };
  $('#tcodes').onsubmit = async ev => {
    ev.preventDefault();
    const found = await decodeAll($('#tcodet').value);
    if (!found.length) { $('#tcodem').textContent = 'Коды не найдены. Скопируйте сообщение ученика целиком, вместе с «CHEK».'; return; }
    const j = loadJ();
    found.forEach(s => { const {full, pin, ...rest} = s; const k = (rest.login || rest.n).trim().toLowerCase(); if (!j[k] || rest.d >= j[k].d) j[k] = rest; });
    saveJ(j); toast(`<span>Добавлено: ${found.length}</span>`); renderTeacher(klass);
  };
  const ghf = $('#ghf');
  if (ghf) ghf.onsubmit = async ev => {
    ev.preventDefault();
    const g = {token: $('#ghtok').value.trim(), repo: $('#ghrepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '')};
    $('#gherr').textContent = 'Проверяю ключ…';
    const err = await ghCheck(g);
    if (err) { $('#gherr').textContent = err; return; }
    try { localStorage.setItem('chek-gh', JSON.stringify(g)); } catch (_) {}
    toast('<span>Колокольчик подключён</span>'); renderTeacher(klass);
  };
  const off = $('#gh-off');
  if (off) off.onclick = () => { try { localStorage.removeItem('chek-gh'); } catch (_) {} renderTeacher(klass); };
  window.scrollTo(0, 0);
}

async function renderTeacherStudent(i, klass, focusWrite){
  S = null; stopPoll(); setMode('teacher'); document.body.classList.add('wide');
  const r = TROWS[i]; if (!r) return renderTeacher(klass);
  let chat = null;
  if (r.src !== 'code' && r.num && TT) { try { const x = await tapi('/api/student/' + r.num); if (x.ok) chat = (await x.json()).messages || []; } catch (_) {} }
  const d = r.data || {}; const t = (d.t || []).concat(Array(LESSONS.length).fill(null)).slice(0, LESSONS.length);
  const gh = ghCfg(), canTg = r.src !== 'code' && !!TT, canBell = !!r.mk && !!gh;
  const chatHtml = msgs => msgs.length ? msgs.map(m => `<div class="tmsg ${m.dir}"><small>${m.dir === 'in' ? 'Ученик' : 'Вы'} · ${esc(fmtAt(m.at))}</small>${esc(m.text)}</div>`).join('') : '<p class="note">Сообщений пока нет.</p>';
  const history = chat ? chat : sentLog(r).map(m => ({dir: 'out', text: m.text, at: m.at}));
  const why = !canTg && !canBell ? `<p class="tile">${r.src === 'code' ? 'Этот ученик не зарегистрирован в Telegram-боте. ' : 'Бот сейчас выключен. '}${r.mk ? (gh ? '' : 'Подключите колокольчик на главной странице кабинета — и сообщение придёт ученику в Академию.') : 'Код ученика старый, без ключа колокольчика: попросите его заново отправить результат из «Моего кабинета».'}</p>` : '';
  app.innerHTML = `<button class="back" id="t-back" type="button">← Все ученики${klass ? ' ' + esc(klass) : ''}</button>` + tHead(`${esc(r.name)}${r.klass ? ' · ' + esc(r.klass) : ''}`) + `
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>Прогресс</h2>
    ${r.data ? `<p>Лапок: <b>${d.p ?? 0}</b> · звание: <b>${esc(String(d.r ?? '—'))}</b> · уроков: <b>${d.l ?? 0} из ${COURSE.length}</b> · курс: <b>${d.c ?? 0}%</b> · ачивок: <b>${d.b ?? 0}</b>${r.login ? ` · логин: <b>${esc(r.login)}</b>` : ''}</p>
    <div class="tablewrap"><table class="jt"><tr>${LESSONS.map(l => `<th>${l.final ? 'Итог' : 'Урок ' + l.n}</th>`).join('')}</tr><tr>${t.map(v => `<td class="num ${pcClass(v)}">${v == null ? '—' : v + '%'}</td>`).join('')}</tr></table></div>
    <p class="note">Результат от: ${esc(String(r.received || '').replace('T', ' '))}</p>` : '<p class="note">Ученик ещё не присылал результат.</p>'}
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>Сообщения</h2>
    <p>Куда придёт: ${canTg ? '<span class="chan">Telegram</span>' : ''}${canBell ? '<span class="chan">колокольчик в Академии</span>' : ''}${!canTg && !canBell ? '<span class="chan off">пока некуда</span>' : ''}</p>
    ${why}
    <div class="tchat" id="tchat">${chatHtml(history)}</div>
    <form class="form" id="tsend" style="max-width:none">
      <label class="field" for="tst">Личное сообщение<textarea id="tst" class="codebox" rows="3" required placeholder="Например: Отличный тест! Попробуй урок ${Math.min((d.l || 0) + 1, COURSE.length)}."></textarea></label>
      <label class="field" for="tsl">Кнопка урока (необязательно)<select id="tsl"><option value="">— без кнопки —</option>${lessonOpts()}</select></label>
      <p class="note" id="tsm" aria-live="polite"></p>
      <div class="actions"><button class="btn" type="submit"${!canTg && !canBell ? ' disabled' : ''}>Отправить</button></div>
    </form>
  </section>`;
  const scrollChat = () => { const c = $('#tchat'); if (c) c.scrollTop = c.scrollHeight; };
  scrollChat();
  if (focusWrite) { const ta = $('#tst'); if (ta) { if (ta.scrollIntoView) ta.scrollIntoView({block: 'center'}); ta.focus(); } }
  $('#t-back').onclick = () => renderTeacher(klass);
  const refresh = async () => {
    if (!$('#tchat')) return stopPoll();
    let msgs = sentLog(r).map(m => ({dir: 'out', text: m.text, at: m.at}));
    if (canTg) { try { const x = await tapi('/api/student/' + r.num); const k = await x.json(); if (k.messages) msgs = k.messages; } catch (_) {} }
    const c = $('#tchat'); if (c) { c.innerHTML = chatHtml(msgs); scrollChat(); }
  };
  if (canTg) TPOLL = setInterval(refresh, 15000);
  $('#tsend').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('#tst').value.trim(); if (!text) return;
    $('#tsm').textContent = 'Отправляю…';
    $('#tsm').textContent = await teacherSend(r, text, $('#tsl').value);
    if (/✓/.test($('#tsm').textContent)) { $('#tst').value = ''; refresh(); }
  };
  window.scrollTo(0, 0);
}

function route(){
  const h = location.hash.slice(1);
  if (h === 'teacher' || MODE === 'teacher') return renderTeacher();
  if (h === 'journal') return renderJournal();
  const sm = h.match(/^s-([a-z0-9]{6,16})(?:-([A-Za-z0-9_]{3,40}))?$/);
  if (sm) {
    const pr = PR.list.find(p => p.bot === sm[1]);
    if (pr && CUR === pr.id) { try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} return renderHome(); }
    PENDING = {bot: sm[1], botName: sm[2] || ''};
    return pr ? renderWho('pin', pr.id) : renderWho(PR.list.length ? 'list' : 'reg');
  }
  if (!CUR) return renderWho();
  const uk = COURSE.findIndex(u => u.id === h);
  if (uk >= 0 && unlocked(uk)) openStep(h, firstOpen(COURSE[uk]));
  else if (h === 'course') openCourse();
  else if (h === 'final' || CAT[h] || LES[h]) renderIntro(h); else if (h === 'achievements') renderAch(); else if (h === 'inbox') renderInbox(); else renderHome();
}
$('#hud').onclick = renderAch;
$('#bell').onclick = () => { stopPoll(); renderInbox(); loadInbox().then(() => { if ($('#i-refresh')) renderInbox(); }); };
setInterval(() => { if (CUR && MODE !== 'teacher' && !document.hidden) loadInbox(); }, 180000);
applyAge();
if (CUR) { const pr0 = curProf(); if (pr0 && !pr0.mk) { pr0.mk = newMk(); saveProfiles(); } loadInbox(); }
$('#mode-btn').onclick = () => { stopPoll(); if (MODE === 'teacher') { setMode('student'); route(); } else renderTeacher(); };
updateHud();
updateModeBtn();
window.addEventListener('hashchange', route);
route();
</script>

</body>
