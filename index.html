  app.querySelectorAll('.twrite').forEach(b => b.onclick = () => renderTeacherStudent(+b.dataset.n, klass, true));
  const tq = $('#tq');
  if (tq) tq.oninput = () => { const q = tq.value.trim().toLowerCase(); let shown = 0; app.querySelectorAll('.trow').forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) shown++; }); $('#tqnone').hidden = shown > 0; };
  $('#t-refresh').onclick = () => renderTeacher(klass);
  $('#t-journal').onclick = renderJournal;
  $('#t-excel').onclick = async () => {
    try {
      const r = await tapi('/api/excel' + (klass ? '?klass=' + encodeURIComponent(klass) : ''));
      const blob = await r.blob(); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `Енот Чек — ${klass ? 'класс ' + klass : 'все классы'}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
    } catch (_) { toast('<span>Не удалось скачать Excel</span>'); }
  };
  $('#tbc').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('#tbct').value.trim(), lesson = $('#tbcl').value, who = $('#tbcw').value;
    if (!text && !lesson) { $('#tbcm').textContent = 'Напишите текст или выберите урок.'; return; }
    try {
      if (who.startsWith('s:')) {
        if (!text) { $('#tbcm').textContent = 'Для личного сообщения напишите текст.'; return; }
        const r = await (await tapi('/api/student/' + who.slice(2) + '/send', {method: 'POST', json: {text, lesson}})).json();
        $('#tbcm').textContent = r.error || 'Личное сообщение отправлено.'; if (!r.error) $('#tbct').value = '';
      } else {
        const r = await (await tapi('/api/broadcast', {method: 'POST', json: {klass: who.startsWith('k:') ? who.slice(2) : '', lesson, text}})).json();
        $('#tbcm').textContent = r.error || `Отправлено: ${r.sent} из ${r.total}.`; if (!r.error) $('#tbct').value = '';
      }
    } catch (_) { $('#tbcm').textContent = 'Нет связи с ботом.'; }
  };
  window.scrollTo(0, 0);
}

async function renderTeacherStudent(num, klass, focusWrite){
  S = null; stopPoll(); setMode('teacher'); document.body.classList.add('wide');
  let j;
  try { const r = await tapi('/api/student/' + num); j = await r.json(); if (!r.ok) return renderTeacher(klass); }
  catch (_) { return renderTeacher(klass); }
  const d = j.data || {}; const t = (d.t || []).concat(Array(9).fill(null)).slice(0, 9);
  const chatHtml = msgs => msgs.length ? msgs.map(m => `<div class="tmsg ${m.dir}"><small>${m.dir === 'in' ? 'Ученик' : 'Вы'} · ${esc(m.at.replace('T', ' '))}</small>${esc(m.text)}</div>`).join('') : '<p class="note">Переписки пока нет.</p>';
  app.innerHTML = `<button class="back" id="t-back" type="button">← Все ученики${klass ? ' ' + esc(klass) : ''}</button>` + tHead(`№${j.num} · ${esc(j.name)} · ${esc(j.klass)}`) + `
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>Прогресс</h2>
    ${j.data ? `<p>Лапок: <b>${d.p ?? 0}</b> · звание: <b>${esc(String(d.r ?? '—'))}</b> · уроков: <b>${d.l ?? 0} из 9</b> · курс: <b>${d.c ?? 0}%</b> · ачивок: <b>${d.b ?? 0}</b> · логин: <b>${esc(String(d.login || '—'))}</b></p>
    <div class="tablewrap"><table><tr>${LESSONS.map(l => `<th>${l.final ? 'Итог' : 'Урок ' + l.n}</th>`).join('')}</tr><tr>${t.map(v => `<td class="num ${pcClass(v)}">${v == null ? '—' : v + '%'}</td>`).join('')}</tr></table></div>
    <p class="note">Результат прислан боту: ${esc((j.received || '').replace('T', ' '))}</p>` : '<p class="note">Ученик ещё не присылал результат из «Моего кабинета».</p>'}
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>Переписка</h2>
    <div class="tchat" id="tchat">${chatHtml(j.messages || [])}</div>
    <form class="form" id="tsend" style="max-width:none">
      <label class="field" for="tst">Личное сообщение<textarea id="tst" class="codebox" rows="3" required placeholder="Например: Отличный тест! Попробуй урок ${Math.min((d.l || 0) + 1, 9)}."></textarea></label>
      <label class="field" for="tsl">Кнопка урока (необязательно)<select id="tsl"><option value="">— без кнопки —</option>${lessonOpts()}</select></label>
      <p class="note" id="tsm" aria-live="polite"></p>
      <div class="actions"><button class="btn" type="submit">Отправить в Telegram</button></div>
    </form>
  </section>`;
  const scrollChat = () => { const c = $('#tchat'); if (c) c.scrollTop = c.scrollHeight; };
  scrollChat();
  if (focusWrite) { const ta = $('#tst'); if (ta) { if (ta.scrollIntoView) ta.scrollIntoView({block: 'center'}); ta.focus(); } }
  $('#t-back').onclick = () => renderTeacher(klass);
  const refresh = async () => { if (!$('#tchat')) return stopPoll(); try { const r = await tapi('/api/student/' + num); const k = await r.json(); const c = $('#tchat'); if (c && k.messages) { c.innerHTML = chatHtml(k.messages); scrollChat(); } } catch (_) {} };
  TPOLL = setInterval(refresh, 15000);
  $('#tsend').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('#tst').value.trim(); if (!text) return;
    try { const r = await tapi('/api/student/' + num + '/send', {method: 'POST', json: {text, lesson: $('#tsl').value}}); const k = await r.json();
      $('#tsm').textContent = k.error || 'Отправлено в Telegram.'; if (!k.error) { $('#tst').value = ''; refresh(); }
    } catch (_) { $('#tsm').textContent = 'Нет связи с ботом.'; }
  };
  window.scrollTo(0, 0);
}

function route(){
  const h = location.hash.slice(1);
  if (h === 'teacher' || MODE === 'teacher') return renderTeacher();
  if (h === 'journal') return renderJournal();
  const sm = h.match(/^s-([a-z0-9]{6,16})(?:-([A-Za-z0-9_]{3,40}))?$/);
  if (sm) {
    const pr = PR.list.find(p => p.bot === sm[1]);
    if (pr && CUR === pr.id) { try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} return renderHome(); }
    PENDING = {bot: sm[1], botName: sm[2] || ''};
    return pr ? renderWho('pin', pr.id) : renderWho(PR.list.length ? 'list' : 'reg');
  }
  if (!CUR) return renderWho();
  const uk = COURSE.findIndex(u => u.id === h);
  if (uk >= 0 && unlocked(uk)) openStep(h, firstOpen(COURSE[uk]));
  else if (h === 'course') openCourse();
  else if (h === 'final' || CAT[h] || LES[h]) renderIntro(h); else if (h === 'achievements') renderAch(); else renderHome();
}
$('#hud').onclick = renderAch;
$('#mode-btn').onclick = () => { stopPoll(); if (MODE === 'teacher') { setMode('student'); route(); } else renderTeacher(); };
updateHud();
updateModeBtn();
window.addEventListener('hashchange', route);
route();
</script>
