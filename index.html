<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Академия Енота Чека</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@700&display=swap">
<style>
/* Layout: one centred column of "case file" cards with comic ink shadows; home = grid of trainer cards */
:root{
  --paper:#FFF8EC; --card:#FFFDF8; --ink:#1F2A44; --muted:#55607A; --line:#1F2A44; --shadow:#1F2A44;
  --accent:#F07F2E; --accent-ink:#B9530F; --on-accent:#1F2A44; --tint:#EAF2FB;
  --good:#1E7A4C; --good-bg:#E3F4EA; --bad:#B42318; --bad-bg:#FBE7E4;
  --display:'Rubik', Arial, sans-serif; --body:'Nunito', Verdana, sans-serif; --hand:'Caveat', 'Brush Script MT', cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#131A2B; --card:#1C2540; --ink:#F2ECE0; --muted:#AEB8CC; --line:#8C98B3; --shadow:#070B16;
  --accent:#F28C45; --accent-ink:#FFB47A; --on-accent:#1F2A44; --tint:#22304F;
  --good:#6FD39C; --good-bg:#17382A; --bad:#FF8F85; --bad-bg:#3D1F22; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#131A2B; --card:#1C2540; --ink:#F2ECE0; --muted:#AEB8CC; --line:#8C98B3; --shadow:#070B16;
  --accent:#F28C45; --accent-ink:#FFB47A; --on-accent:#1F2A44; --tint:#22304F;
  --good:#6FD39C; --good-bg:#17382A; --bad:#FF8F85; --bad-bg:#3D1F22; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;align-items:center;gap:12px;padding-block:16px;border-bottom:2px solid var(--line)}
header.top .name{font-family:var(--display);font-weight:800;font-size:20px;flex:1;min-width:0}
header.top #logo svg{width:52px;height:52px;flex:none;display:block}
.hud svg{width:22px;height:22px;flex:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;font-weight:800}
h2{font-size:clamp(21px,4vw,26px);line-height:1.25;font-weight:700}
h3{font-size:20px;font-weight:700}
p{margin:0}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.lead{font-size:18px;color:var(--muted);max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:3px solid var(--line);border-radius:14px;padding:12px 22px;font-weight:800;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink)}
.back,.link{background:none;border:none;padding:6px 0;color:var(--accent-ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);padding:22px}
.final{display:flex;gap:18px;align-items:center;text-align:left;width:100%;background:var(--ink);color:var(--paper);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--accent);padding:22px}
.final h2{color:var(--paper)}
.final p{color:var(--paper);opacity:.85}
.final .go{margin-left:auto;font-family:var(--display);font-weight:800;font-size:28px;color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:18px;min-width:0}
.cat:hover{background:var(--tint)}
.cat .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted)}
.cat p{color:var(--muted);font-size:15px}
.best{color:var(--good);font-weight:800}
.note{font-size:14px;color:var(--muted)}
.tip{display:flex;gap:14px;align-items:center;background:var(--tint);border-radius:18px;padding:14px 18px}
.tip svg{width:64px;height:64px;flex:none}
.hand{font-family:var(--hand);font-size:26px;line-height:1.15}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.mode{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mode p{color:var(--muted);flex:1}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qcount{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.bar span{display:block;height:100%;background:var(--accent)}
.qcard{display:flex;flex-direction:column;gap:16px}
.ctx{margin:0;background:var(--tint);border-radius:14px;padding:14px 18px;font-size:19px;font-weight:700}
.hint{color:var(--muted);font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:600}
.opt:hover:not(:disabled){background:var(--tint)}
.opt.sel{background:var(--tint);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.tf{flex-direction:row;flex-wrap:wrap}
.tf .opt{flex:1;min-width:150px;text-align:center;font-family:var(--display);font-size:20px}
.chosen{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:8px;min-height:24px}
.chosen li{padding:8px 12px;border:2px dashed var(--line);border-radius:12px;font-weight:600}
.chosen li.right{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.chosen li.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;text-align:left}
.chip:disabled{opacity:.3;cursor:default}
.sort{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.srow p{flex:1;min-width:180px;font-weight:600}
.srow.right{background:var(--good-bg);border-color:var(--good)}
.srow.wrong{background:var(--bad-bg);border-color:var(--bad)}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--card);border:none;padding:8px 14px;font-weight:800}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;max-width:440px;width:100%;user-select:none}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--display);font-weight:700;font-size:clamp(13px,3.6vw,19px);padding:0;display:flex;align-items:center;justify-content:center}
.cell.pick{background:var(--accent);color:var(--on-accent)}
.cell.found{background:var(--good-bg);border-color:var(--good)}
.cell.miss{background:var(--bad-bg);border-color:var(--bad)}
.cell.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.wlist li{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}
.wlist li.done{background:var(--good-bg);border-color:var(--good);text-decoration:line-through}
.fb{border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-bg);border:2px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb-title{font-family:var(--display);font-weight:800;font-size:20px}
.qnav{display:flex;justify-content:flex-end}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:clamp(48px,12vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:6px;font-weight:700}
.stats .ok{color:var(--good)} .stats .no{color:var(--bad)}
.mark{display:inline-block;background:var(--accent);color:var(--on-accent);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:800}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--tint)}
th{font-family:var(--display)}
td.num{text-align:right;white-space:nowrap}
.mist{display:flex;flex-direction:column;gap:14px}
.mitem{border-left:6px solid var(--bad);background:var(--card);border-radius:0 14px 14px 0;padding:12px 16px;display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--tint);border-bottom:2px solid var(--tint);border-right:2px solid var(--tint)}
.mitem .lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mitem .yours{color:var(--bad);font-weight:700}
.mitem .rightans{color:var(--good);font-weight:700}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.ctx{white-space:pre-line}
.paw{width:1.1em;height:1.1em;fill:currentColor;flex:none;vertical-align:-0.15em}
.hud{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;color:var(--accent-ink)}
.hud-rank{color:var(--muted);font-weight:700;font-size:14px}
header.top .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud,.modebtn,#home-btn{flex:none;white-space:nowrap}
@media (max-width:560px){
  .hud-rank{display:none}
  header.top{flex-wrap:wrap;gap:8px;padding-block:10px}
  #logo{flex:none}
  header.top #logo svg{width:40px;height:40px}
  header.top .name{font-size:16px;flex:1 1 calc(100% - 60px)}
  header.top .hud{margin-right:auto;padding:4px 10px}
  #home-btn{font-size:14px}
}
.plus{color:var(--good);display:inline-flex;align-items:center;gap:4px;font-size:18px;margin-left:8px}
.pawline{display:flex;align-items:center;gap:10px;font-weight:600}
.pawline .paw{color:var(--accent-ink);width:32px;height:32px}
.pawbig{display:flex;align-items:center;gap:10px;color:var(--accent-ink)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lesson{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;min-width:0}
.lesson:hover{background:var(--tint)}
.lesson .ln{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}
.lesson .lt{flex:1;min-width:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.badge{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px;opacity:.55}
.badge.on{opacity:1;border-style:solid;box-shadow:4px 4px 0 var(--shadow)}
.badge h3{font-size:17px}
.badge p{font-size:14px;color:var(--muted)}
.badge .bstate{font-weight:800;color:var(--muted)}
.badge.on .bstate{color:var(--good)}
.medal{flex:none;width:52px;height:52px;border-radius:50%;background:var(--tint);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.badge.on .medal{background:var(--accent);color:var(--on-accent)}
.medal .paw{width:28px;height:28px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;z-index:10;width:max-content;max-width:calc(100% - 32px)}
.toast-item{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:10px 16px;box-shadow:4px 4px 0 var(--accent);animation:pop .3s ease-out}
.toast-item .paw{color:var(--accent);width:28px;height:28px}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
body.wide .wrap{max-width:none}
#app{width:100%}
.course{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}
.course .stage{max-width:980px;width:100%;justify-self:center}
.navtoggle{display:none}
.side-hide{align-self:flex-start;font-size:14px}
@media (min-width:901px){
  body.side-collapsed .course{grid-template-columns:minmax(0,1fr)}
  body.side-collapsed .side{display:none}
  body.side-collapsed .navtoggle{display:inline-flex;justify-self:start}
}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top, 0px));max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sidehead{display:flex;flex-direction:column;gap:6px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tl-btn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:8px;border-radius:12px}
.tl-btn:hover,.tl.active>.tl-btn{background:var(--tint)}
.tl-dot{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;background:var(--card)}
.tl.done .tl-dot{background:var(--good);border-color:var(--good);color:var(--card)}
.tl.active .tl-dot{background:var(--accent);color:var(--on-accent)}
.tl.lock{opacity:.5}
.tl-txt{display:flex;flex-direction:column;min-width:0;font-size:14px;line-height:1.3}
.tl-txt span{color:var(--muted)}
.tl-steps{list-style:none;margin:2px 0 8px 24px;padding-left:12px;border-left:3px solid var(--tint);display:flex;flex-direction:column;gap:2px}
.tl-step{display:flex;gap:8px;align-items:center;background:none;border:none;text-align:left;padding:5px 8px;border-radius:8px;font-size:14px;width:100%}
.tl-step:hover{background:var(--tint)}
.tl-step.cur{background:var(--accent);color:var(--on-accent);font-weight:800}
.tl-step.done:not(.cur){color:var(--good)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
.tl-dot .ico{width:18px;height:18px}
.sidefoot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-top:2px solid var(--tint);padding-top:10px}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:12px;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:0}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.cur{background:var(--accent)}
.step{display:flex;flex-direction:column;gap:16px}
.steptitle{font-size:clamp(26px,5vw,38px)}
.bigq{font-size:20px;font-weight:700}
.prose{display:flex;flex-direction:column;gap:12px;font-size:18px;min-width:0}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--tint);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile .big{font-family:var(--display);font-size:22px;color:var(--accent-ink)}
.tag{align-self:flex-start;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card)}
.tag.good{background:var(--good-bg);border-color:var(--good)}
.tag.bad{background:var(--bad-bg);border-color:var(--bad)}
.src{color:var(--muted);font-size:14px}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);color:var(--accent-ink)}
.people{width:100%;max-width:440px;height:auto}
.motto{font-family:var(--hand);font-size:28px;line-height:1.15}
.hero{display:flex;gap:18px;align-items:flex-start}
.hero>svg{width:120px;height:120px;flex:none}
@media (max-width:560px){ .hero{flex-direction:column} }
.chain{display:flex;flex-direction:column;gap:8px}
.concl{background:var(--accent);color:var(--on-accent);font-weight:800}
.cz{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-weight:700}
.cz .top{grid-column:1 / -1;background:var(--accent);color:var(--on-accent)}
.cz .no{grid-column:1 / -1;background:var(--bad-bg);border:2px dashed var(--bad);color:var(--bad)}
.comic{display:flex;flex-direction:column;gap:12px}
.bubble{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.bubble.r{align-self:flex-end;flex-direction:row-reverse}
.bubble .ava svg{width:64px;height:64px;display:block}
.bubble>div{background:var(--tint);border:2px solid var(--line);border-radius:18px;padding:10px 14px;min-width:0}
.bubble.r>div{background:var(--card);box-shadow:4px 4px 0 var(--accent)}
.bubble:not([hidden]){animation:pop .3s ease-out}
.who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bubble.r .who{color:var(--accent-ink)}
.msg{background:var(--tint);border-radius:18px;padding:16px;font-size:18px;display:flex;flex-direction:column;gap:6px}
.reveal{background:var(--card);border:2px solid var(--good);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.stepnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:17px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.chk.small{font-size:14px;color:var(--muted)}
.chk.small input{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px}
.cert{border:6px double var(--accent-ink);border-radius:20px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--card)}
.cert>svg{width:120px;height:120px}
.certname{font-family:var(--hand);font-size:44px;line-height:1.1}
.course-card{box-shadow:6px 6px 0 var(--accent)}
.codebox{font:14px/1.4 ui-monospace, Consolas, monospace;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical}
.prof.on{background:var(--tint)}
.form{display:flex;flex-direction:column;gap:14px;max-width:560px}
.modebtn{background:var(--ink);color:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap}
.btn.small{padding:5px 12px;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
details.more{border-top:2px solid var(--tint);padding-top:10px;display:flex;flex-direction:column;gap:10px}
details.more summary{cursor:pointer;font-weight:800;color:var(--accent-ink)}
details.more[open]{display:flex}
.chipf{border:2px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--card);font-weight:800}
.chipf.on{background:var(--accent);color:var(--on-accent)}
.ohint{display:block;margin-top:3px;font-size:14px;font-weight:600;line-height:1.3;opacity:.75}
.sheet dl{margin:10px 0 0;display:grid;gap:10px}
.sheet dt{font-weight:800}
.sheet dd{margin:0;color:var(--muted)}
.bell{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--card);border:2px solid var(--line);border-radius:999px;color:var(--accent-ink)}
.bell[hidden]{display:none}
.bell .bellico{width:20px;height:20px;stroke-width:2.4}
.bellb{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.inbox{display:flex;flex-direction:column;gap:12px}
.imsg{display:flex;flex-direction:column;gap:8px}
.imsg.new{border-color:var(--accent)}
.chan{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:800;white-space:nowrap}
.chan.off{opacity:.6}
.newb{background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.tchat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px}
.tmsg{max-width:78%;padding:8px 12px;border-radius:14px;border:2px solid var(--line);white-space:pre-line}
.tmsg small{display:block;color:var(--muted);font-size:12px}
.tmsg.in{background:var(--tint);align-self:flex-start}
.tmsg.out{background:var(--card);align-self:flex-end;box-shadow:3px 3px 0 var(--accent)}
select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
@media (max-width:560px){ .modebtn{font-size:12px;padding:5px 10px} }
.err{color:var(--bad);font-weight:700;min-height:1.2em}
.pc-good{color:var(--good);font-weight:800}
.pc-bad{color:var(--bad);font-weight:800}
.pc-none{color:var(--muted)}
.jt th,.jt td,.jt td.num{white-space:nowrap;text-align:center;padding:8px 12px}
.jt th.l,.jt td.l{text-align:left}
.jt tr:nth-child(even) td{background:var(--paper)}
.course-card .bar{border-color:var(--paper);background:transparent}
@media (max-width:900px){
  .course{grid-template-columns:minmax(0,1fr)}
  .navtoggle{display:inline-flex;justify-self:start}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(330px,86vw);max-height:none;border-radius:0 20px 20px 0;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

{ id:'wit', title:'Задачи на смекалку', kind:'choice',

  {ctx:'Видео: «Положили гвоздь в стакан колы — за ночь он полностью растворился!»', a:1, ex:'Фейк. Кислоты в коле слишком мало, чтобы растворить гвоздь за ночь.'},

{ id:'fallacies', title:'Ловушки в рассуждениях', kind:'choice', fixed:true,

  exA:['Популярность — не доказательство: многие тоже могут ошибаться.','Спорят с человеком, а не с его доводом.','Вариантов почти всегда больше двух.','Одно случилось после другого — это ещё не причина.','Каждый шаг этой страшной цепочки ничем не доказан.','Чужие слова исказили и спорят с искажённой версией.','Знаменитость — не знаток во всём: важно, разбирается ли человек именно в этом.','Одного-двух случаев мало, чтобы делать общее правило.','Мы слышим о тех, кому повезло, и не слышим о тех, у кого не вышло.','Вещи похожи лишь чуть-чуть, а вывод делают так, будто они одинаковые.','В вопрос спрятано обвинение: и «да», и «нет» его подтверждают.','Вместо доводов давят на жалость.'],

{ id:'rulewrong', title:'Верное правило — неверный вывод', kind:'choice', q:'Что не так с выводом?',
  short:'Правило верное, а вывод из него — нет. Находим, где рассуждение «съехало».',
  intro:'Бывает, что правило верное, а вывод из него — неправильный. Три частые ошибки: взяли из правила одну часть и забыли остальные; довели правило до крайности («полезно — значит, чем больше, тем лучше»); перенесли правило туда, где оно не работает.',
  tip:'Спроси себя: «Что ещё говорит это правило? Не слишком ли далеко я зашёл? Работает ли оно здесь?»',
  items:[
  {ctx:'Правило: «Чтобы вес был в норме, важно соблюдать режим питания и тратить энергии не меньше, чем получаешь с едой».\nВывод: «Буду пить только колу без сахара — и похудею».', opts:['Из правила взяли одну часть и забыли про режим и полезную еду','Всё верно: в такой коле нет калорий','Ошибка только в том, что кола должна быть с сахаром'], a:0, ex:'Растущему организму нужны белки, витамины и нормальная еда по режиму — кола их не даёт. Решения о питании принимают вместе с родителями и врачом.'},
  {ctx:'Правило: «Сон важен для здоровья».\nВывод: «Буду спать по 14 часов в сутки — стану самым здоровым».', opts:['Правило довели до крайности: полезно в меру — не значит «чем больше, тем лучше»','Всё верно: сон полезен','Ошибка: сон вообще не нужен'], a:0, ex:'Школьнику нужно примерно 9–11 часов сна. Больше — не лучше.'},
  {ctx:'Правило: «Пить воду полезно».\nВывод: «Выпью сразу пять литров — буду здоровее».', opts:['Правило довели до крайности: столько воды сразу вредно','Всё верно: вода полезна','Ошибка: воду пить вредно'], a:0, ex:'Воду пьют понемногу в течение дня. Слишком много сразу — это нагрузка на организм.'},
  {ctx:'Правило: «Читать полезно».\nВывод: «Буду читать по ночам вместо сна».', opts:['Забыли про другую важную часть здоровья — сон','Всё верно: чтение важнее сна','Ошибка: читать вредно'], a:0, ex:'Полезное занятие не должно вытеснять другое полезное.'},
  {ctx:'Правило: «Витамин C помогает организму».\nВывод: «Съем всю пачку витаминок за раз — и никогда не заболею».', opts:['Довели до крайности и пообещали чудо: витамины не спасают от всех болезней','Всё верно: витамины — это полезно','Ошибка: витамин C вредный'], a:0, ex:'Лишние витамины могут навредить, а «никогда не заболею» не обещает ни один врач.'},
  {ctx:'Правило: «Повторение помогает запомнить».\nВывод: «Повторю правило 100 раз вслух — и пойму тему».', opts:['Запомнить и понять — разные вещи: чтобы понять, нужно разбираться и решать','Всё верно: повторение — мать учения','Ошибка: повторять бесполезно'], a:0, ex:'Правило говорит про запоминание, а вывод — про понимание.'},
  {ctx:'Правило: «Солнцезащитный крем защищает от ожогов».\nВывод: «Намажусь утром один раз — и можно весь день лежать на солнце».', opts:['Забыли про условия: крем обновляют, а в самое жаркое время уходят в тень','Всё верно: крем же нанесён','Ошибка: крем не защищает совсем'], a:0, ex:'Правило верное, но не значит «один раз — и навсегда».'},
  {ctx:'Правило: «Шлем защищает голову».\nВывод: «В шлеме можно гонять на самокате как угодно — я в безопасности».', opts:['Шлем снижает риск, но не делает опасную езду безопасной','Всё верно: шлем защищает от всего','Ошибка: шлем не нужен'], a:0, ex:'Защита — не повод рисковать больше.'},
  {ctx:'Правило: «Пароль защищает аккаунт».\nВывод: «У меня пароль 12345 — значит, аккаунт в безопасности».', opts:['Забыли главное условие: пароль должен быть сложным','Всё верно: пароль есть','Ошибка: пароли не нужны'], a:0, ex:'Пароль 12345 взламывают за секунды.'},
  {ctx:'Правило: «Тренировки делают сильнее».\nВывод: «Буду тренироваться по 4 часа каждый день без отдыха — стану сильнее всех».', opts:['Довели до крайности: мышцам нужен отдых, иначе будут травмы','Всё верно: чем больше, тем лучше','Ошибка: тренировки вредны'], a:0, ex:'Сила растёт, когда тренировки чередуются с отдыхом.'},
  {ctx:'Правило: «Учёные проверяют свои выводы».\nВывод: «Значит, всё, что сказал любой учёный, — правда».', opts:['Из привычки проверять не следует, что каждая фраза учёного верна','Всё верно: учёные не ошибаются','Ошибка: учёные ничего не проверяют'], a:0, ex:'Учёные тоже ошибаются — поэтому их выводы и проверяют другие учёные.'},

  {q:'Где надёжнее всего узнать даты весенних каникул?', opts:['На официальном сайте школы или у классного руководителя','У старшеклассников в коридоре','В анонимном канале «Подслушано»'], a:0, ex:'Официальный источник знает точно.'},

/* ---------- filword grid ---------- */
function strHash(s){ let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) || 1; }
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function buildGrid(words, seed){
  const N = 10, L = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ';
  for (let attempt = 0; attempt < 400; attempt++) {
    const r = rng(seed + attempt * 7919);
    const g = Array.from({length:N}, () => Array(N).fill(''));
    let ok = true;
    for (const w of [...words].sort((a, b) => b.length - a.length)) {
      let done = false;
      for (let t = 0; t < 300 && !done; t++) {
        const down = r() < 0.5, dr = down ? 1 : 0, dc = down ? 0 : 1;
        const r0 = Math.floor(r() * (down ? N - w.length + 1 : N));
        const c0 = Math.floor(r() * (down ? N : N - w.length + 1));
        let fits = true;
        for (let k = 0; k < w.length; k++) { const ch = g[r0 + dr * k][c0 + dc * k]; if (ch && ch !== w[k]) { fits = false; break; } }
        if (fits) { for (let k = 0; k < w.length; k++) g[r0 + dr * k][c0 + dc * k] = w[k]; done = true; }
      }
      if (!done) { ok = false; break; }
    }
    if (ok) {
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!g[i][j]) g[i][j] = L[Math.floor(r() * L.length)];
      return {N, letters: g.flat()};
    }
  }
  return null;
}
function locate(grid, w){
  const {N, letters} = grid;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    for (const [dr, dc] of [[0,1],[1,0]]) {
      if (i + dr * (w.length - 1) >= N || j + dc * (w.length - 1) >= N) continue;
      const cells = range(w.length).map(k => (i + dr * k) * N + (j + dc * k));
      if (cells.every((c, k) => letters[c] === w[k])) return cells;
    }
  }
  return [];
}

/* ---------- sessions ---------- */
let S = null;

function prep({cat, item}){
  const e = {cat, item, graded:false};
  if (cat.kind === 'choice') { const n = (item.opts || cat.opts).length; e.perm = (cat.fixed || item.fixed) ? range(n) : shuffle(range(n)); e.sel = null; }
  if (cat.kind === 'order') { let p = shuffle(range(item.steps.length)); while (p.every((v, i) => v === i)) p = shuffle(p); e.perm = p; e.sel = []; }
  if (cat.kind === 'sort') { e.perm = shuffle(range(item.items.length)); e.sel = {}; }
  if (cat.kind === 'words') { e.grid = buildGrid(item.words, strHash(item.theme)); e.found = new Set(); e.foundCells = new Set(); e.start = null; e.revealed = false; }
  return e;
}
function build(mode, key){
  if (key === 'final') {
    const cats = CATS.filter(c => c.kind !== 'words');
    const list = cats.map(c => ({cat:c, item: shuffle(testPool(c.id))[0]}));
    const used = new Set(list.map(x => x.item));
    const rest = shuffle(cats.flatMap(c => testPool(c.id).filter(i => !used.has(i)).map(item => ({cat:c, item})))).slice(0, Math.max(0, 20 - list.length));
    return shuffle(list.concat(rest));
  }
  if (LES[key]) return shuffle(LES[key].spec.flatMap(([id, n, tag]) => pick(id, n, tag, true)));
  const c = CAT[key];
  const items = mode === 'practice' ? shuffle(c.items) : shuffle(testPool(c.id)).slice(0, c.kind === 'words' ? 3 : 10);
  return items.map(item => ({cat:c, item}));
}
function start(mode, key, list, opts){
  opts = opts || {};
  const title = opts.title || (key === 'final' ? 'Итоговый тест' : LES[key] ? `Урок ${LES[key].n}: ${LES[key].title}` : CAT[key].title);
  S = {mode, key, title, ret: opts.ret || null, q: (list || build(mode, key)).map(prep), i:0, res:[]};
  renderQ(); window.scrollTo(0, 0);
}

function ready(e){
  const k = e.cat.kind;
  if (k === 'choice') return e.sel !== null;
  if (k === 'order') return e.sel.length === e.item.steps.length;
  if (k === 'sort') return Object.keys(e.sel).length === e.item.items.length;
  return true;
}

function bind(e, next){
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (e.graded) return;
      e.sel = +b.dataset.k;
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
      if (S.mode === 'practice') { finalize(e); }
      next.disabled = false;
    });
  }
  if (cat.kind === 'order') {
    const draw = () => {
      $('#chosen').innerHTML = e.sel.map(k => `<li>${esc(item.steps[k])}</li>`).join('');
      app.querySelectorAll('.chip').forEach(b => b.disabled = e.graded || e.sel.includes(+b.dataset.k));
      next.disabled = !(ready(e) || e.graded);
    };
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (e.graded) return; e.sel.push(+b.dataset.k); draw(); });
    $('#reset').onclick = () => { if (e.graded) return; e.sel = []; draw(); };
    e.redraw = draw;
  }
  if (cat.kind === 'sort') {
    app.querySelectorAll('.srow').forEach(row => {
      row.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (e.graded) return;
        e.sel[row.dataset.k] = +b.dataset.v;
        row.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        next.disabled = !ready(e);
      });
    });
  }
  if (cat.kind === 'words') {
    const g = e.grid, N = g.N, cells = app.querySelectorAll('.cell');
    const paint = () => {
      cells.forEach((c, i) => { c.classList.toggle('pick', e.start === i); c.classList.toggle('found', e.foundCells.has(i)); });
      app.querySelectorAll('.wlist li').forEach(li => li.classList.toggle('done', e.found.has(li.dataset.w)));
    };
    const line = (a, b) => {
      const ra = Math.floor(a / N), ca = a % N, rb = Math.floor(b / N), cb = b % N, out = [];
      if (ra === rb) { const s = Math.sign(cb - ca); for (let c = ca; c !== cb + s; c += s) out.push(ra * N + c); return out; }
      if (ca === cb) { const s = Math.sign(rb - ra); for (let r = ra; r !== rb + s; r += s) out.push(r * N + ca); return out; }
      return null;
    };
    cells.forEach(c => c.onclick = () => {
      if (e.graded) return;
      const i = +c.dataset.i;
      if (e.start === null) { e.start = i; paint(); return; }
      if (e.start === i) { e.start = null; paint(); return; }
      const ln = line(e.start, i);
      e.start = null;
      if (ln) {
        const word = ln.map(x => g.letters[x]).join(''), rev = [...word].reverse().join('');
        const hit = item.words.find(w => !e.found.has(w) && (w === word || w === rev));
        if (hit) {
          e.found.add(hit); ln.forEach(x => e.foundCells.add(x)); paint();
          if (e.found.size === item.words.length && S.mode === 'practice') { finalize(e); next.disabled = false; }
          return;
        }
      }
      paint();
      cells[i].classList.add('shake'); setTimeout(() => cells[i].classList.remove('shake'), 300);
    });
    const give = $('#giveup');
    if (give) give.onclick = () => { if (e.graded) return; e.revealed = true; finalize(e); next.disabled = false; };
    e.repaint = paint;
  }
}

function grade(e){
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    const opts = item.opts || cat.opts;
    return {ok: e.sel === item.a, given: e.sel === null ? 'Нет ответа' : opts[e.sel], right: opts[item.a]};
  }
  if (cat.kind === 'order') {
    const ok = e.sel.length === item.steps.length && e.sel.every((k, i) => k === i);
    return {ok, given: e.sel.length ? e.sel.map(k => item.steps[k]).join(' → ') : 'Нет ответа', right: item.steps.join(' → ')};
  }
  if (cat.kind === 'sort') {
    const lab = v => v ? 'минус' : 'плюс';
    const wrong = range(item.items.length).filter(k => e.sel[k] !== item.items[k][1]);
    return {ok: wrong.length === 0,
      given: wrong.length ? wrong.map(k => `«${item.items[k][0]}» — ${e.sel[k] == null ? 'нет ответа' : lab(e.sel[k])}`).join('; ') : 'Всё верно',
      right: wrong.map(k => `«${item.items[k][0]}» — ${lab(item.items[k][1])}`).join('; ')};
  }
  const missing = item.words.filter(w => !e.found.has(w));
  return {ok: missing.length === 0 && !e.revealed,
    given: `Найдено ${e.found.size} из ${item.words.length}`,
    right: missing.length ? 'Не найдены: ' + missing.join(', ') : 'Все слова найдены'};
}

function finalize(e){
  if (e.graded) return;
  e.graded = true;
  const g = grade(e);
  S.res[S.i] = {e, ...g};
  award(e, g);
  if (S.mode !== 'practice') return;
  const {cat, item} = e;
  if (cat.kind === 'choice') {
    app.querySelectorAll('.opt').forEach(b => {
      const k = +b.dataset.k; b.disabled = true;
      if (k === item.a) b.classList.add('right'); else if (k === e.sel) b.classList.add('wrong');
    });
  }
  if (cat.kind === 'order') {
    e.redraw();
    app.querySelectorAll('#chosen li').forEach((li, i) => li.classList.add(e.sel[i] === i ? 'right' : 'wrong'));
  }
  if (cat.kind === 'sort') {
    app.querySelectorAll('.srow').forEach(row => { const k = +row.dataset.k; row.classList.add(e.sel[k] === item.items[k][1] ? 'right' : 'wrong'); row.querySelectorAll('button').forEach(b => b.disabled = true); });
  }
  if (cat.kind === 'words') {
    const cells = app.querySelectorAll('.cell');
    item.words.filter(w => !e.found.has(w)).forEach(w => locate(e.grid, w).forEach(i => cells[i].classList.add('miss')));
  }
  const fb = $('#fb');
  const ex = exOf(e);
  fb.className = 'fb ' + (g.ok ? 'good' : 'bad');
  fb.innerHTML = `<p class="fb-title">${g.ok ? `Верно! <span class="plus">+1 ${PAW}</span>` : 'Не совсем'}</p>${g.ok ? '' : `<p><b>${cat.kind === 'words' ? '' : 'Правильно: '}</b>${esc(g.right)}</p>`}${ex ? `<p>${esc(ex)}</p>` : ''}`;
  fb.hidden = false;
}

function go(){
  S.i++;
  if (S.i >= S.q.length) renderResults(); else { renderQ(); window.scrollTo(0, 0); }
}

function renderResults(){

    breakdown = `<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2>По разделам</h2><div class="tablewrap"><table><tr><th>Раздел</th><th style="text-align:right">Верно</th></tr>${Object.values(by).map(b => `<tr><td>${esc(b.t)}</td><td class="num">${b.c} из ${b.n}</td></tr>`).join('')}</table></div></section>`;

  app.innerHTML = `
  <section style="display:flex;flex-direction:column;gap:8px;padding-top:12px">

        <p class="yours">Твой ответ: ${esc(x.given)}</p>
        <p class="rightans">${x.e.cat.kind === 'words' ? '' : 'Правильный ответ: '}${esc(x.right)}</p>
        ${exOf(x.e) ? `<p>${esc(exOf(x.e))}</p>` : ''}
      </div>`).join('')}</div>
  </section>

    <button class="btn ghost" id="r-home" type="button">Все тренажёры</button>
  </div>`;
  const cfg = {mode: S.mode, key: S.key, ret: S.ret, title: S.title, mist: mist.map(x => ({cat: x.e.cat, item: x.e.item}))};
  $('#again').onclick = () => cfg.ret ? launchStep(cfg.ret.u, cfg.ret.i) : start(cfg.mode, cfg.key);

  if (cfg.ret) $('#r-back').onclick = () => { const nx = nextPos(cfg.ret.u, cfg.ret.i); if (!nx) return renderHome(); const nk = COURSE.findIndex(x => x.id === nx[0]); unlocked(nk) ? openStep(nx[0], nx[1]) : openStep(cfg.ret.u, cfg.ret.i); window.scrollTo(0, 0); };
  $('#r-home').onclick = renderHome;

  window.scrollTo(0, 0);
}

  {t:'practice', title:'Тренировка: доводы и выводы', spec:[['logic', 4, 'arg|val|ind|if']]},
  {t:'test', title:'Закрепление: тест урока 2'}
]},
{id:'u3', n:3, title:'Дело №1: факт или мнение?', min:20, test:'lesson3', steps:[
  {t:'warm', title:'Разминка', q:'Что всегда увеличивается и никогда не уменьшается?', a:'Возраст.'},
  {t:'comic', title:'Самая вкусная ягода', lines:[['m','Это факт: малина — самая вкусная ягода!'],['r','Это не факт, а мнение. Вкус нельзя проверить.'],['m','А «малина растёт на кустах» — тоже мнение?'],['r','Нет, это факт: можно пойти в лес и посмотреть!']]},
  {t:'card', title:'Факт или мнение: как отличить', html:`<div class="tiles"><div class="tile"><span class="tag good">Факт</span><span>Можно <b>проверить</b>: измерить, посчитать, увидеть, найти в надёжном источнике.</span><i>«Вода кипит при 100 °C на уровне моря»</i></div><div class="tile"><span class="tag">Мнение</span><span>Чьё-то <b>отношение</b>, вкус или оценка. Его можно обсуждать, но нельзя доказать.</span><i>«Математика — самый скучный предмет»</i><span>Слова-подсказки: лучший, скучный, по-моему, я считаю.</span></div></div><p><b>Главный вопрос:</b> можно ли это проверить?</p><div class="tile"><span class="tag bad">Осторожно</span><span>«Факт» бывает ложным: «Пингвины живут на Северном полюсе» — это можно проверить… и это неправда.</span></div>`},
  {t:'practice', title:'Тренировка: факт или мнение', spec:[['factopinion', 5]]},
  {t:'test', title:'Закрепление: тест урока 3'}
]},
{id:'u4', n:4, title:'Дело №2: суперсила вопросов', min:20, test:'lesson4', steps:[
  {t:'warm', title:'Разминка', q:'Ты капитан корабля. На борту 20 матросов и 3 пушки. Сколько лет капитану?', a:'Столько же, сколько тебе — ведь капитан ты.'},
  {t:'comic', title:'Зиму отменяют?!', lines:[['m','СРОЧНО! В лесу отменяют зиму! Перешли всем!'],['r','Стоп. Кто это сказал? И откуда он знает?'],['m','Ну… дятел слышал от ежа, а ёж — от белки…'],['r','Значит, это слух. Давай сначала проверим!']]},
  {t:'card', title:'5 вопросов Енота Чека', hero:'r', html:`<ol><li><b>Кто это говорит?</b> Знаем ли мы автора? Разбирается ли он в теме?</li><li><b>Откуда он это знает?</b> Видел сам, изучал — или «где-то слышал»?</li><li><b>Какие доказательства?</b> Факты, фото, исследования — или только слова?</li><li><b>Кому это выгодно?</b> Может, кто-то хочет продать, напугать или прославиться?</li><li><b>Что говорят другие?</b> Подтверждают ли это надёжные источники?</li></ol>`},
  {t:'case', title:'Найди красные флажки', ctx:'<b>Чат класса · 21:47</b><br>СРОЧНО!!! Мне сказала подруга сестры, что завтра школу закрывают на карантин. Учителя пока скрывают!!! Перешли всем, пока не удалили!!!', q:'Найди минимум 4 подозрительные детали. Что сделать вместо того, чтобы переслать?', reveal:`<ol><li><b>«СРОЧНО!!!»</b> — капс и восклицательные знаки давят на эмоции и торопят.</li><li><b>«Подруга сестры»</b> — источник неизвестен, новость «через третьи руки».</li><li><b>«Учителя скрывают»</b> — заранее объясняет, почему нет доказательств.</li><li><b>«Перешли всем»</b> — просят распространить, пока никто не проверил.</li><li><b>Ни ссылки, ни подписи</b> — нет официального источника.</li></ol><p><b>Что делать:</b> не пересылать. Проверить на сайте школы или спросить классного руководителя.</p>`},
  {t:'practice', title:'Тренировка: кому верить', spec:[['sources', 4]]},
  {t:'test', title:'Закрепление: тест урока 4'}
]},
{id:'u5', n:5, title:'Осторожно, мошенники!', min:22, test:'lesson5', steps:[
  {t:'warm', title:'Разминка', q:'Что принадлежит тебе, но другие пользуются этим чаще, чем ты?', a:'Твоё имя. А пароли, коды и данные карты — только твои, ими никто другой пользоваться не должен.'},
  {t:'comic', title:'Золотое гнездо', lines:[['m','Ура! Я выиграла золотое гнездо! Нужен только код из СМС!'],['r','Стоп! Код из СМС — никому. Это мошенники.'],['m','Но тут написано «срочно» и «никому не говори»!'],['r','Срочно + выгодно + секретно = обман. Не отвечай!']]},
  {t:'card', title:'На какую «кнопку» жмут мошенники', html:`<ul><li><b>«Ответы на ОГЭ и ЕГЭ — скачай файл».</b> Жмут на страх и желание лёгкого пути. Настоящие ответы заранее не продают.</li><li><b>«Учитель» просит код из СМС.</b> Жмут на доверие к взрослым. Код — никому, перезвони учителю сам.</li><li><b>«Лёгкая подработка», первая выплата сразу.</b> Слишком хорошо, чтобы быть правдой. Первая выплата — приманка.</li><li><b>Бесплатные скины и игровая валюта.</b> Жмут на азарт. Не вводи пароль на чужих сайтах.</li><li><b>Звонок «из полиции»: «Спаси родителей!»</b> Страх и секретность. Положи трубку и сам позвони родителям.</li></ul><div class="tile"><b>Формула обмана:</b><span>срочно + страшно (или очень выгодно) + «никому не говори». Видишь её — стоп!</span></div>`},
  {t:'case', title:'«Работа мечты»', ctx:'<b>Незнакомый номер</b><br>Привет! Ищем ребят 14+ на подработку. Ставишь лайки — получаешь 3000 ₽ в день! Первая выплата сразу. Нужно только принять перевод на свою карту и переслать дальше. Мест мало! Родителям лучше не говорить — пусть будет сюрприз.', q:'Найди все красные флажки. Зачем им твоя карта? Чем это опасно для тебя?', reveal:`<ul><li><b>«3000 ₽ за лайки»</b> — слишком много денег за слишком простое дело.</li><li><b>«Мест мало!»</b> — торопят, чтобы не успел подумать.</li><li><b>«Родителям не говори»</b> — честному работодателю секреты от семьи не нужны.</li></ul><p><b>«Принять перевод и переслать» = стать дроппером.</b> Дроппер — человек, через чью карту преступники переводят украденные деньги. Отвечать придётся владельцу карты — вплоть до уголовной ответственности.</p>`},
  {t:'practice', title:'Тренировка: распознай обман', spec:[['fake', 4, 'scam']]},
  {t:'test', title:'Закрепление: тест урока 5'}
]},
{id:'u6', n:6, title:'Дело №3: ловушки в спорах', min:25, test:'lesson6', steps:[
  {t:'warm', title:'Разминка', q:'Электричка едет на север, ветер дует на юг. Куда летит дым от электрички?', a:'Никуда: у электрички нет дыма.'},
  {t:'comic', title:'Две ловушки за минуту', lines:[['m','Все сороки носят блестящие бусы — значит, и тебе надо!'],['r','«Все так делают» — это не довод, а ловушка.'],['m','Да что ты понимаешь в моде, ты же енот!'],['r','А это «переход на личности». Уже вторая ловушка!']]},
  {t:'trap', n:1, title:'«Все так делают»', quote:'«Все в классе уже купили эти кроссовки — значит, они крутые!»', ans:'Если многие во что-то верят, это ещё не делает это правдой.', reply:'«А чем они крутые, кроме того, что их все купили?»'},
  {t:'trap', n:2, title:'«Переход на личности»', quote:'«Что ты понимаешь в экологии? У тебя тройка по химии!»', ans:'Спорят с человеком, а не с его доводами.', reply:'«Давай обсуждать мои доводы, а не мои оценки».'},
  {t:'trap', n:3, title:'«Или — или»', quote:'«Либо ты играешь с нами, либо ты нам не друг!»', ans:'Вариантов почти всегда больше двух.', reply:'«Я вам друг, просто сегодня хочу заняться другим».'},
  {t:'trap', n:4, title:'«После — значит из-за»', quote:'«Я надел счастливые носки — и получил пятёрку. Носки работают!»', ans:'Если одно случилось после другого, это ещё не причина.', reply:'«А может, пятёрка — потому что ты готовился?»'},
  {t:'trap', n:5, title:'«Снежный ком»', quote:'«Разрешишь телефон на перемене — все бросят учиться и провалят экзамены!»', ans:'Каждый шаг такой страшной цепочки нужно доказать.', reply:'«Почему одно обязательно приведёт к другому?»'},
  {t:'trap', n:6, title:'«Соломенное чучело»', quote:'— Давайте сделаем перемены длиннее.\n— То есть ты хочешь вообще не учиться?!', ans:'Чужие слова искажают и спорят с искажённой версией.', reply:'«Я этого не говорил. Я предложил сделать перемены длиннее».'},
  {t:'practice', title:'Тренировка: узнай ловушку', spec:[['fallacies', 5, 'old']]},
  {t:'test', title:'Закрепление: тест урока 6'}
]},
{id:'u7', n:7, title:'Ловушки-2: хитрые доводы и неверные выводы', min:22, test:'lesson7', steps:[
  {t:'warm', title:'Разминка', q:'Что идёт, не двигаясь с места?', a:'Время. А ещё часы и дождь.'},
  {t:'comic', title:'Ещё шесть ловушек', lines:[['m','Знаменитая певица Канарейка сказала, что бусы делают умнее!'],['r','Она прекрасно поёт, но в уме и бусах не разбирается. Это ловушка «Звезда сказала».'],['m','Ну ладно. А ты уже перестал всем портить настроение?'],['r','Ха! Это «вопрос с подвохом». Я никогда и не портил!']]},
  {t:'trap', n:7, title:'«Звезда сказала»', quote:'«Известный певец сказал, что эти витамины лучше всех. Значит, так и есть!»', ans:'Человек знаменит в одном деле, но это не делает его знатоком во всём.', reply:'«А что об этом говорят врачи и исследования?»'},
  {t:'trap', n:8, title:'«Один раз — значит всегда»', quote:'«В том кафе мне один раз попался холодный суп. Там всегда невкусно!»', ans:'Одного-двух случаев слишком мало для общего правила.', reply:'«А сколько раз ты там был? Может, просто не повезло?»'},
  {t:'trap', n:9, title:'«А у него получилось!»', quote:'«Мой знакомый не учил английский и всё равно стал популярным блогером. Значит, учить не нужно!»', ans:'Мы слышим о тех, у кого получилось, и не слышим о тысячах тех, у кого не вышло.', reply:'«А сколько людей тоже не учили — и у них ничего не получилось?»'},
  {t:'trap', n:10, title:'«Это то же самое»', quote:'«Учить стихи наизусть — это как переписывать телефонную книгу: бессмысленно!»', ans:'Сравнивают вещи, которые похожи лишь чуть-чуть, а вывод делают так, будто они одинаковые.', reply:'«Чем они похожи, а чем отличаются?»'},
  {t:'trap', n:11, title:'«Вопрос с подвохом»', quote:'«Ты уже перестал списывать у соседа?»', ans:'В вопрос спрятано обвинение: и «да», и «нет» его подтверждают.', reply:'«Я не списывал, поэтому мне нечего "переставать"».'},
  {t:'trap', n:12, title:'«Пожалей меня»', quote:'«Ну дай списать, у меня и так всё плохо! Ты же не хочешь, чтобы мне влетело?»', ans:'Вместо доводов давят на жалость, чтобы ты согласился.', reply:'«Мне тебя жаль. Давай я лучше объясню, как решать».'},
  {t:'practice', title:'Тренировка: новые ловушки', spec:[['fallacies', 5, 'new']]},
  {t:'card', eyebrow:'Новое упражнение', title:'Верное правило — неверный вывод', html:`<p>Правило может быть верным, а вывод из него — нет.</p><div class="msg"><p><b>Правило:</b> чтобы вес был в норме, важно соблюдать режим питания и тратить энергии не меньше, чем получаешь с едой. <span class="tag good">Верно</span></p><p><b>Вывод:</b> буду пить только колу без сахара — и похудею. <span class="tag bad">Неверно</span></p></div><p>Из правила взяли одну часть и забыли про режим и полезную еду. Растущему организму нужна нормальная еда, а решения о питании принимают вместе с родителями и врачом.</p><div class="tiles"><div class="tile"><b>Взяли одну часть</b><span>…и забыли остальные условия правила.</span></div><div class="tile"><b>Довели до крайности</b><span>«Полезно — значит, чем больше, тем лучше». Нет: в меру!</span></div><div class="tile"><b>Перенесли не туда</b><span>Правило работает в одной ситуации, а его применяют к другой.</span></div></div><p class="motto">Чек спрашивает: «Что ещё говорит правило? Не слишком ли далеко я зашёл?»</p>`},
  {t:'practice', title:'Тренировка: верное правило — неверный вывод', spec:[['rulewrong', 4]]},
  {t:'test', title:'Закрепление: тест урока 7'}
]},
{id:'u8', n:8, title:'Дело №4: как мозг нас обманывает', min:22, test:'lesson8', steps:[
  {t:'warm', title:'Разминка', q:'В комнате горели 5 свечей. 2 задули. Сколько свечей останется к утру?', a:'2: задутые свечи не сгорели, а остальные три сгорели полностью.'},
  {t:'comic', title:'Кто будит солнце?', lines:[['m','Я затрещала — и взошло солнце! Это я его разбудила!'],['r','Ты затрещала раньше, но это ещё не причина.'],['m','Но так было уже три утра подряд!'],['r','Солнце встаёт каждое утро — и без тебя. Вместе — не значит «из-за»!']]},
  {t:'card', title:'Три хитрости нашего мозга', html:`<div class="tiles"><div class="tile"><b>«Вижу то, что хочу»</b><span>Замечаем то, что согласно с нашим мнением, и пропускаем остальное.</span><span><b>Тренировка:</b> ищи факты против своего мнения.</span></div><div class="tile"><b>«Слышал сто раз — значит, правда»</b><span>Знакомая фраза кажется верной. «Мы используем только 10% мозга» — миф, хотя его слышали почти все.</span><span><b>Тренировка:</b> «знакомо» — не значит «доказано».</span></div><div class="tile"><b>«Эмоции у руля»</b><span>Когда страшно или очень радостно, проверять труднее. Мошенники этим пользуются.</span><span><b>Тренировка:</b> правило 10 секунд — вдох, пауза, потом решение.</span></div></div>`},
  {t:'card', title:'Вместе — не значит «из-за»', html:`<p>Летом продают больше мороженого — и больше людей обгорает на солнце. Значит, мороженое вызывает ожоги?</p><div class="cz"><div class="tile top">Жаркое солнце</div><div class="tile">↓ Больше продают мороженого</div><div class="tile">↓ Больше людей обгорает</div><div class="tile no">Мороженое → ожоги? Нет!</div></div><p class="motto">Правило Чека: если два явления идут вместе, ищи общую причину!</p>`},
  {t:'practice', title:'Тренировка: причина или совпадение', spec:[['cause', 5]]},
  {t:'test', title:'Закрепление: тест урока 8'}
]},
{id:'u9', n:9, title:'Дело №5: проверка новостей', min:20, test:'lesson9', steps:[
  {t:'warm', title:'Разминка', q:'На какой вопрос никогда нельзя честно ответить «да»?', a:'«Ты спишь?»'},
  {t:'comic', title:'Сенсация от «Сорочьих новостей»', lines:[['m','Читай: «Учёные доказали: сороки умнее всех людей!»'],['r','Давай по алгоритму С-Т-О-П. Кто это написал?'],['m','Сайт «Сорочьи новости». Автора нет…'],['r','Ищем другие источники и само исследование. Пока не верим!']]},
  {t:'card', title:'Алгоритм Чека: С-Т-О-П', html:`<div class="tiles"><div class="tile"><b class="big">С — Стоп!</b><span>Не пересылай сразу. Заметь, какие чувства вызывает новость.</span></div><div class="tile"><b class="big">Т — Тот, кто пишет</b><span>Кто автор или сайт? Можно ли ему доверять?</span></div><div class="tile"><b class="big">О — Обзор других</b><span>Пишут ли об этом надёжные СМИ (газеты, новостные сайты) и специалисты?</span></div><div class="tile"><b class="big">П — Первоисточник</b><span>Найди, откуда всё началось: исследование, документ, оригинальное видео.</span></div></div><div class="tile"><b>Лайфхак фактчекеров — «боковое чтение»</b><span>Не изучай подозрительный сайт изнутри. Открой новую вкладку и поищи, что пишут о нём другие.</span></div>`},

const CH = ['Найди в рекламе одну ловушку рассуждений.', 'Запиши 3 факта и 3 мнения, которые услышал за день.', 'Проверь одну новость по алгоритму С-Т-О-П.', 'Найди в жизни пример «вместе — не значит из-за».', 'Расскажи семье о схемах мошенников и правиле «код из СМС — никому».'];

function sk(u, i){ return u + ':' + i; }
function lessonDone(L){ return L.steps.every((s, i) => P.course.done[sk(L.id, i)]); }
function lessonsDone(){ return COURSE.filter(lessonDone).length; }
function testDone(L){ const i = L.steps.findIndex(s => s.t === 'test'); return i < 0 ? lessonDone(L) : !!P.course.done[sk(L.id, i)]; }
function unlocked(k){ return P.course.all || k === 0 || testDone(COURSE[k - 1]) || lessonDone(COURSE[k - 1]); }
function coursePct(){ const tot = COURSE.reduce((a, L) => a + L.steps.length, 0); const d = COURSE.reduce((a, L) => a + L.steps.filter((s, i) => P.course.done[sk(L.id, i)]).length, 0); return Math.round(d * 100 / tot); }
function markDone(u, i){
  const L = COURSE.find(x => x.id === u); if (!L || P.course.done[sk(u, i)]) return;
  const was = lessonDone(L); P.course.done[sk(u, i)] = Date.now();
  if (!was && lessonDone(L)) { P.paws += 5; toast(`${PAW}<span><b>Урок ${L.n} пройден!</b><br>+5 лапок</span>`); }
  saveP(); checkBadges();
}
function nextPos(u, i){
  const k = COURSE.findIndex(x => x.id === u), L = COURSE[k];
  if (i + 1 < L.steps.length) return [u, i + 1];
  if (k + 1 < COURSE.length) return [COURSE[k + 1].id, 0];
  return null;
}
function prevPos(u, i){
  const k = COURSE.findIndex(x => x.id === u);
  if (i > 0) return [u, i - 1];
  if (k > 0) return [COURSE[k - 1].id, COURSE[k - 1].steps.length - 1];
  return null;
}
function firstOpen(L){ const i = L.steps.findIndex((s, j) => !P.course.done[sk(L.id, j)]); return i < 0 ? 0 : i; }
function openCourse(){
  const c = P.course.cur, k = c ? COURSE.findIndex(u => u.id === c.u) : -1;
  if (k >= 0 && unlocked(k)) return openStep(c.u, c.i);
  let f = COURSE.findIndex(L => !lessonDone(L)); if (f < 0) f = COURSE.length - 1;
  openStep(COURSE[f].id, firstOpen(COURSE[f]));
}
function launchStep(u, i){
  const L = COURSE.find(x => x.id === u), st = L.steps[i], ret = {u, i};
  if (st.t === 'practice') start('practice', 'course', shuffle(st.spec.flatMap(([id, n, tag]) => pick(id, n, tag))), {ret, title:`Урок ${L.n}: ${st.title}`});
  else start('test', st.key || L.test, undefined, {ret, title: st.key === 'final' ? 'Итоговый тест' : `Урок ${L.n}: закрепление`});
}

function sidebar(uid, si){
  const pct = coursePct();
  return `<div class="sidehead"><button class="link side-hide" id="s-hide" type="button">« Скрыть панель</button><p class="eyebrow">Мой прогресс</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div><p class="note">${pct}% курса · ${lessonsDone()} из ${COURSE.length} уроков</p></div>
  <ol class="timeline">${COURSE.map((L, k) => {
    const st = lessonDone(L) ? 'done' : unlocked(k) ? 'open' : 'lock', act = L.id === uid;
    return `<li class="tl ${st} ${act ? 'active' : ''}"><button class="tl-btn" type="button" data-u="${L.id}" data-k="${k}"><span class="tl-dot">${st === 'done' ? CHECK : st === 'lock' ? LOCK : L.n}</span><span class="tl-txt"><b>Урок ${L.n} · ${L.min} мин</b><span>${esc(L.title)}</span></span></button>${act ? `<ol class="tl-steps">${L.steps.map((s, j) => `<li><button class="tl-step ${j === si ? 'cur' : ''} ${P.course.done[sk(L.id, j)] ? 'done' : ''}" type="button" data-u="${L.id}" data-j="${j}">${P.course.done[sk(L.id, j)] ? CHECK : '<span class="ico"></span>'}<span>${esc(s.title)}</span></button></li>`).join('')}</ol>` : ''}</li>`;
  }).join('')}</ol>
  <div class="sidefoot"><button class="link" id="s-home" type="button">Все тренажёры</button><button class="link" id="s-ach" type="button">Мои лапки и ачивки</button><label class="chk small"><input type="checkbox" id="s-all" ${P.course.all ? 'checked' : ''}> Открыть все уроки (для учителя)</label></div>`;
}

  const done = P.course.done[sk(L.id, i)];

  if (st.t === 'card') return `${head(st.eyebrow || 'Теория', st.title)}${st.hero ? `<div class="hero">${RACCOON}<div class="prose">${st.html}</div></div>` : `<div class="prose">${st.html}</div>`}`;
  if (st.t === 'comic') return `${head('Комикс', st.title)}<div class="comic">${st.lines.map((l, j) => `<div class="bubble ${l[0]}" data-j="${j}" ${j > 0 && !done ? 'hidden' : ''}><span class="ava">${l[0] === 'r' ? RACCOON : MAGPIE}</span><div><p class="who">${l[0] === 'r' ? 'Чек' : 'Трещотка'}</p><p class="hand">${esc(l[1])}</p></div></div>`).join('')}</div>${done ? '' : '<div><button class="btn ghost" id="more" type="button">Следующая реплика</button></div>'}<p class="note">Можно читать по ролям: один за Трещотку, другой за Чека.</p>`;
  if (st.t === 'case') return `${head('Расследование', st.title)}<div class="msg">${st.ctx}</div><p class="bigq">${esc(st.q)}</p><div class="reveal" id="rv" hidden><div class="prose">${st.reveal}</div></div><div><button class="btn ghost" id="rvbtn" type="button">Показать разбор</button></div>`;
  if (st.t === 'trap') return `${head(`Ловушка ${st.n} из ${TRAPS.length}`, st.title)}<div class="comic"><div class="bubble m"><span class="ava">${MAGPIE}</span><div><p class="who">Трещотка</p><p class="hand" style="white-space:pre-line">${esc(st.quote)}</p></div></div></div><p class="bigq">Что здесь не так?</p><div class="reveal" id="rv" hidden><p><b>Разгадка:</b> ${esc(st.ans)}</p><p><b>Как ответить:</b> ${esc(st.reply)}</p></div><div><button class="btn ghost" id="rvbtn" type="button">Показать разгадку</button></div>`;
  if (st.t === 'practice') { const n = st.spec.reduce((a, s) => a + s[1], 0); return `${head('Тренировка', st.title)}<p class="lead">${n} ${plural(n, 'задание', 'задания', 'заданий')} с подсказками. После каждого ответа — объяснение, за каждый правильный ответ — лапка.</p>${done ? `<p class="best">${CHECK} Тренировка пройдена — можно повторить.</p>` : ''}<div><button class="btn" id="launch" type="button">${done ? 'Пройти ещё раз' : 'Начать тренировку'}</button></div>`; }
  if (st.t === 'test') { const key = st.key || L.test, b = P.tests[key]; return `${head(key === 'final' ? 'Экзамен' : 'Закрепление', st.title)}<p class="lead">${key === 'final' ? '20 вопросов из всех разделов' : '10 вопросов по материалу урока'}. Подсказок не будет: в конце — оценка, лапки и разбор каждой ошибки.</p>${b != null ? `<p class="best">${CHECK} Лучший результат: ${b}%${b < 75 ? ' — попробуй улучшить!' : ''}</p>` : ''}<div><button class="btn" id="launch" type="button">${b != null ? 'Пройти ещё раз' : 'Пройти тест'}</button></div>`; }
  if (st.t === 'challenge') return `${head('Задание на неделю', st.title)}<p class="lead">Выполни все пять миссий и отметь их здесь.</p><div class="checks">${CH.map((c, j) => `<label class="chk"><input type="checkbox" data-j="${j}" ${(P.course.ch || [])[j] ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div>`;
  if (st.t === 'cert') { const r = rankOf(P.paws), nm = P.course.name || ''; return `${head('Финал', st.title)}<label class="field" for="c-name">Твоё имя для сертификата <input id="c-name" type="text" maxlength="40" value="${esc(nm)}" placeholder="Имя и фамилия"></label><div class="cert">${RACCOON}<p class="eyebrow">Сертификат</p><h2>Юный детектив</h2><p class="certname" id="c-out">${esc(nm || 'Имя ученика')}</p><p>прошёл курс «Не верь на слово!» вместе с Енотом Чеком</p><p><b>Звание:</b> ${esc(r.name)} · <b>Лапок:</b> ${P.paws} · <b>Уроков:</b> ${lessonsDone()} из ${COURSE.length}</p><p class="motto">«Сначала проверю — потом поверю!»</p></div><p class="note">Сделай снимок экрана, чтобы сохранить сертификат.</p>`; }
  return '';
}

function openStep(uid, i){
  S = null;
  const k = COURSE.findIndex(u => u.id === uid);
  if (k < 0) return openCourse();
  if (!unlocked(k)) { toast('<span>Этот урок откроется, когда пройдёшь предыдущий</span>'); return; }
  document.body.classList.add('wide');
  const L = COURSE[k]; i = Math.max(0, Math.min(i, L.steps.length - 1)); const st = L.steps[i];
  P.course.cur = {u: uid, i}; saveP();
  const nx = nextPos(uid, i), pv = prevPos(uid, i);
  app.innerHTML = `<div class="course">
    <button class="btn ghost navtoggle" id="navtoggle" type="button" aria-controls="side" aria-expanded="false">Содержание курса · ${coursePct()}%</button>
    <aside class="side" id="side" aria-label="Содержание курса">${sidebar(uid, i)}</aside>
    <div class="scrim" id="scrim" hidden></div>
    <section class="stage">
      <div class="qtop"><span class="qcount">Урок ${L.n} из ${COURSE.length} · шаг ${i + 1} из ${L.steps.length}</span><span class="qcount">≈ ${L.min} мин</span></div>
      <div class="dots">${L.steps.map((s, j) => `<button class="dot ${j === i ? 'cur' : ''} ${P.course.done[sk(uid, j)] ? 'done' : ''}" type="button" data-j="${j}" aria-label="Шаг ${j + 1}: ${esc(s.title)}"></button>`).join('')}</div>
      <article class="card step">${stepBody(L, st, i)}</article>
      <div class="stepnav"><button class="btn ghost" id="prev" type="button" ${pv ? '' : 'disabled'}>← Назад</button><button class="btn" id="next" type="button">${nx ? (nx[0] !== uid ? 'Следующий урок →' : 'Дальше →') : 'На главную'}</button></div>
    </section></div>`;
  const passive = !['practice', 'test'].includes(st.t);
  const side = $('#side'), scrim = $('#scrim'), tg = $('#navtoggle');
  const setNav = o => { side.classList.toggle('open', o); scrim.hidden = !o; tg.setAttribute('aria-expanded', String(o)); };
  const mobile = () => window.matchMedia('(max-width: 900px)').matches;
  const setCollapsed = c => { document.body.classList.toggle('side-collapsed', c); try { localStorage.setItem('chek-side', c ? '1' : '0'); } catch (_) {} };
  let collapsedPref = false; try { collapsedPref = localStorage.getItem('chek-side') === '1'; } catch (_) {}
  document.body.classList.toggle('side-collapsed', collapsedPref);
  tg.onclick = () => { if (mobile()) setNav(!side.classList.contains('open')); else setCollapsed(false); };
  $('#s-hide').onclick = () => { if (mobile()) setNav(false); else setCollapsed(true); };
  scrim.onclick = () => setNav(false);
  app.querySelectorAll('.tl-btn').forEach(b => b.onclick = () => { const kk = +b.dataset.k; if (!unlocked(kk)) { toast('<span>Этот урок откроется, когда пройдёшь предыдущий</span>'); return; } openStep(b.dataset.u, b.dataset.u === uid ? i : firstOpen(COURSE[kk])); window.scrollTo(0, 0); });
  app.querySelectorAll('.tl-step').forEach(b => b.onclick = () => { openStep(b.dataset.u, +b.dataset.j); window.scrollTo(0, 0); });
  app.querySelectorAll('.dot').forEach(b => b.onclick = () => openStep(uid, +b.dataset.j));
  $('#s-home').onclick = renderHome; $('#s-ach').onclick = renderAch;
  $('#s-all').onchange = e => { P.course.all = e.target.checked; saveP(); openStep(uid, i); };
  const rvb = $('#rvbtn'); if (rvb) rvb.onclick = () => { $('#rv').hidden = false; rvb.remove(); };
  const more = $('#more');
  if (more) more.onclick = () => { const h = app.querySelector('.bubble[hidden]'); if (h) h.hidden = false; if (!app.querySelector('.bubble[hidden]')) more.remove(); };
  const ln = $('#launch'); if (ln) ln.onclick = () => launchStep(uid, i);
  app.querySelectorAll('.checks input').forEach(c => c.onchange = () => { P.course.ch = P.course.ch || []; P.course.ch[+c.dataset.j] = c.checked; saveP(); });
  const nmIn = $('#c-name'); if (nmIn) nmIn.oninput = () => { P.course.name = nmIn.value; saveP(); $('#c-out').textContent = nmIn.value || 'Имя ученика'; };
  $('#prev').onclick = () => { if (pv) { openStep(pv[0], pv[1]); window.scrollTo(0, 0); } };
  $('#next').onclick = () => {
    if (passive) markDone(uid, i);
    if (!nx) { renderHome(); return; }
    const nk = COURSE.findIndex(x => x.id === nx[0]);
    if (!unlocked(nk)) { toast('<span>Пройди тест урока — и следующий урок откроется</span>'); openStep(uid, i); return; }
    openStep(nx[0], nx[1]); window.scrollTo(0, 0);
  };
}

/* ---------- profiles, share code, teacher journal ---------- */
function pcClass(v){ return v == null ? 'pc-none' : v >= 75 ? 'pc-good' : v < 50 ? 'pc-bad' : ''; }
function summary(){ const pr = curProf() || {}; return {v:2, n:curName(), login: pr.login || '', klass: pr.klass || '', mk: pr.mk || '', i: pr.bot || null, p:P.paws, r:rankOf(P.paws).name, l:lessonsDone(), c:coursePct(), t:LESSONS.map(l => (l.final ? P.tests.final : P.tests[l.id]) ?? null), b:BADGES.filter(b => P.badges[b.id]).length, d:new Date().toISOString().slice(0, 10)}; }
function b64(bytes){ let s = ''; for (let k = 0; k < bytes.length; k += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x8000)); return btoa(s); }
function unb64(str){ const bin = atob(str); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
async function pipeBytes(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function encodeFull(){
  const pr = curProf() || {};
  const o = Object.assign(summary(), {pin: pr.pin || '', full: P});
  if (typeof CompressionStream === 'function') { try { return 'CHEK2:' + b64(await pipeBytes(new TextEncoder().encode(JSON.stringify(o)), new CompressionStream('deflate-raw'))); } catch (_) {} }
  const s = summary(); s.v = 1; return 'CHEK1:' + b64(new TextEncoder().encode(JSON.stringify(s)));
}
async function decodeAll(text){
  const out = []; const re = /CHEK([12]):([A-Za-z0-9+/=]+)/g; let m;
  while ((m = re.exec(text || ''))) {
    try {
      let bytes = unb64(m[2]);
      if (m[1] === '2') bytes = await pipeBytes(bytes, new DecompressionStream('deflate-raw'));
      const o = JSON.parse(new TextDecoder().decode(bytes));
      if (o && (o.v === 1 || o.v === 2) && typeof o.n === 'string') { o.t = normT(o.t); out.push(o); }
    } catch (_) {}
  }
  return out;
}
async function shareText(){ const s = summary(); return `Енот Чек · ${s.n || 'Ученик'} · лапок: ${s.p} · уроков: ${s.l} из ${COURSE.length} · ${s.r}\n${await encodeFull()}`; }

let PENDING = null;
const LOGIN_RE = /^[a-z0-9_.-]{3,20}$/;
function newId(){ return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1000); }
function enterAs(id, remember){
  setCur(id, remember);

  if (PENDING && pr) { pr.bot = PENDING.bot; if (PENDING.botName) pr.botName = PENDING.botName; PENDING = null; saveProfiles(); }
  if (pr && !pr.mk) { pr.mk = newMk(); saveProfiles(); }
  P = loadP(); if (!P.course.name) { P.course.name = curName(); saveP(); }
  updateHud(); INBOX = []; updateBell(); loadInbox();
  try { if (/^s-/.test(location.hash.slice(1))) history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
  if (pr && !pr.klass && !pr.klassAsked) return renderWho('klass');

function b36(n){ return Math.max(0, Math.round(n || 0)).toString(36); }

/* --- шифрование: личные сообщения в колокольчик видит только адресат --- */
const ENC = new TextEncoder();
function b64u(bytes){ return b64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function newMk(){ return b64u(crypto.getRandomValues(new Uint8Array(12))); }
async function sha256(s){ return new Uint8Array(await crypto.subtle.digest('SHA-256', ENC.encode(s))); }
async function midOf(mk){ return [...(await sha256('chek-mid:' + mk)).slice(0, 6)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function keyOf(mk){ return crypto.subtle.importKey('raw', await sha256('chek-inbox:' + mk), 'AES-GCM', false, ['encrypt', 'decrypt']); }
async function sealFor(mk, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await keyOf(mk), ENC.encode(JSON.stringify(obj))));
  return {to: await midOf(mk), iv: b64(iv), ct: b64(ct)};
}
async function openSealed(mk, m){ const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(m.iv)}, await keyOf(mk), unb64(m.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
function msgId(){ return Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

/* --- хранилище колокольчика: файл inbox.json в хранилище курса на GitHub --- */
function ghCfg(){ try { const g = JSON.parse(localStorage.getItem('chek-gh') || 'null'); return g && g.token ? g : null; } catch (_) { return null; } }
function inboxUrls(){ const g = ghCfg(); return [`https://raw.githubusercontent.com/${(g && g.repo) || GH_DEFAULT_REPO}/main/inbox.json`, 'inbox.json']; }
async function ghPush(add){
  const g = ghCfg(); if (!g) throw new Error('колокольчик не подключён');
  const url = `https://api.github.com/repos/${g.repo}/contents/inbox.json`;
  const H = {Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json'};
  for (let attempt = 0; attempt < 3; attempt++) {
    let sha = null, data = {v: 1, msgs: []};
    const r = await fetch(url + '?ref=main&t=' + Date.now(), {headers: H, cache: 'no-store'});
    if (r.ok) { const j = await r.json(); sha = j.sha; try { data = JSON.parse(new TextDecoder().decode(unb64(String(j.content || '').replace(/\s/g, '')))); } catch (_) {} }
    else if (r.status !== 404) throw new Error('GitHub ответил ' + r.status);
    data.msgs = (Array.isArray(data.msgs) ? data.msgs : []).concat(add).slice(-300);
    const body = {message: 'Сообщения Енота Чека', content: b64(ENC.encode(JSON.stringify(data))), branch: 'main'};
    if (sha) body.sha = sha;
    const p = await fetch(url, {method: 'PUT', headers: Object.assign({'Content-Type': 'application/json'}, H), body: JSON.stringify(body)});
    if (p.ok) return true;
    if (p.status !== 409 && p.status !== 422) throw new Error('GitHub ответил ' + p.status);
  }
  throw new Error('GitHub занят, попробуйте ещё раз');
}
async function ghCheck(g){
  try {
    const r = await fetch(`https://api.github.com/repos/${g.repo}`, {headers: {Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json'}});
    if (!r.ok) return r.status === 401 ? 'Ключ не подошёл — проверьте, что скопирован целиком.' : 'Хранилище не найдено — проверьте название.';
    const j = await r.json();
    return j.permissions && j.permissions.push ? '' : 'У ключа нет права записи (Contents: Read and write).';
  } catch (_) { return 'Нет связи с GitHub.'; }
}

/* --- колокольчик ученика --- */
let INBOX = [];
const BELL_SVG = '<svg class="ico bellico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
async function loadInbox(){
  const pr = curProf();
  if (!pr || !pr.mk) { INBOX = []; updateBell(); return; }
  let data = null;
  for (const u of inboxUrls()) { try { const r = await fetch(u + '?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) { data = await r.json(); break; } } catch (_) {} }
  const out = [];
  if (data && Array.isArray(data.msgs)) {
    const mid = await midOf(pr.mk);
    for (const m of data.msgs) {
      try {
        if (m.to === mid) out.push(Object.assign({id: m.id, at: m.at, own: true}, await openSealed(pr.mk, m)));
        else if (m.to === '*' || (pr.klass && m.to === 'k:' + pr.klass)) out.push({id: m.id, at: m.at, text: m.text, lesson: m.lesson, own: false});
      } catch (_) {}
    }
  }
  if (curProf() === pr) { INBOX = out.sort((a, b) => String(b.at).localeCompare(String(a.at))); updateBell(); }
}
function unreadInbox(){ const seen = (P && P.seen) || {}; return INBOX.filter(m => !seen[m.id]).length; }
function updateBell(){

  b.hidden = MODE === 'teacher' || !CUR;

let TROWS = [];
function journalRows(){ return Object.values(loadJ()).map(s => ({src: 'code', num: null, name: s.n, klass: s.klass || '', login: s.login || '', mk: s.mk || '', data: s, received: s.d || '', unread: 0})); }
function mergeRows(bot, code){
  const out = bot.map(s => { const d = s.data || {}; if (d.t) d.t = normT(d.t); return {src: 'bot', num: s.num, name: s.name, klass: s.klass, login: d.login || '', mk: d.mk || '', data: s.data, received: s.received || '', unread: s.unread || 0}; });
  for (const c of code) {
    const m = out.find(o => o.src !== 'code' && ((c.mk && o.mk === c.mk) || (c.login && o.login === c.login) || (o.name.trim().toLowerCase() === c.name.trim().toLowerCase() && (!c.klass || o.klass === c.klass))));
    if (m) {
      m.src = 'both'; m.mk = m.mk || c.mk; m.login = m.login || c.login;
      if (!m.data || String(c.data.d || '') > String(m.received || '').slice(0, 10)) { m.data = c.data; m.received = c.data.d || m.received; }
    } else out.push(c);
  }
  return out;
}
function sentKey(r){ return r.mk || r.login || (r.name + '|' + r.klass); }
function sentLog(r){ try { return (JSON.parse(localStorage.getItem('chek-sent') || '{}')[sentKey(r)]) || []; } catch (_) { return []; } }
function logSent(r, text){ try { const all = JSON.parse(localStorage.getItem('chek-sent') || '{}'); const k = sentKey(r); all[k] = (all[k] || []).concat([{at: new Date().toISOString(), text}]).slice(-100); localStorage.setItem('chek-sent', JSON.stringify(all)); } catch (_) {} }
function chanBadges(r){
  const tg = r.src !== 'code', bell = !!r.mk;
  return (tg ? '<span class="chan">Telegram</span>' : '') + (bell ? '<span class="chan">колокольчик</span>' : '') + (!tg && !bell ? '<span class="chan off">нет связи</span>' : '');
}
async function teacherSend(r, text, lesson){
  const res = [];
  if (r.src !== 'code' && r.num && TT) {
    try { const k = await (await tapi('/api/student/' + r.num + '/send', {method: 'POST', json: {text, lesson}})).json(); res.push(k.error ? 'Telegram: ' + k.error : 'в Telegram ✓'); }
    catch (_) { res.push('Telegram: нет связи с ботом'); }
  }
  if (r.mk && ghCfg()) {
    try { await ghPush([Object.assign({id: msgId(), at: new Date().toISOString()}, await sealFor(r.mk, {text, lesson: lesson ? +lesson : null}))]); res.push('в колокольчик ✓ (появится у ученика через 1–5 минут)'); }
    catch (e) { res.push('колокольчик: ' + e.message); }
  }
  if (res.length) logSent(r, text);
  return res.length ? 'Отправлено: ' + res.join(' · ') : 'Нет канала связи с этим учеником (см. подсказку ниже).';
}
async function teacherBroadcast(klass, text, lesson){
  const res = [];
  if (TT) {
    try { const k = await (await tapi('/api/broadcast', {method: 'POST', json: {klass: klass || '', lesson, text}})).json(); res.push(k.error ? 'Telegram: ' + k.error : `в Telegram: ${k.sent} из ${k.total}`); }
    catch (_) { res.push('Telegram: нет связи с ботом'); }
  }
  if (ghCfg()) {
    try { await ghPush([{to: klass ? 'k:' + klass : '*', id: msgId(), at: new Date().toISOString(), text, lesson: lesson ? +lesson : null}]); res.push('в колокольчик ✓'); }
    catch (e) { res.push('колокольчик: ' + e.message); }
  }
  return res.length ? 'Отправлено: ' + res.join(' · ') : 'Нет каналов: запустите бота или подключите колокольчик.';
}
function downloadCsv(rows, klass){
  const head = ['№', 'Класс', 'Ученик', 'Связь', 'Лапки', 'Звание', 'Уроков', 'Курс %'].concat(LESSONS.map(l => l.final ? 'Итог' : 'Урок ' + l.n), ['Результат от']);
  const lines = [head].concat(rows.map(r => { const d = r.data || {}; const t = (d.t || []).concat(Array(LESSONS.length).fill(null)).slice(0, LESSONS.length);
    return [r.num || '', r.klass, r.name, (r.src !== 'code' ? 'Telegram ' : '') + (r.mk ? 'колокольчик' : ''), d.p ?? '', d.r ?? '', d.l ?? '', d.c ?? ''].concat(t.map(v => v == null ? '' : v), [String(r.received || '').replace('T', ' ')]); }));
  const csv = '﻿' + lines.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `Енот Чек — ${klass ? 'класс ' + klass : 'все ученики'}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

    <div class="tchat" id="tchat">${chatHtml(history)}</div>
    <form class="form" id="tsend" style="max-width:none">
      <label class="field" for="tst">Личное сообщение<textarea id="tst" class="codebox" rows="3" required placeholder="Например: Отличный тест! Попробуй урок ${Math.min((d.l || 0) + 1, COURSE.length)}."></textarea></label>
      <label class="field" for="tsl">Кнопка урока (необязательно)<select id="tsl"><option value="">— без кнопки —</option>${lessonOpts()}</select></label>
      <p class="note" id="tsm" aria-live="polite"></p>
      <div class="actions"><button class="btn" type="submit"${!canTg && !canBell ? ' disabled' : ''}>Отправить</button></div>
    </form>
  </section>`;
  const scrollChat = () => { const c = $('#tchat'); if (c) c.scrollTop = c.scrollHeight; };
  scrollChat();
  if (focusWrite) { const ta = $('#tst'); if (ta) { if (ta.scrollIntoView) ta.scrollIntoView({block: 'center'}); ta.focus(); } }
  $('#t-back').onclick = () => renderTeacher(klass);
  const refresh = async () => {
    if (!$('#tchat')) return stopPoll();
    let msgs = sentLog(r).map(m => ({dir: 'out', text: m.text, at: m.at}));
    if (canTg) { try { const x = await tapi('/api/student/' + r.num); const k = await x.json(); if (k.messages) msgs = k.messages; } catch (_) {} }
    const c = $('#tchat'); if (c) { c.innerHTML = chatHtml(msgs); scrollChat(); }
  };
  if (canTg) TPOLL = setInterval(refresh, 15000);
  $('#tsend').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('#tst').value.trim(); if (!text) return;
    $('#tsm').textContent = 'Отправляю…';
    $('#tsm').textContent = await teacherSend(r, text, $('#tsl').value);
    if (/✓/.test($('#tsm').textContent)) { $('#tst').value = ''; refresh(); }
  };
  window.scrollTo(0, 0);
}

function route(){
  const h = location.hash.slice(1);
  if (h === 'teacher' || MODE === 'teacher') return renderTeacher();
  if (h === 'journal') return renderJournal();
  const sm = h.match(/^s-([a-z0-9]{6,16})(?:-([A-Za-z0-9_]{3,40}))?$/);
  if (sm) {
    const pr = PR.list.find(p => p.bot === sm[1]);
    if (pr && CUR === pr.id) { try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} return renderHome(); }
    PENDING = {bot: sm[1], botName: sm[2] || ''};
    return pr ? renderWho('pin', pr.id) : renderWho(PR.list.length ? 'list' : 'reg');
  }
  if (!CUR) return renderWho();
  const uk = COURSE.findIndex(u => u.id === h);
  if (uk >= 0 && unlocked(uk)) openStep(h, firstOpen(COURSE[uk]));
  else if (h === 'course') openCourse();
  else if (h === 'final' || CAT[h] || LES[h]) renderIntro(h); else if (h === 'achievements') renderAch(); else if (h === 'inbox') renderInbox(); else renderHome();
}
$('#hud').onclick = renderAch;
$('#bell').onclick = () => { stopPoll(); renderInbox(); loadInbox().then(() => { if ($('#i-refresh')) renderInbox(); }); };
setInterval(() => { if (CUR && MODE !== 'teacher' && !document.hidden) loadInbox(); }, 180000);
if (CUR) { const pr0 = curProf(); if (pr0 && !pr0.mk) { pr0.mk = newMk(); saveProfiles(); } loadInbox(); }
$('#mode-btn').onclick = () => { stopPoll(); if (MODE === 'teacher') { setMode('student'); route(); } else renderTeacher(); };
updateHud();
updateModeBtn();
window.addEventListener('hashchange', route);
route();
</script>
